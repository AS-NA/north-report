<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>倉儲運營進出貨登錄</title>
<style>
  :root{
    --bg:#F3F6FC; --panel:#FFFFFF; --panel-2:#EEF2FA; --line:#DCE3F0;
    --text:#1B2438; --text-mute:#6B7690;
    --accent:#2FA5D6; --accent-2:#8B7FEF; --green:#3AAE72; --red:#D9604B;
    --font-body:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --font-mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15px; padding-bottom:90px; }
  .topbar{ background:linear-gradient(135deg,#D7ECFB,#E8E3FB); padding:20px 20px 16px; border-bottom:1px solid var(--line); }
  .topbar .brand{ font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; color:var(--text-mute); }
  .topbar h1{ margin:4px 0 0; font-size:20px; }
  .tabs{ display:flex; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .tab{ flex:1; text-align:center; padding:13px 0; font-weight:700; color:var(--text-mute); border-bottom:3px solid transparent; cursor:pointer; }
  .tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .view{ display:none; padding:16px 20px; }
  .view.active{ display:block; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:14px; }
  .card h3{ margin:0 0 10px; font-size:14px; color:var(--text-mute); letter-spacing:.04em; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-top:1px dashed var(--line); }
  .row:first-of-type{ border-top:none; }
  .row label{ flex:1; font-size:14.5px; }
  .row input, .row select, .datein{ width:110px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; font-size:16px; text-align:right; background:var(--panel); color:var(--text); font-family:var(--font-body); }
  .row select{ text-align:left; }
  .datein{ width:100%; text-align:left; }
  .row .auto{ width:110px; text-align:right; font-weight:700; color:var(--accent-2); font-family:var(--font-mono); }
  .totalbar{ display:flex; justify-content:space-between; align-items:center; background:var(--panel-2); border-radius:10px; padding:10px 12px; margin-top:8px; font-weight:700; }
  .totalbar b{ font-family:var(--font-mono); font-size:20px; color:var(--accent); }
  .hint{ font-size:12.5px; color:var(--text-mute); margin-top:8px; }
  .hint.warn{ color:var(--red); }
  .submitbar{ position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:12px 20px calc(12px + env(safe-area-inset-bottom)); z-index:6; }
  .bigbtn{ width:100%; padding:15px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:16px; font-weight:700; cursor:pointer; font-family:var(--font-body); }
  .bigbtn:disabled{ opacity:.55; }
  .smallbtn{ padding:7px 12px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-size:13px; cursor:pointer; font-family:var(--font-body); }
  .status{ text-align:center; font-size:13px; margin-bottom:8px; min-height:18px; }
  .status.ok{ color:var(--green); } .status.err{ color:var(--red); }
  .reclist .rec{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-top:1px solid var(--line); }
  .reclist .rec:first-child{ border-top:none; }
  .rec .d{ font-weight:700; } .rec .m{ font-size:12.5px; color:var(--text-mute); margin-top:2px; }
  .kpis{ display:flex; gap:10px; margin-bottom:14px; }
  .kpi{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center; }
  .kpi .v{ font-size:21px; font-weight:800; font-family:var(--font-mono); color:var(--accent); }
  .kpi .l{ font-size:12px; color:var(--text-mute); margin-top:2px; }
  .barrow{ display:flex; align-items:center; gap:8px; margin:7px 0; font-size:13px; }
  .barrow .n{ width:74px; flex:none; } .barrow .t{ flex:1; height:10px; background:var(--panel-2); border-radius:6px; overflow:hidden; }
  .barrow .f{ height:100%; background:var(--accent); border-radius:6px; } .barrow .c{ width:54px; text-align:right; font-family:var(--font-mono); }
  .rangebar{ display:flex; gap:8px; margin-bottom:12px; }
  .rangebar .smallbtn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .placeholder{ text-align:center; color:var(--text-mute); padding:26px 0; font-size:14px; }
  .banner{ background:rgba(217,96,75,.12); border:1px solid var(--red); color:var(--red); padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:14px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">AIR SPACE・WAREHOUSE OPS</div>
    <h1>倉儲運營進出貨登錄</h1>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="entry">登錄</div>
    <div class="tab" data-tab="records">紀錄</div>
    <div class="tab" data-tab="dash">儀表板</div>
  </div>

  <div class="view active" id="view-entry">
    <div id="cfgBanner" class="banner" style="display:none;">還沒設定 Apps Script 網址：請把程式最上面的 API_URL 換成你部署後的網址。</div>
    <div class="card">
      <h3>登錄日期</h3>
      <input type="date" class="datein" id="dateIn">
      <div class="hint" id="dateHint"></div>
    </div>
    <div id="formArea"></div>
  </div>

  <div class="view" id="view-records">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div class="hint" id="recMeta" style="margin:0;"></div>
      <button class="smallbtn" id="reloadBtn">重新整理</button>
    </div>
    <div class="card reclist" id="recList"></div>
  </div>

  <div class="view" id="view-dash">
    <div class="rangebar" id="rangeBar">
      <button class="smallbtn active" data-days="7">近 7 天</button>
      <button class="smallbtn" data-days="14">近 14 天</button>
      <button class="smallbtn" data-days="30">近 30 天</button>
    </div>
    <div id="dashBody"></div>
  </div>

  <div class="submitbar" id="submitBar">
    <div class="status" id="statusLine"></div>
    <button class="bigbtn" id="submitBtn">送出登錄</button>
  </div>

<script>
(function(){
  // ====== 設定區 ======
  const API_URL = 'PASTE_APPS_SCRIPT_URL_HERE';   // ← 換成 Apps Script 部署後的網址
  const TRIP_OPTIONS = ['', '第1車', '第2車', '第3車', '第4車']; // 門市車次選項，可自行增減
  const CHANNELS = [
    ['officialDelivery','官網宅配'], ['officialPickup','官網超取'], ['intlDelivery','國際'],
    ['shopee','蝦皮'], ['rakuten','樂天'], ['amazon','亞馬遜'], ['b2bBorrow','B2B借貨'],
    ['storePickup','門市取貨'], ['storeB2B','門市B2B'], ['groupBuy','團購']
  ];
  const RETURN_FIELDS = [['returnIn','撤退貨進倉'], ['returnShelved','已上架數量']];
  const OTHER_FIELDS = [['storeReturn','門市撤貨'], ['weeklyCollect','周徵貨量']];
  // ====================

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');
  function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };

  let records = [];
  let dashDays = 7;

  // ---------- 分頁 ----------
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=> showTab(t.dataset.tab));
  });
  function showTab(name){
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===name));
    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+name));
    $('submitBar').style.display = name==='entry' ? 'block' : 'none';
    if(name==='records') renderRecords();
    if(name==='dash') renderDash();
    window.scrollTo(0,0);
  }

  // ---------- 表單 ----------
  function numRow(key,label){
    return `<div class="row"><label for="f_${key}">${label}</label><input type="number" inputmode="numeric" min="0" id="f_${key}" data-key="${key}" placeholder="0"></div>`;
  }
  function buildForm(){
    $('formArea').innerHTML = `
      <div class="card"><h3>進貨・各通路訂單量</h3>
        ${CHANNELS.map(([k,l])=>numRow(k,l)).join('')}
        <div class="totalbar"><span>訂單總計</span><b id="totalOut">0</b></div>
      </div>
      <div class="card"><h3>撤退貨</h3>
        ${RETURN_FIELDS.map(([k,l])=>numRow(k,l)).join('')}
        <div class="row"><label>未上架（自動計算）</label><div class="auto" id="remainOut">0</div></div>
      </div>
      <div class="card"><h3>門市・其他</h3>
        ${OTHER_FIELDS.map(([k,l])=>numRow(k,l)).join('')}
        <div class="row"><label for="f_trip">門市車次</label>
          <select id="f_trip" data-key="trip">${TRIP_OPTIONS.map(o=>`<option value="${esc(o)}">${o||'未選擇'}</option>`).join('')}</select></div>
        ${numRow('recoveredPackages','回收包裹數')}
      </div>`;
    document.querySelectorAll('#formArea input').forEach(i=> i.addEventListener('input', recalc));
  }
  function val(key){ const el = $('f_'+key); return el ? el.value : ''; }
  function recalc(){
    const total = CHANNELS.reduce((s,[k])=> s + num(val(k)), 0);
    $('totalOut').textContent = total;
    $('remainOut').textContent = Math.max(0, num(val('returnIn')) - num(val('returnShelved')));
  }
  function fillForm(dateStr){
    const rec = records.find(r=>r.date===dateStr);
    const keys = [...CHANNELS, ...RETURN_FIELDS, ...OTHER_FIELDS, ['trip'], ['recoveredPackages']].map(a=>a[0]);
    keys.forEach(k=>{
      const el = $('f_'+k); if(!el) return;
      const v = rec ? rec[k] : '';
      el.value = (v===undefined||v===null) ? '' : v;
    });
    $('dateHint').textContent = rec ? '⚠ 這一天已經有登錄資料，送出會覆蓋有填寫的欄位（沒填的欄位不會動）' : '這一天還沒有登錄資料';
    $('dateHint').className = 'hint' + (rec ? ' warn' : '');
    recalc();
  }
  $('dateIn').addEventListener('change', e=> fillForm(e.target.value));

  // ---------- 網路 ----------
  function apiReady(){ return API_URL && API_URL.indexOf('PASTE_')!==0; }
  async function fetchWithTimeout(url, opts, ms){
    const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
    try{ return await fetch(url, Object.assign({}, opts||{}, {signal:c.signal})); }
    finally{ clearTimeout(t); }
  }
  async function loadRecords(){
    if(!apiReady()){ $('cfgBanner').style.display='block'; return false; }
    try{
      const res = await fetchWithTimeout(API_URL + (API_URL.indexOf('?')>=0?'&':'?') + 't=' + Date.now(), {}, 15000);
      const json = await res.json();
      records = (json.records||[]).filter(r=>r.date);
      return true;
    }catch(e){ console.error(e); return false; }
  }
  function setStatus(msg, cls){ const s=$('statusLine'); s.textContent=msg; s.className='status '+(cls||''); }

  $('submitBtn').addEventListener('click', async ()=>{
    if(!apiReady()){ setStatus('還沒設定 Apps Script 網址', 'err'); return; }
    const date = $('dateIn').value;
    if(!date){ setStatus('請先選擇日期', 'err'); return; }
    const payload = { date };
    [...CHANNELS, ...RETURN_FIELDS, ...OTHER_FIELDS, ['recoveredPackages']].forEach(([k])=>{
      const v = val(k); if(v!=='') payload[k] = num(v);
    });
    if(val('trip')) payload.trip = val('trip');
    const anyChannel = CHANNELS.some(([k])=> val(k)!=='');
    if(anyChannel) payload.total = CHANNELS.reduce((s,[k])=> s+num(val(k)), 0);
    if(val('returnIn')!=='' || val('returnShelved')!=='') payload.returnRemaining = Math.max(0, num(val('returnIn')) - num(val('returnShelved')));
    if(Object.keys(payload).length<=1){ setStatus('還沒有填任何數字', 'err'); return; }

    const btn = $('submitBtn'); btn.disabled = true; btn.textContent = '送出中...'; setStatus('');
    let ok = false;
    for(let attempt=1; attempt<=2 && !ok; attempt++){
      try{
        const res = await fetchWithTimeout(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) }, 15000);
        const json = await res.json();
        if(json && json.success) ok = true; else throw new Error((json&&json.error)||'save failed');
      }catch(e){
        console.error(e);
        if(attempt===1) await new Promise(r=>setTimeout(r,1200));
      }
    }
    btn.disabled = false; btn.textContent = '送出登錄';
    if(ok){
      setStatus('✓ 已寫入大表（'+date+'）', 'ok');
      await loadRecords(); fillForm(date);
    }else{
      setStatus('送出失敗，請檢查網路後再按一次（畫面上的數字還在）', 'err');
    }
  });

  // ---------- 紀錄 ----------
  function renderRecords(){
    const list = [...records].sort((a,b)=> a.date<b.date?1:-1).slice(0,60);
    $('recMeta').textContent = list.length ? ('共 '+records.length+' 天資料，顯示最近 '+list.length+' 天') : '';
    $('recList').innerHTML = list.length ? list.map(r=>{
      const total = r.total!==''&&r.total!==undefined ? num(r.total) : CHANNELS.reduce((s,[k])=>s+num(r[k]),0);
      return `<div class="rec"><div><div class="d">${esc(r.date)}</div>
        <div class="m">訂單 ${total}・撤退貨進倉 ${num(r.returnIn)}・上架 ${num(r.returnShelved)}・${r.trip?esc(r.trip):'未選車次'}・回收包裹 ${num(r.recoveredPackages)}</div></div>
        <button class="smallbtn" data-edit="${esc(r.date)}">編輯</button></div>`;
    }).join('') : `<div class="placeholder">還沒有任何紀錄</div>`;
    document.querySelectorAll('#recList [data-edit]').forEach(b=>{
      b.addEventListener('click', ()=>{ $('dateIn').value = b.dataset.edit; fillForm(b.dataset.edit); showTab('entry'); });
    });
  }
  $('reloadBtn').addEventListener('click', async ()=>{
    $('recMeta').textContent = '載入中...';
    const ok = await loadRecords();
    if(!ok) $('recMeta').textContent = '載入失敗，請再試一次';
    renderRecords();
  });

  // ---------- 儀表板 ----------
  document.querySelectorAll('#rangeBar .smallbtn').forEach(b=>{
    b.addEventListener('click', ()=>{
      dashDays = +b.dataset.days;
      document.querySelectorAll('#rangeBar .smallbtn').forEach(x=>x.classList.toggle('active', x===b));
      renderDash();
    });
  });
  function renderDash(){
    const sorted = [...records].sort((a,b)=> a.date<b.date?-1:1);
    const rows = sorted.slice(-dashDays);
    if(!rows.length){ $('dashBody').innerHTML = `<div class="placeholder">還沒有資料可以統計</div>`; return; }
    const dayTotal = r => (r.total!==''&&r.total!==undefined) ? num(r.total) : CHANNELS.reduce((s,[k])=>s+num(r[k]),0);
    const totals = rows.map(dayTotal);
    const sum = totals.reduce((a,b)=>a+b,0);
    const returnIn = rows.reduce((s,r)=>s+num(r.returnIn),0);
    const shelved = rows.reduce((s,r)=>s+num(r.returnShelved),0);
    const chSum = CHANNELS.map(([k,l])=>({l, v: rows.reduce((s,r)=>s+num(r[k]),0)})).sort((a,b)=>b.v-a.v);
    const chMax = Math.max(1, ...chSum.map(x=>x.v));
    const tMax = Math.max(1, ...totals);
    const W = 320, H = 110, bw = W/rows.length;
    const bars = rows.map((r,i)=>{
      const h = Math.round(totals[i]/tMax*(H-18));
      return `<rect x="${(i*bw+bw*0.15).toFixed(1)}" y="${H-h-14}" width="${(bw*0.7).toFixed(1)}" height="${h}" rx="3" fill="var(--accent)"/>`
        + (rows.length<=14 ? `<text x="${(i*bw+bw/2).toFixed(1)}" y="${H-2}" font-size="8" text-anchor="middle" fill="var(--text-mute)">${r.date.slice(5)}</text>` : '');
    }).join('');
    $('dashBody').innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="v">${sum}</div><div class="l">訂單總量</div></div>
        <div class="kpi"><div class="v">${Math.round(sum/rows.length)}</div><div class="l">日均訂單</div></div>
        <div class="kpi"><div class="v">${returnIn?Math.round(shelved/returnIn*100):0}%</div><div class="l">撤退貨上架率</div></div>
      </div>
      <div class="card"><h3>每日訂單量</h3><svg viewBox="0 0 ${W} ${H}" width="100%">${bars}</svg></div>
      <div class="card"><h3>各通路合計</h3>
        ${chSum.map(x=>`<div class="barrow"><div class="n">${esc(x.l)}</div><div class="t"><div class="f" style="width:${Math.round(x.v/chMax*100)}%"></div></div><div class="c">${x.v}</div></div>`).join('')}
      </div>
      <div class="hint">統計範圍：${rows[0].date} ～ ${rows[rows.length-1].date}（共 ${rows.length} 天有登錄）</div>`;
  }

  // ---------- 啟動 ----------
  buildForm();
  $('dateIn').value = todayStr();
  fillForm(todayStr());
  loadRecords().then(ok=>{ if(ok){ fillForm($('dateIn').value); } else if(apiReady()){ setStatus('讀取大表失敗，仍可填寫後送出', 'err'); } });
})();
</script>
</body>
</html>
