<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>倉儲運營進出貨登錄</title>
<style>
  :root{
    --bg:#EEF4FB; --panel:#FFFFFF; --panel-2:#E6EFFA; --line:#BCCDE4;
    --text:#0B1730; --text-mute:#4A5B7A;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --accent:#0B6FDB; --accent-2:#6A3FE0; --green:#0E9F55; --orange:#E8620A; --red:#D42B1E;
    --font-body:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --font-mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:17px; padding-bottom:110px; }
  .topbar{ background:linear-gradient(135deg,#0B6FDB,#5B3FE0); padding:22px 20px 18px; color:#fff; }
  .topbar .brand{ font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; color:rgba(255,255,255,.8); }
  .topbar h1{ margin:5px 0 0; font-size:24px; color:#fff; }
  .tabs{ display:flex; background:var(--panel); border-bottom:2px solid var(--line); position:sticky; top:0; z-index:5; }
  .tab{ flex:1; text-align:center; padding:15px 0; font-size:17px; font-weight:800; color:var(--text-mute); border-bottom:4px solid transparent; cursor:pointer; }
  .tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .view{ display:none; padding:16px 16px; }
  .view.active{ display:block; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:0 2px 8px rgba(11,23,48,.07); }
  .card h3{ margin:0 0 12px; font-size:17px; font-weight:800; color:var(--text); }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px dashed var(--line); }
  .row:first-of-type{ border-top:none; }
  .row label{ flex:1; font-size:17px; font-weight:600; }
  .row input, .row select, .datein{ width:128px; padding:12px 12px; border:2px solid var(--line); border-radius:12px; font-size:22px; font-weight:800; text-align:right; background:#F8FBFF; color:var(--text); font-family:var(--font-body); }
  .row input:focus, .row select:focus, .datein:focus{ outline:none; border-color:var(--accent); background:#fff; }
  .row select{ text-align:left; font-size:18px; }
  .staffbox{ padding:10px 0; border-top:1px dashed var(--line); }
  .stitle{ font-size:17px; font-weight:700; margin-bottom:8px; }
  .srow{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .srow select{ flex:1; min-width:0; padding:12px; border:2px solid var(--line); border-radius:12px; font-size:18px; font-weight:700; background:#F8FBFF; color:var(--text); font-family:var(--font-body); }
  .srow input{ width:110px; padding:12px; border:2px solid var(--line); border-radius:12px; font-size:22px; font-weight:800; text-align:right; background:#F8FBFF; color:var(--text); font-family:var(--font-body); }
  .srow .sdel{ border:none; background:#EEF4FB; color:#64748b; border-radius:10px; width:38px; height:44px; font-size:16px; cursor:pointer; }
  .addbtn{ width:100%; padding:11px; border:2px dashed var(--accent); background:#F3F8FF; color:var(--accent); border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; }
  .staffsum{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:16px; font-weight:700; }
  .staffsum b{ font-size:24px; color:var(--accent-2); font-family:var(--font-mono); }
  .datein{ width:100%; text-align:left; font-size:20px; }
  .row .auto{ width:128px; text-align:right; font-weight:800; font-size:24px; color:var(--accent-2); font-family:var(--font-mono); }
  .totalbar{ display:flex; justify-content:space-between; align-items:center; background:#DCEBFF; border-radius:12px; padding:12px 14px; margin-top:10px; font-size:18px; font-weight:800; }
  .totalbar b{ font-family:var(--font-mono); font-size:32px; color:var(--accent); }
  .hint{ font-size:14.5px; color:var(--text-mute); margin-top:10px; line-height:1.5; }
  .hint.warn{ color:var(--red); font-weight:700; }
  .submitbar{ position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:2px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); z-index:6; }
  .bigbtn{ width:100%; padding:17px; border:none; border-radius:14px; background:linear-gradient(135deg,#0B6FDB,#2F8BFF); color:#fff; font-size:20px; font-weight:800; cursor:pointer; font-family:var(--font-body); }
  .bigbtn:disabled{ opacity:.55; }
  .smallbtn{ padding:10px 14px; border-radius:10px; border:2px solid var(--line); background:var(--panel); color:var(--text); font-size:15px; font-weight:700; cursor:pointer; font-family:var(--font-body); }
  .status{ text-align:center; font-size:15px; font-weight:700; margin-bottom:8px; min-height:20px; }
  .status.ok{ color:var(--green); } .status.err{ color:var(--red); }
  .reclist .rec{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:13px 0; border-top:1px solid var(--line); }
  .reclist .rec:first-child{ border-top:none; }
  .rec .d{ font-weight:800; font-size:18px; } .rec .m{ font-size:14.5px; color:var(--text-mute); margin-top:3px; line-height:1.5; }
  .kpis{ display:flex; gap:10px; margin-bottom:16px; }
  .kpi{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 6px; text-align:center; box-shadow:0 2px 8px rgba(11,23,48,.07); }
  .kpi .v{ font-size:32px; font-weight:800; font-family:var(--font-mono); color:var(--accent); }
  .kpi .l{ font-size:14px; color:var(--text-mute); margin-top:3px; font-weight:600; }
  .barrow{ display:flex; align-items:center; gap:8px; margin:10px 0; font-size:16px; font-weight:600; }
  .barrow .n{ width:86px; flex:none; } .barrow .t{ flex:1; height:14px; background:var(--panel-2); border-radius:8px; overflow:hidden; }
  .barrow .f{ height:100%; background:var(--accent); border-radius:8px; } .barrow .c{ width:60px; text-align:right; font-family:var(--font-mono); font-weight:800; font-size:17px; }
  .kpi .v.sm{ font-size:26px; } .kpi .dl{ font-size:12.5px; color:var(--text-mute); margin-top:4px; font-weight:600; } .kpi .dl.up{ color:#0A7A41; } .kpi .dl.dn{ color:#B3261E; }
  .barrow .c small{ display:block; font-size:11.5px; color:var(--text-mute); font-weight:600; } .barrow[data-tip]{ cursor:pointer; }
  .lgd{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13.5px; color:var(--text-mute); margin:-2px 0 8px; font-weight:600; } .lgd i{ display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  #vizTip{ position:fixed; z-index:50; display:none; background:#0B1730; color:#fff; padding:8px 11px; border-radius:10px; font-size:13.5px; line-height:1.5; white-space:pre-line; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.25); max-width:220px; }
  .dtbl{ border-collapse:collapse; width:100%; font-size:14px; } .dtbl th,.dtbl td{ padding:6px 8px; text-align:right; border-top:1px solid var(--line); white-space:nowrap; } .dtbl th:first-child,.dtbl td:first-child{ text-align:left; } .dtbl th{ color:var(--text-mute); font-weight:700; }
  details.card summary{ font-weight:800; font-size:16px; cursor:pointer; }
  .dashsvg text{ font-family:var(--font-mono); }
  .rangebar{ display:flex; gap:8px; margin-bottom:14px; }
  .rangebar .smallbtn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .placeholder{ text-align:center; color:var(--text-mute); padding:28px 0; font-size:16px; }
  .sumgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
  .sumcard{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 2px 8px rgba(11,23,48,.07); }
  .sumcard .ttl{ font-weight:800; font-size:17px; }
  .sumcard .ttl small{ color:var(--text-mute); font-weight:600; font-size:13px; }
  .pbar{ height:12px; background:var(--panel-2); border-radius:8px; overflow:hidden; margin:12px 0 8px; }
  .pbar i{ display:block; height:100%; border-radius:8px; }
  .sumcard .big{ font-weight:800; font-family:var(--font-mono); line-height:1.2; font-size:20px; }
  .sumcard .big .n{ font-size:38px; } .sumcard .big .of{ font-size:17px; }
  .sumcard .big .sub{ font-size:14.5px; font-family:var(--font-body); color:var(--text-mute); font-weight:700; margin-top:4px; }
  .sumcard .two{ display:flex; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); text-align:center; }
  .sumcard .two div{ flex:1; font-size:14px; color:var(--text-mute); font-weight:600; } .sumcard .two b{ display:block; font-size:28px; color:var(--text); font-family:var(--font-mono); margin-top:2px; white-space:nowrap; }
  .qtitle{ font-weight:800; font-size:18px; margin:4px 0 12px; }
  .qgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .qbtn{ border:none; border-radius:16px; padding:20px 14px; color:#fff; font-size:20px; font-weight:800; text-align:left; cursor:pointer; font-family:var(--font-body); box-shadow:0 3px 10px rgba(11,23,48,.18); }
  .qbtn small{ display:block; font-weight:600; font-size:13.5px; opacity:.92; margin-top:4px; }
  .q1{ background:linear-gradient(135deg,#0B6FDB,#3B9BFF); } .q2{ background:linear-gradient(135deg,#0A8A4A,#22C16F); }
  .q3{ background:linear-gradient(135deg,#DB5A06,#FF8A2B); } .q4{ background:linear-gradient(135deg,#5B2FD6,#8F6BFF); }
  .ovr{ display:flex; align-items:center; gap:10px; margin-top:12px; font-size:15px; font-weight:600; color:var(--text); }
  .ovr input{ width:22px; height:22px; }
  .banner{ background:#FDE7E4; border:2px solid var(--red); color:var(--red); padding:12px 14px; border-radius:12px; font-size:15px; font-weight:700; margin-bottom:16px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ border:2px solid var(--line); background:#F8FBFF; color:var(--text); border-radius:999px; padding:10px 16px; font-size:17px; font-weight:700; cursor:pointer; font-family:var(--font-body); }
  .chip.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .rfmsg{ min-height:22px; font-size:15px; font-weight:700; margin:4px 2px 10px; } .rfmsg.err{ color:var(--red); } .rfmsg.ok{ color:var(--green); }
  .rfcard{ background:var(--panel); border:1px solid var(--line); border-left:6px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:0 2px 8px rgba(11,23,48,.07); }
  .rfcard.doing{ border-left-color:var(--orange); } .rfcard.done{ border-left-color:var(--green); }
  .rftop{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .rftop .nm{ font-size:19px; font-weight:800; } .rftop .cd{ font-size:14px; color:var(--text-mute); font-family:var(--font-mono); font-weight:700; }
  .rfbadge{ font-size:14px; font-weight:800; padding:4px 10px; border-radius:999px; background:var(--panel-2); color:var(--text-mute); white-space:nowrap; }
  .rfcard.doing .rfbadge{ background:#FFE9D9; color:var(--orange); } .rfcard.done .rfbadge{ background:#DDF5E8; color:var(--green); }
  .rfrow{ display:flex; align-items:center; gap:10px; margin:6px 0; } .rfrow label{ flex:1; font-size:16px; font-weight:700; }
  .rfrow input{ width:110px; padding:10px 12px; border:2px solid var(--line); border-radius:12px; font-size:22px; font-weight:800; text-align:right; background:#F8FBFF; color:var(--text); font-family:var(--font-body); }
  .rfdiff{ font-size:14px; font-weight:800; min-width:64px; text-align:right; } .rfdiff.ok{ color:var(--green); } .rfdiff.bad{ color:var(--red); }
  .rftimes{ font-size:16px; font-weight:700; margin:10px 0; display:flex; flex-wrap:wrap; gap:6px 16px; font-family:var(--font-mono); }
  .rftimes a{ color:var(--accent); text-decoration:none; margin-left:4px; cursor:pointer; }
  .rfbtns{ display:flex; gap:8px; }
  .rfbtns button{ flex:1; padding:13px 6px; border:none; border-radius:12px; font-size:17px; font-weight:800; color:#fff; cursor:pointer; font-family:var(--font-body); }
  .rfbtns button[data-act="save"]{ background:#64748b; } .rfbtns button[data-act="start"]{ background:var(--orange); } .rfbtns button[data-act="end"]{ background:var(--green); }
  .rfbtns button:disabled{ opacity:.35; cursor:not-allowed; }
  .wknav{ display:flex; align-items:center; gap:8px; } .wksel{ flex:1; min-width:0; text-align:center; text-align-last:center; font-size:17px; font-weight:800; font-family:var(--font-mono); padding:10px 8px; border:1.5px solid var(--line,#c5d2e6); border-radius:12px; background:#fff; color:inherit; } .wklbl{ flex:1; text-align:center; font-size:19px; font-weight:800; font-family:var(--font-mono); }
  .rfwho{ font-size:13.5px; color:var(--text-mute); margin-top:8px; font-weight:600; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">AIR SPACE・WAREHOUSE OPS</div>
    <h1>倉儲運營進出貨登錄</h1>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="entry">登錄</div>
    <div class="tab" data-tab="records">紀錄</div>
    <div class="tab" data-tab="dash">儀表板</div>
    <div class="tab" data-tab="refurb">門市整新</div>
  </div>

  <div class="view active" id="view-entry">
    <div id="cfgBanner" class="banner" style="display:none;">還沒設定 Apps Script 網址：請把程式最上面的 API_URL 換成你部署後的網址。</div>
    <div class="sumgrid">
      <div class="sumcard"><div class="ttl">今日進貨 <small>(撤退貨)</small></div>
        <div class="pbar"><i id="inBar" style="width:0%;background:var(--green)"></i></div>
        <div class="big" id="inTxt">-</div>
        <div class="two"><div>待上架<b id="inWait">-</b></div><div>已上架<b id="inDone">-</b></div></div></div>
      <div class="sumcard"><div class="ttl">今日出貨 <small>(訂單)</small></div>
        <div class="pbar"><i id="outBar" style="width:0%;background:var(--orange)"></i></div>
        <div class="big" id="outTxt">-</div>
        <div class="two"><div>撤貨出倉<b id="outPkg">-</b></div><div>撤貨處理<b id="outTrip">-</b></div></div></div>
    </div>
    <div class="qtitle">快捷功能區</div>
    <div class="qgrid">
      <button class="qbtn q1" id="qEntry" type="button">登錄資料<small>填寫今日數量</small></button>
      <button class="qbtn q2" id="qRecords" type="button">歷史紀錄<small>查詢與編輯</small></button>
      <button class="qbtn q3" id="qDash" type="button">數據儀表板<small>趨勢與通路</small></button>
      <button class="qbtn q4" id="qReload" type="button">重新整理<small>同步大表資料</small></button>
    </div>
    <div class="card" id="dateCard">
      <h3>登錄日期</h3>
      <input type="date" class="datein" id="dateIn">
      <label class="ovr"><input type="checkbox" id="ovrChk"> 修正模式（輸入的數字會「取代」大表上的數字）</label>
      <div class="hint" id="dateHint"></div>
    </div>
    <div id="formArea"></div>
  </div>

  <div class="view" id="view-records">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div class="hint" id="recMeta" style="margin:0;"></div>
      <button class="smallbtn" id="reloadBtn">重新整理</button>
    </div>
    <div class="card reclist" id="recList"></div>
  </div>

  <div class="view" id="view-dash">
    <div class="rangebar" id="rangeBar">
      <button class="smallbtn active" data-days="7">近 7 天</button>
      <button class="smallbtn" data-days="14">近 14 天</button>
      <button class="smallbtn" data-days="30">近 30 天</button>
      <button class="smallbtn" data-days="90">近 90 天</button>
    </div>
    <div id="dashBody"></div>
  </div>

  <div class="view" id="view-refurb">
    <div class="card"><h3>整理週別</h3>
      <div class="wknav"><button type="button" id="rfPrev" class="smallbtn">‹ 上週</button><select id="rfWeekSel" class="wksel" aria-label="選擇週別"></select><button type="button" id="rfNext" class="smallbtn">下週 ›</button></div></div>
    <div class="card"><h3>今天整理的同仁 <small style="color:var(--text-mute);font-weight:600;">（輪值，最多選 2 位）</small></h3><div class="chips" id="rfStaff"></div></div>
    <div class="rangebar" id="rfGroups"></div>
    <div class="card" id="rfSum"></div>
    <div class="rfmsg" id="rfMsg"></div>
    <div id="rfList"></div>
  </div>

  <div class="submitbar" id="submitBar">
    <div class="status" id="statusLine"></div>
    <button class="bigbtn" id="submitBtn">送出登錄</button>
  </div>

<script>
(function(){
  // ====== 設定區 ======
  const API_URL = 'https://script.google.com/macros/s/AKfycby-YJ7-cJ5kiRUmdupupCw_840W5XaoHfIhCFInTVuu0Qs1pe8URr5jK3vI3UKNbegD/exec';   // ← 換成 Apps Script 部署後的網址
  const STAFF_OPTIONS = ['鄭文菁', '管育芝', '謝蕾', '楊裕萱', '林子庭', '陳泓達']; // 門市撤貨處理的同仁名單，可自行增減 // 門市撤貨處理的同仁名單，請改成實際名字，可自行增減
  const CHANNELS = [
    ['officialDelivery','官網宅配'], ['officialPickup','官網超取'], ['intlDelivery','國際宅配'],
    ['shopee','蝦皮'], ['rakuten','樂天'], ['amazon','亞馬遜'], ['b2bBorrow','商借B2B'],
    ['storePickup','門市店取'], ['storeB2B','門市B2B'], ['groupBuy','團購']
  ];
  const RETURN_FIELDS = [['returnIn','撤退貨進倉'], ['returnShelved','上架數量']];
  const OTHER_FIELDS = [['weeklyCollect','周徵貨量'], ['storeReturn','門市撤貨進倉']];
  // ====================

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');
  function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };

  let records = [];
  let dashDays = 7;

  // ---------- 分頁 ----------
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=> showTab(t.dataset.tab));
  });
  function showTab(name){
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===name));
    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+name));
    $('submitBar').style.display = name==='entry' ? 'block' : 'none';
    if(name==='records') renderRecords();
    if(name==='dash'){ renderDash(); if(!rfStores.length && apiReady()) loadRefurb().then(renderDashRf); }
    if(name==='refurb') loadRefurb();
    window.scrollTo(0,0);
  }

  // ---------- 表單 ----------
  function numRow(key,label){
    return `<div class="row"><label for="f_${key}">${label}</label><input type="number" inputmode="numeric" min="0" id="f_${key}" data-key="${key}" placeholder="0"></div>`;
  }
  function buildForm(){
    $('formArea').innerHTML = `
      <div class="card"><h3>進貨・各通路訂單量</h3>
        ${CHANNELS.map(([k,l])=>numRow(k,l)).join('')}
        <div class="totalbar"><span>訂單總計</span><b id="totalOut">0</b></div>
      </div>
      <div class="card"><h3>撤退貨</h3>
        ${RETURN_FIELDS.map(([k,l])=>numRow(k,l)).join('')}
        <div class="row"><label>剩餘未上架數量（自動計算）</label><div class="auto" id="remainOut">0</div></div>
      </div>
      <div class="card"><h3>新富倉</h3>
        ${OTHER_FIELDS.map(([k,l])=>numRow(k,l)).join('')}
        <div class="staffbox"><div class="stitle">門市撤貨處理量（可分同仁）</div>
          <div id="staffRows"></div>
          <button type="button" id="addStaff" class="addbtn">＋ 新增同仁</button>
          <div class="staffsum"><span>處理量合計</span><b id="staffTotal">0</b></div></div>
        ${numRow('recoveredPackages','撤貨出倉數量')}
        ${numRow('newArrival','新品上架')}
      </div>`;
    document.querySelectorAll('#formArea input').forEach(i=> i.addEventListener('input', recalc));

  function staffOptsHtml(sel){
    const list = STAFF_OPTIONS.slice(); if(sel && list.indexOf(sel)<0) list.push(sel);
    return '<option value="">選同仁</option>' + list.map(n=>'<option value="'+esc(n)+'"'+(n===sel?' selected':'')+'>'+esc(n)+'</option>').join('');

  function addStaffRow(name, qty){
    const d = document.createElement('div'); d.className = 'srow';
    d.innerHTML = '<select class="sname">'+staffOptsHtml(name)+'</select><input type="number" inputmode="numeric" min="0" class="sqty" placeholder="0" value="'+(qty===''||qty==null?'':esc(String(qty)))+'"><button type="button" class="sdel" aria-label="刪除">✕</button>';

  function setStaffRows(list){
    $('staffRows').innerHTML = '';
    (list && list.length ? list : [{name:'',qty:''}]).forEach(x=>addStaffRow(x.name, x.qty));

  function readStaff(){
    const detail = {}; let total = 0;
    document.querySelectorAll('#staffRows .srow').forEach(r=>{
      const q = num(r.querySelector('.sqty').value); if(!q) return;
      const n = (r.querySelector('.sname').value || '未指定').replace(/[:、,]/g,'');
      detail[n] = (detail[n]||0) + q; total += q;
    });
    return { detail, total };
  }
  function parseDetail(txt){
    return String(txt||'').split('、').map(t=>{ const i=t.lastIndexOf(':'); return i>0 ? {name:t.slice(0,i), qty:num(t.slice(i+1))} : null; }).filter(Boolean);
  }
  function val(key){ const el = $('f_'+key); return el ? el.value : ''; }
  function recalc(){
    const total = CHANNELS.reduce((s,[k])=> s + num(val(k)), 0);
    $('totalOut').textContent = total;
    if($('staffTotal')) $('staffTotal').textContent = readStaff().total;
    $('remainOut').textContent = Math.max(0, num(val('returnIn')) - num(val('returnShelved')));
  }
  function renderSummary(dateStr){
    const r = records.find(x=>x.date===dateStr);
    const sorted = [...records].sort((a,b)=> a.date<b.date?-1:1).filter(x=>x.date<dateStr).slice(-7);
    const dt = x => (x.total!==''&&x.total!==undefined) ? num(x.total) : CHANNELS.reduce((s,[k])=>s+num(x[k]),0);
    const rin = r?num(r.returnIn):0, rsh = r?num(r.returnShelved):0, tot = r?dt(r):0;
    const avg = sorted.length ? sorted.reduce((s,x)=>s+dt(x),0)/sorted.length : 0;
    $('inBar').style.width = (rin? Math.min(100,Math.round(rsh/rin*100)):0)+'%';
    $('inTxt').innerHTML = r ? ('<span class="n">'+rsh+'</span><span class="of"> / '+rin+' 件</span><div class="sub">上架率 '+(rin?Math.round(rsh/rin*100):0)+'%</div>') : '尚未登錄';
    $('inWait').textContent = r ? Math.max(0,rin-rsh) : '-'; $('inDone').textContent = r ? rsh : '-';
    $('outBar').style.width = (avg? Math.min(100,Math.round(tot/avg*100)):(tot?100:0))+'%';
    $('outTxt').innerHTML = r ? ('<span class="n">'+tot+'</span><span class="of"> 單</span><div class="sub">'+(avg?'近7日均 '+Math.round(avg):'今日合計')+'</div>') : '尚未登錄';
    $('outPkg').textContent = r ? num(r.recoveredPackages) : '-'; $('outTrip').textContent = r ? num(r.storeHandle) : '-';
  }
  $('qEntry').addEventListener('click', ()=> $('dateCard').scrollIntoView({behavior:'smooth'}));
  $('qRecords').addEventListener('click', ()=> showTab('records'));
  $('qDash').addEventListener('click', ()=> showTab('dash'));
  $('qReload').addEventListener('click', async ()=>{ setStatus('同步中...'); const ok = await loadRecords(); fillForm($('dateIn').value); setStatus(ok?'✓ 已同步':'同步失敗', ok?'ok':'err'); });

  function fillForm(dateStr){
    const rec = records.find(r=>r.date===dateStr);
    const ovr = $('ovrChk').checked;
    const keys = [...CHANNELS, ...RETURN_FIELDS, ...OTHER_FIELDS, ['recoveredPackages'], ['newArrival']].map(a=>a[0]);
    keys.forEach(k=>{
      const el = $('f_'+k); if(!el) return;
      const v = (ovr && rec) ? rec[k] : '';
      el.value = (v===undefined||v===null) ? '' : v;
    });
    let rows = [];
    if(ovr && rec){ rows = parseDetail(rec.storeHandleDetail); if(!rows.length && num(rec.storeHandle)) rows = [{name:'', qty:num(rec.storeHandle)}]; }
    setStaffRows(rows);
    if(ovr){
      $('dateHint').textContent = rec ? '修正模式：下面是大表目前的數字，改完送出會直接取代' : '這一天還沒有登錄資料';
      $('dateHint').className = 'hint warn';
    }else{
      $('dateHint').textContent = rec ? '這一天已有登錄：這次填的數字會「累加」到大表（上面進度卡是目前累計）' : '這一天還沒有登錄資料，送出後會新增一列';
      $('dateHint').className = 'hint';
    }
    recalc(); renderSummary(dateStr);
  }
  $('ovrChk').addEventListener('change', ()=> fillForm($('dateIn').value));
  $('dateIn').addEventListener('change', e=> fillForm(e.target.value));

  // ---------- 網路 ----------
  function apiReady(){ return API_URL && API_URL.indexOf('PASTE_')!==0; }
  async function fetchWithTimeout(url, opts, ms){
    const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
    try{ return await fetch(url, Object.assign({}, opts||{}, {signal:c.signal})); }
    finally{ clearTimeout(t); }
  }
  async function loadRecords(){
    if(!apiReady()){ $('cfgBanner').style.display='block'; return false; }
    try{
      const res = await fetchWithTimeout(API_URL + (API_URL.indexOf('?')>=0?'&':'?') + 't=' + Date.now(), {}, 15000);
      const json = await res.json();
      // 大表是預先排好整年日期的，沒填資料的日子不算「有登錄」
      const hasData = r => CHANNELS.some(([k])=>num(r[k])) || ['returnIn','returnShelved','storeReturn','weeklyCollect','recoveredPackages','newArrival','storeHandle'].some(k=>num(r[k]));
      records = (json.records||[]).filter(r=>r.date && hasData(r));
      return true;
    }catch(e){ console.error(e); return false; }
  }
  function setStatus(msg, cls){ const s=$('statusLine'); s.textContent=msg; s.className='status '+(cls||''); }

  $('submitBtn').addEventListener('click', async ()=>{
    if(!apiReady()){ setStatus('還沒設定 Apps Script 網址', 'err'); return; }
    const date = $('dateIn').value;
    if(!date){ setStatus('請先選擇日期', 'err'); return; }
    const payload = { date, mode: $('ovrChk').checked ? 'overwrite' : 'add' };
    [...CHANNELS, ...RETURN_FIELDS, ...OTHER_FIELDS, ['recoveredPackages'], ['newArrival','新品上架']].forEach(([k])=>{
      const v = val(k); if(v!=='') payload[k] = num(v);
    });
    const st = readStaff(); if(st.total){ payload.storeHandle = st.total; payload.storeHandleDetail = st.detail; }
    const anyChannel = CHANNELS.some(([k])=> val(k)!=='');
    if(anyChannel) payload.total = CHANNELS.reduce((s,[k])=> s+num(val(k)), 0);
    if(val('returnIn')!=='' || val('returnShelved')!=='') payload.returnRemaining = Math.max(0, num(val('returnIn')) - num(val('returnShelved')));
    if(Object.keys(payload).length<=1){ setStatus('還沒有填任何數字', 'err'); return; }

    const btn = $('submitBtn'); btn.disabled = true; btn.textContent = '送出中...'; setStatus('');
    let ok = false, serverMode = null, serverCols = 0, lastErr = '';
    for(let attempt=1; attempt<=2 && !ok; attempt++){
      try{
        const res = await fetchWithTimeout(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) }, 15000);
        const json = await res.json();
        if(json && json.success){ ok = true; serverMode = json.mode || null; serverCols = json.cols || 0; } else throw new Error((json&&json.error)||'save failed');
      }catch(e){
        console.error(e);
        lastErr = (e && e.name==='AbortError') ? '連線逾時' : String((e && e.message) || e);
        if(attempt===1) await new Promise(r=>setTimeout(r,1200));
      }
    }
    btn.disabled = false; btn.textContent = '送出登錄';
    if(ok){
      if(serverMode && serverCols < 21) setStatus('⚠ 大表程式不是最新版（還不認識「新品上架」或「門市撤貨處理量」）：請把新版 Apps Script 貼上、儲存，再「管理部署作業 → 編輯 → 新版本」部署', 'err');
      else if(!serverMode) setStatus('⚠ 已寫入，但大表程式還是舊版（不會累加）：請到 Apps Script 重新部署新版本，並確認網址是同一個部署', 'err');
      else setStatus($('ovrChk').checked ? '✓ 已修正大表（'+date+'）' : '✓ 已累加到大表（'+date+'）', 'ok');
      await loadRecords(); fillForm(date);
    }else{
      setStatus('送出失敗：'+lastErr+'（畫面上的數字還在，可再按一次）', 'err');
    }
  });

  // ---------- 紀錄 ----------
  function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function recRowHtml(r){
    const total = r.total!==''&&r.total!==undefined ? num(r.total) : CHANNELS.reduce((s,[k])=>s+num(r[k]),0);
    return `<div class="rec"><div><div class="d">${esc(r.date)}</div>
      <div class="m">訂單 ${total}・撤退貨進倉 ${num(r.returnIn)}・上架 ${num(r.returnShelved)}・門市撤貨處理 ${num(r.storeHandle)}・撤貨出倉 ${num(r.recoveredPackages)}・新品上架 ${num(r.newArrival)}</div></div>
      <button class="smallbtn" data-edit="${esc(r.date)}">編輯</button></div>`;
  }
  function renderRecords(){
    const end = new Date(); const start = new Date(); start.setDate(start.getDate()-59);
    const startS = ymd(start), endS = ymd(end);
    const inRange = records.filter(r=> r.date>=startS && r.date<=endS).sort((a,b)=> a.date<b.date?1:-1);
    const outside = records.filter(r=> !(r.date>=startS && r.date<=endS)).sort((a,b)=> a.date<b.date?1:-1);
    $('recMeta').textContent = '近 60 天（'+startS+' ～ '+endS+'）共 '+inRange.length+' 天有資料';
    let html = inRange.length ? inRange.map(recRowHtml).join('') : `<div class="placeholder">這 60 天內還沒有任何紀錄</div>`;
    if(outside.length){
      html += `<div class="hint warn" style="margin:14px 0 4px;">⚠ 另有 ${outside.length} 筆日期不在這 60 天內（未來日期或太久以前），可能是日期填錯，請確認：</div>` + outside.map(recRowHtml).join('');
    }
    $('recList').innerHTML = html;
    document.querySelectorAll('#recList [data-edit]').forEach(b=>{
      b.addEventListener('click', ()=>{ $('dateIn').value = b.dataset.edit; fillForm(b.dataset.edit); showTab('entry'); });
    });
  }
  $('reloadBtn').addEventListener('click', async ()=>{
    $('recMeta').textContent = '載入中...';
    const ok = await loadRecords();
    if(!ok) $('recMeta').textContent = '載入失敗，請再試一次';
    renderRecords();
  });

  // ---------- 儀表板 ----------
  document.querySelectorAll('#rangeBar .smallbtn').forEach(b=>{
    b.addEventListener('click', ()=>{
      dashDays = +b.dataset.days;
      document.querySelectorAll('#rangeBar .smallbtn').forEach(x=>x.classList.toggle('active', x===b));
      renderDash();
    });
  });
  // 圖表配色（驗證過：色盲可分辨；淺色在白底上對比偏低，所以都有圖例、數字與點一下的提示）
  const VG = [
    {n:'官網',     keys:['officialDelivery','officialPickup','intlDelivery'], c:'var(--s1)'},
    {n:'電商平台', keys:['shopee','rakuten','amazon'],                         c:'var(--s2)'},
    {n:'門市／B2B', keys:['b2bBorrow','storePickup','storeB2B','groupBuy'],      c:'var(--s3)'}
  ];
  const WD = ['日','一','二','三','四','五','六'];
  const dowOf = ds => { const [y,m,d]=ds.split('-').map(Number); return new Date(y,m-1,d).getDay(); };
  const chTotal = r => CHANNELS.reduce((s,[k])=>s+num(r[k]),0);
  const fmt = n => Math.round(n).toLocaleString('en-US');

  // 點一下（或滑過）圖表就跳出數字
  (function(){
    const tip = document.createElement('div'); tip.id='vizTip'; document.body.appendChild(tip);
    function show(t){
      tip.textContent = t.dataset.tip; tip.style.display='block';
      const b = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
      let x = b.left + b.width/2 - w/2; x = Math.max(8, Math.min(window.innerWidth - w - 8, x));
      let y = b.top - h - 8; if(y < 8) y = b.bottom + 8;
      tip.style.left = x+'px'; tip.style.top = y+'px';
    }
    document.addEventListener('click', e=>{ const t = e.target.closest('[data-tip]'); if(t) show(t); else tip.style.display='none'; });
    document.addEventListener('mouseover', e=>{ const t = e.target.closest && e.target.closest('[data-tip]'); if(t) show(t); });
    window.addEventListener('scroll', ()=>{ tip.style.display='none'; }, {passive:true});
  })();

  function hbars(items, color, unit){   // 橫條：[{l, v, sub?}]
    const mx = Math.max(1, ...items.map(x=>x.v));
    return items.map(x=>`<div class="barrow" data-tip="${esc(x.l)}：${fmt(x.v)}${unit||''}${x.sub?'\n'+esc(x.sub):''}"><div class="n">${esc(x.l)}</div><div class="t"><div class="f" style="width:${Math.round(x.v/mx*100)}%;${color?'background:'+color:''}"></div></div><div class="c">${fmt(x.v)}${x.pct!==undefined?`<small>${x.pct}%</small>`:''}</div></div>`).join('');
  }
  function legend(items){ return `<div class="lgd">${items.map(i=>`<span><i style="background:${i.c}"></i>${esc(i.n)}</span>`).join('')}</div>`; }

  function renderDash(){
    // 依「日曆」算最近 N 天（含今天），沒登錄的日子留空
    const fmtD = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    const days = [], prevDays = [];
    for(let i=dashDays-1;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(fmtD(d)); }
    for(let i=dashDays*2-1;i>=dashDays;i--){ const d = new Date(); d.setDate(d.getDate()-i); prevDays.push(fmtD(d)); }
    const byDate = {}; records.forEach(r=>{ byDate[r.date] = r; });
    const slots = days.map(d=> ({ date:d, rec: byDate[d] || null }));
    const rows = slots.filter(s=>s.rec).map(s=>s.rec);
    if(!rows.length){ $('dashBody').innerHTML = `<div class="placeholder">${days[0]} ～ ${days[days.length-1]} 這段時間還沒有登錄資料</div>`; return; }

    const totals = slots.map(s=> s.rec ? chTotal(s.rec) : 0);
    const sum = totals.reduce((a,b)=>a+b,0);
    const prevSum = prevDays.reduce((s,d)=> s + (byDate[d] ? chTotal(byDate[d]) : 0), 0);
    const prevCnt = prevDays.filter(d=>byDate[d]).length;
    const delta = prevSum>0 ? Math.round((sum-prevSum)/prevSum*100) : null;
    const S = k => rows.reduce((s,r)=>s+num(r[k]),0);
    const returnIn = S('returnIn'), shelved = S('returnShelved');
    const pending = Math.max(0, returnIn - shelved);
    const peakI = totals.indexOf(Math.max(...totals));

    // 1) 每日訂單量（依通路群組堆疊）
    const W = 320, H = 170, top = 18, bot = 22, ph = H-top-bot, bw = W/slots.length, few = slots.length<=14;
    const tMax = Math.max(1, ...totals);
    const dayBars = slots.map((s,i)=>{
      const x = i*bw, cx = x+bw/2;
      const lab = (few || i%Math.ceil(slots.length/7)===0) ? `<text x="${cx.toFixed(1)}" y="${H-6}" font-size="10.5" text-anchor="middle" fill="var(--text-mute)">${s.date.slice(5).replace('-','/')}</text>` : '';
      if(!s.rec) return lab;
      let y = top+ph, out = '';
      VG.forEach(g=>{
        const v = g.keys.reduce((a,k)=>a+num(s.rec[k]),0), h = v/tMax*ph;
        if(h<=0) return;
        y -= h;
        out += `<rect x="${(x+bw*0.14).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.72).toFixed(1)}" height="${h.toFixed(1)}" fill="${g.c}" stroke="#fff" stroke-width="1.2"/>`;
      });
      const tip = s.date.slice(5).replace('-','/')+'（週'+WD[dowOf(s.date)]+'）\n'+VG.map(g=>g.n+' '+fmt(g.keys.reduce((a,k)=>a+num(s.rec[k]),0))).join('\n')+'\n合計 '+fmt(totals[i]);
      const num_ = (few||i===peakI) ? `<text x="${cx.toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="${few?11:11}" font-weight="700" text-anchor="middle" fill="var(--text)">${fmt(totals[i])}</text>` : '';
      return out + num_ + lab + `<rect x="${x.toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H-bot}" fill="transparent" data-tip="${esc(tip)}"/>`;
    }).join('');

    // 2) 通路占比
    const chSum = CHANNELS.map(([k,l])=>({l, v:S(k)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).map(x=>({...x, pct: sum?Math.round(x.v/sum*100):0}));

    // 3) 星期別平均
    const wdAgg = Array.from({length:7},()=>({s:0,n:0}));
    slots.forEach((s,i)=>{ if(s.rec){ const w=dowOf(s.date); wdAgg[w].s+=totals[i]; wdAgg[w].n++; } });
    const wdAvg = [1,2,3,4,5,6,0].map(w=>({l:'週'+WD[w], v: wdAgg[w].n ? wdAgg[w].s/wdAgg[w].n : 0, n: wdAgg[w].n}));
    const wdMax = Math.max(1,...wdAvg.map(x=>x.v));
    const wdCols = wdAvg.map((x,i)=>{
      const h = Math.round(x.v/wdMax*80), cx = 22+i*44;
      return `<g data-tip="${x.l} 平均 ${fmt(x.v)} 單\n（${x.n} 天有登錄）"><rect x="${cx-14}" y="${100-h}" width="28" height="${h}" rx="4" fill="var(--s1)" opacity="${x.v===wdMax?1:.55}"/><text x="${cx}" y="${96-h}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--text)">${x.n?fmt(x.v):'-'}</text><text x="${cx}" y="116" font-size="11.5" text-anchor="middle" fill="var(--text-mute)">${x.l}</text><rect x="${cx-22}" y="0" width="44" height="120" fill="transparent"/></g>`;
    }).join('');

    // 4) 撤退貨：每日進倉 vs 上架
    const rMax = Math.max(1, ...slots.map(s=>s.rec?Math.max(num(s.rec.returnIn),num(s.rec.returnShelved)):0));
    const rH = 120, rbw = W/slots.length;
    const retBars = slots.map((s,i)=>{
      const x = i*rbw; if(!s.rec) return '';
      const a = num(s.rec.returnIn), b = num(s.rec.returnShelved);
      const ha = a/rMax*(rH-34), hb = b/rMax*(rH-34), w = rbw*0.34;
      const lab = (few || i%Math.ceil(slots.length/7)===0) ? `<text x="${(x+rbw/2).toFixed(1)}" y="${rH-4}" font-size="10.5" text-anchor="middle" fill="var(--text-mute)">${s.date.slice(5).replace('-','/')}</text>` : '';
      const tip = s.date.slice(5).replace('-','/')+'\n撤退貨進倉 '+fmt(a)+'\n上架數量 '+fmt(b)+'\n未上架 '+fmt(Math.max(0,a-b));
      return `<rect x="${(x+rbw*0.12).toFixed(1)}" y="${(rH-20-ha).toFixed(1)}" width="${w.toFixed(1)}" height="${ha.toFixed(1)}" rx="2" fill="var(--s1)"/><rect x="${(x+rbw*0.12+w+1).toFixed(1)}" y="${(rH-20-hb).toFixed(1)}" width="${w.toFixed(1)}" height="${hb.toFixed(1)}" rx="2" fill="var(--s2)"/>${lab}<rect x="${x.toFixed(1)}" y="0" width="${rbw.toFixed(1)}" height="${rH-14}" fill="transparent" data-tip="${esc(tip)}"/>`;
    }).join('');

    // 5) 門市作業合計、同仁排行
    const storeItems = [['weeklyCollect','周徵貨量'],['storeReturn','門市撤貨進倉'],['storeHandle','門市撤貨處理量'],['recoveredPackages','撤貨出倉數量'],['newArrival','新品上架']].map(([k,l])=>({l, v:S(k)}));
    const staffMap = {};
    rows.forEach(r=>parseDetail(r.storeHandleDetail).forEach(p=>{ staffMap[p.name]=(staffMap[p.name]||0)+p.qty; }));
    const staffItems = Object.keys(staffMap).map(n=>({l:n, v:staffMap[n]})).sort((a,b)=>b.v-a.v);
    const staffSum = staffItems.reduce((s,x)=>s+x.v,0);

    // 6) 數字表
    const tbl = `<table class="dtbl"><tr><th>日期</th>${VG.map(g=>`<th>${g.n}</th>`).join('')}<th>合計</th><th>進倉</th><th>上架</th></tr>${slots.filter(s=>s.rec).reverse().map(s=>`<tr><td>${s.date.slice(5).replace('-','/')}</td>${VG.map(g=>`<td>${fmt(g.keys.reduce((a,k)=>a+num(s.rec[k]),0))}</td>`).join('')}<td><b>${fmt(chTotal(s.rec))}</b></td><td>${fmt(num(s.rec.returnIn))}</td><td>${fmt(num(s.rec.returnShelved))}</td></tr>`).join('')}</table>`;

    $('dashBody').innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="v">${fmt(sum)}</div><div class="l">訂單總量</div>${delta===null?'':`<div class="dl ${delta>=0?'up':'dn'}">${delta>=0?'▲':'▼'} ${Math.abs(delta)}% 較前 ${dashDays} 天</div>`}</div>
        <div class="kpi"><div class="v">${fmt(sum/rows.length)}</div><div class="l">日均訂單</div></div>
        <div class="kpi"><div class="v">${returnIn?Math.round(shelved/returnIn*100):0}%</div><div class="l">撤退貨上架率</div><div class="dl">未上架 ${fmt(pending)}</div></div>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="v sm">${fmt(S('storeHandle'))}</div><div class="l">門市撤貨處理</div></div>
        <div class="kpi"><div class="v sm">${fmt(S('recoveredPackages'))}</div><div class="l">撤貨出倉</div></div>
        <div class="kpi"><div class="v sm">${fmt(S('newArrival'))}</div><div class="l">新品上架</div></div>
      </div>

      <div class="card"><h3>每日訂單量</h3>${legend(VG)}
        <svg viewBox="0 0 ${W} ${H}" width="100%">${dayBars}</svg>
        <div class="hint">尖峰：${slots[peakI].date.slice(5).replace('-','/')}（週${WD[dowOf(slots[peakI].date)]}）${fmt(totals[peakI])} 單。點一下長條看各通路。</div></div>

      <div class="card"><h3>各通路占比</h3>${hbars(chSum,'','')}</div>

      <div class="card"><h3>星期別平均訂單量</h3>
        <svg viewBox="0 0 308 122" width="100%">${wdCols}</svg>
        <div class="hint">看哪幾天最忙，用來排人力。顏色最深的是平均最高的那天。</div></div>

      <div class="card"><h3>撤退貨：進倉 vs 上架</h3>${legend([{n:'撤退貨進倉',c:'var(--s1)'},{n:'上架數量',c:'var(--s2)'}])}
        <svg viewBox="0 0 ${W} ${rH}" width="100%">${retBars}</svg>
        <div class="hint">期間累計：進倉 ${fmt(returnIn)}、上架 ${fmt(shelved)}、尚未上架 ${fmt(pending)}。</div></div>

      <div class="card"><h3>門市作業合計</h3>${hbars(storeItems,'var(--s3)','')}</div>

      ${staffItems.length?`<div class="card"><h3>同仁撤貨處理量</h3>${hbars(staffItems.map(x=>({...x, pct: staffSum?Math.round(x.v/staffSum*100):0})),'var(--s1)','')}</div>`:''}

      <div class="card" id="dashRf"></div>

      <details class="card"><summary>看數字表</summary><div style="overflow-x:auto;margin-top:10px">${tbl}</div></details>
      <div class="hint">統計範圍：${days[0]} ～ ${days[days.length-1]}（共 ${days.length} 天，其中 ${rows.length} 天有登錄；日均用有登錄的天數算）</div>`;
    renderDashRf();
  }

  // 儀表板：本週門市整新進度
  function renderDashRf(){
    const el = $('dashRf'); if(!el) return;
    const wk = rfWeekInfo(mondayOf(new Date()));
    if(!rfStores.length){ el.innerHTML = `<h3>本週門市整新　${wk.label}</h3><div class="hint">${apiReady()?'讀取中，或還沒有門市清單。':'還沒設定網址。'}</div>`; return; }
    const recs = rfRecs.filter(r=>r.week===wk.key);
    const rows = RF_GROUPS.map(g=>{
      const st = rfStores.filter(s=>s.group===g);
      const done = st.filter(s=>{ const r=recs.find(x=>String(x.code)===String(s.code)); return r && r.status==='完成'; });
      const going = st.filter(s=>{ const r=recs.find(x=>String(x.code)===String(s.code)); return r && r.status==='整理中'; });
      const mins = done.map(s=>num(recs.find(x=>String(x.code)===String(s.code)).minutes)).filter(m=>m>0);
      return {g, total:st.length, done:done.length, going:going.length, avg: mins.length?Math.round(mins.reduce((a,b)=>a+b,0)/mins.length):0};
    }).filter(x=>x.total);
    const allT = rows.reduce((s,x)=>s+x.total,0), allD = rows.reduce((s,x)=>s+x.done,0);
    el.innerHTML = `<h3>本週門市整新　${wk.label}</h3>
      <div class="hint" style="margin:0 0 8px">全部 ${allT} 間，已完成 ${allD} 間（${allT?Math.round(allD/allT*100):0}%）</div>
      ${rows.map(x=>`<div class="barrow" data-tip="${x.g}排程\n完成 ${x.done} / ${x.total}\n整理中 ${x.going}${x.avg?'\n平均用時 '+x.avg+' 分鐘':''}"><div class="n">${x.g}</div><div class="t"><div class="f" style="width:${Math.round(x.done/x.total*100)}%;background:var(--s3)"></div></div><div class="c">${x.done}/${x.total}</div></div>${x.avg?`<div class="hint" style="margin:-4px 0 6px 94px">平均用時 ${x.avg} 分鐘</div>`:''}`).join('')}`;
  }

  // ---------- 門市新品整新 ----------
  const RF_GROUPS = ['週五','週一','週二','週三'];     // 排程組別
  const RF_STAFF = ['管育芝','謝蕾','楊裕萱','林子庭'];  // 輪值同仁
  const RF_INFO = {
    '週五':'期限：週五完成・盡量合成 5 箱',
    '週一':'期限：週一下班前完成，最慢週二中午・盡量合成 5 箱',
    '週二':'期限：週二下班前一定要完成・不用特別合箱',
    '週三':'期限：週三下班前一定要完成・不用特別合箱'
  };
  let rfStores = [], rfRecs = [], rfGroup = RF_GROUPS[0], rfStaffSel = [], rfDraft = {}, rfBusy = false;
  try{ rfStaffSel = JSON.parse(localStorage.getItem('rfStaff')||'[]').filter(n=>RF_STAFF.indexOf(n)>=0).slice(0,2); }catch(e){}
  function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
  let rfMon = mondayOf(new Date());
  function rfWeekInfo(mon){
    const th = new Date(mon); th.setDate(th.getDate()+3);
    const y = th.getFullYear(), mon1 = mondayOf(new Date(y,0,4));
    const wk = Math.round((mon-mon1)/604800000)+1;
    const sun = new Date(mon); sun.setDate(sun.getDate()+6);
    return { key: y+'-W'+pad(wk), label: 'W'+pad(wk)+'（'+(mon.getMonth()+1)+'/'+mon.getDate()+' – '+(sun.getMonth()+1)+'/'+sun.getDate()+'）' };
  }
  const nowHM = ()=>{ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
  const md = d => d ? String(d).slice(5).replace('-','/') : '';
  function dtMin(d,t){ const a=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(d||'')), b=/^(\d{1,2}):(\d{2})/.exec(String(t||'')); return (a&&b) ? Date.UTC(+a[1],+a[2]-1,+a[3],+b[1],+b[2])/60000 : null; }
  function rfSay(t, cls){ const el=$('rfMsg'); el.textContent=t||''; el.className='rfmsg '+(cls||''); }
  function rfRec(week, code){ return rfRecs.find(r=>r.week===week && String(r.code)===String(code)); }

  async function loadRefurb(){
    if(!apiReady()){ rfSay('還沒設定 Apps Script 網址','err'); return false; }
    try{
      const res = await fetchWithTimeout(API_URL + (API_URL.indexOf('?')>=0?'&':'?') + 'type=refurb&t=' + Date.now(), {}, 15000);
      const json = await res.json();
      if(!json || !Array.isArray(json.stores)){ rfSay('⚠ 大表程式還沒更新到「門市整新」功能：請貼上新版 Apps Script，並用「新版本」重新部署','err'); renderRefurb(); return false; }
      rfStores = json.stores; rfRecs = json.records || []; rfSay('');
    }catch(e){ console.error(e); rfSay('讀取失敗，請按「重新整理」或稍後再試','err'); }
    renderRefurb(); return true;
  }

  function renderRefurb(){
    const wk = rfWeekInfo(rfMon);
    (function(){
      const base = mondayOf(new Date()), cur = Math.round((rfMon-base)/604800000);
      const lo = Math.min(-30, cur-2), hi = Math.max(30, cur+2);
      let h = '';
      for(let o=hi; o>=lo; o--){ const m=new Date(base); m.setDate(m.getDate()+o*7); h += `<option value="${o}"${o===cur?' selected':''}>${rfWeekInfo(m).label}${o===0?'　★本週':''}</option>`; }
      $('rfWeekSel').innerHTML = h;
    })();
    $('rfStaff').innerHTML = RF_STAFF.map(n=>`<button type="button" class="chip${rfStaffSel.indexOf(n)>=0?' on':''}" data-name="${esc(n)}">${esc(n)}</button>`).join('');
    $('rfGroups').innerHTML = RF_GROUPS.map(g=>{
      const n = rfStores.filter(s=>s.group===g).length;
      return `<button type="button" class="smallbtn${g===rfGroup?' active':''}" data-g="${g}">${g}排程 (${n})</button>`;
    }).join('');
    const list = rfStores.filter(s=>s.group===rfGroup);
    let done=0, orig=0, fin=0;
    list.forEach(s=>{ const r=rfRec(wk.key,s.code); if(r&&r.end) done++; orig += num(r&&r.original!==''&&r.original!==undefined ? r.original : s.expected); fin += num(r&&r.finished); });
    $('rfSum').innerHTML = list.length
      ? `<div style="display:flex;justify-content:space-between;align-items:baseline;"><b style="font-size:17px;">${rfGroup}排程 進度</b><span style="font-family:var(--font-mono);font-weight:800;font-size:26px;color:var(--accent);">${done} / ${list.length} 間</span></div><div class="pbar"><i style="width:${Math.round(done/list.length*100)}%;background:var(--green)"></i></div><div class="hint" style="margin:0;">原本 ${orig} 箱 → 已整完 ${fin} 箱</div><div class="hint" style="margin:6px 0 0;font-weight:700;">${esc(RF_INFO[rfGroup]||'')}</div>`
      : '<div class="placeholder">這一組還沒有門市。<br>請到大表的「store_list」分頁，填入門市代碼、門市名稱、排程組別。</div>';
    $('rfList').innerHTML = list.map(s=>{
      const r = rfRec(wk.key, s.code) || {};
      const dk = wk.key+'|'+s.code, dr = rfDraft[dk] || {};
      const origV = dr.orig!==undefined ? dr.orig : (r.original!==undefined&&r.original!=='' ? r.original : (s.expected!==''&&s.expected!==undefined ? s.expected : ''));
      const finV = dr.fin!==undefined ? dr.fin : (r.finished!==undefined ? r.finished : '');
      const started = !!r.start, ended = !!r.end, cls = ended?'done':(started?'doing':'');
      const a = dtMin(r.startDate,r.start), b = dtMin(r.endDate,r.end), mins = (a!==null&&b!==null&&b>=a) ? b-a : null;
      const diff = (origV!==''&&finV!=='') ? num(finV)-num(origV) : null;
      const diffTxt = diff===null ? '' : (diff===0 ? '箱數不變' : (diff<0?'合箱 −':'多 +')+Math.abs(diff));
      return `<div class="rfcard ${cls}" data-code="${esc(s.code)}">
        <div class="rftop"><div><div class="nm">${esc(s.name||s.code)}</div><div class="cd">${esc(s.code)}</div></div><span class="rfbadge">${ended?'完成':(started?'整理中':'待處理')}</span></div>
        <div class="rfrow"><label>原本箱數（確認）</label><input type="number" inputmode="numeric" min="0" class="rfexp" value="${esc(origV)}" placeholder="0"></div>
        <div class="rfrow"><label>整完箱數</label><input type="number" inputmode="numeric" min="0" class="rfcon" value="${esc(finV)}" placeholder="0"><span class="rfdiff ${diff===0?'ok':'bad'}">${diffTxt}</span></div>
        <div class="rftimes"><span>開始 ${started?esc(md(r.startDate)+' '+r.start):'--'} ${started?'<a data-act="editstart">✎</a>':''}</span><span>完成 ${ended?esc(md(r.endDate)+' '+r.end):'--'} ${ended?'<a data-act="editend">✎</a>':''}</span>${mins!==null?'<span>用時 '+mins+' 分</span>':''}</div>
        <div class="rfbtns"><button type="button" data-act="save">儲存箱數</button><button type="button" data-act="start"${(started||origV==='')?' disabled':''}>▶ 開始</button><button type="button" data-act="end"${(!started||ended||finV==='')?' disabled':''}>✔ 完成</button></div>
        ${r.staff?'<div class="rfwho">整理：'+esc(r.staff)+'</div>':''}
      </div>`;
    }).join('');
  }

  async function rfPost(payload){
    let lastErr='';
    for(let a=1;a<=2;a++){
      try{
        const res = await fetchWithTimeout(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) }, 15000);
        const json = await res.json();
        if(json && json.success){ if(!json.refurb) throw new Error('大表程式還沒更新到「門市整新」功能（請貼上新版並用「新版本」部署）'); return {ok:true}; }
        throw new Error((json&&json.error)||'save failed');
      }catch(e){ console.error(e); lastErr = (e&&e.name==='AbortError')?'連線逾時':String((e&&e.message)||e); if(a===1) await new Promise(r=>setTimeout(r,1200)); }
    }
    return {ok:false, err:lastErr};
  }

  async function rfAct(code, act){
    if(rfBusy) return;
    const wk = rfWeekInfo(rfMon);
    const store = rfStores.find(s=>String(s.code)===String(code)); if(!store) return;
    if(rfStaffSel.length<1){ rfSay('請先在上面選「今天整理的同仁」（1～2 位）','err'); window.scrollTo(0,0); return; }
    const card = document.querySelector('#rfList .rfcard[data-code="'+(window.CSS&&CSS.escape?CSS.escape(code):code)+'"]');
    const origV = card.querySelector('.rfexp').value, finV = card.querySelector('.rfcon').value;
    const cur = rfRec(wk.key, code) || {};
    const payload = { type:'refurb', week:wk.key, group:store.group, code:store.code, name:store.name, staff:rfStaffSel.join('、') };
    if(origV!=='') payload.original = num(origV);
    if(finV!=='') payload.finished = num(finV);
    if(act==='save'){ if(origV===''&&finV===''){ rfSay('請先填箱數','err'); return; } }
    else if(act==='start'){ if(origV===''){ rfSay('請先確認「原本箱數」才能開始','err'); return; } payload.startDate = todayStr(); payload.start = nowHM(); }
    else if(act==='end'){ if(finV===''){ rfSay('請先填「整完箱數」才能完成','err'); return; } payload.endDate = todayStr(); payload.end = nowHM(); }
    else if(act==='editstart' || act==='editend'){
      const isS = act==='editstart', d0 = isS?cur.startDate:cur.endDate, t0 = isS?cur.start:cur.end;
      const t = window.prompt((isS?'修改開始時間':'修改完成時間')+'（格式：10/09 09:30，或只填 09:30）', md(d0)+' '+t0);
      if(t===null) return;
      const m = /^(?:(\d{1,2})[\/-](\d{1,2})\s+)?(\d{1,2})[:：](\d{2})$/.exec(String(t).trim());
      if(!m || Number(m[3])>23 || Number(m[4])>59){ rfSay('格式要像 10/09 09:30','err'); return; }
      const yr = String(d0||todayStr()).slice(0,4);
      const dd = m[1] ? yr+'-'+pad(Number(m[1]))+'-'+pad(Number(m[2])) : d0;
      payload[isS?'startDate':'endDate'] = dd; payload[isS?'start':'end'] = pad(Number(m[3]))+':'+m[4];
    }
    rfBusy = true; rfSay('送出中...');
    const r = await rfPost(payload);
    rfBusy = false;
    if(r.ok){
      delete rfDraft[wk.key+'|'+code];
      rfSay('✓ 已記錄（'+store.name+'）','ok');
      await loadRefurb();
    }else{ rfSay('送出失敗：'+r.err+'（輸入的箱數還在，可再按一次）','err'); }
  }

  $('rfStaff').addEventListener('click', e=>{
    const b = e.target.closest('.chip'); if(!b) return; const n = b.dataset.name, i = rfStaffSel.indexOf(n);
    if(i>=0) rfStaffSel.splice(i,1); else if(rfStaffSel.length>=2){ rfSay('最多選 2 位同仁','err'); return; } else rfStaffSel.push(n);
    try{ localStorage.setItem('rfStaff', JSON.stringify(rfStaffSel)); }catch(err){}
    rfSay(''); renderRefurb();
  });
  $('rfGroups').addEventListener('click', e=>{ const b=e.target.closest('[data-g]'); if(!b) return; rfGroup=b.dataset.g; renderRefurb(); });
  $('rfWeekSel').addEventListener('change', e=>{ const m=mondayOf(new Date()); m.setDate(m.getDate()+Number(e.target.value)*7); rfMon=m; rfDraft = {}; renderRefurb(); });
  $('rfPrev').addEventListener('click', ()=>{ rfMon.setDate(rfMon.getDate()-7); rfDraft = {}; renderRefurb(); });
  $('rfNext').addEventListener('click', ()=>{ rfMon.setDate(rfMon.getDate()+7); rfDraft = {}; renderRefurb(); });
  $('rfList').addEventListener('click', e=>{
    const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
    const card = el.closest('.rfcard'); if(card) rfAct(card.dataset.code, el.dataset.act);
  });
  $('rfList').addEventListener('input', e=>{
    const card = e.target.closest('.rfcard'); if(!card) return;
    const wk = rfWeekInfo(rfMon), dk = wk.key+'|'+card.dataset.code;
    const o = card.querySelector('.rfexp').value, f = card.querySelector('.rfcon').value;
    rfDraft[dk] = { orig:o, fin:f };
    const d = card.querySelector('.rfdiff'), diff = (o!==''&&f!=='') ? num(f)-num(o) : null;
    d.textContent = diff===null ? '' : (diff===0?'箱數不變':(diff<0?'合箱 −':'多 +')+Math.abs(diff)); d.className = 'rfdiff '+(diff===0?'ok':'bad');
    const r = rfRec(wk.key, card.dataset.code) || {};
    card.querySelector('[data-act="start"]').disabled = !!r.start || o==='';
    card.querySelector('[data-act="end"]').disabled = !r.start || !!r.end || f==='';
  });

  // ---------- 啟動 ----------
  buildForm();
  $('dateIn').value = todayStr();
  fillForm(todayStr());
  loadRecords().then(ok=>{ if(ok){ fillForm($('dateIn').value); } else if(apiReady()){ setStatus('讀取大表失敗，仍可填寫後送出', 'err'); } });
})();
</script>
</body>
</html>
