<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>倉儲運營進出貨登錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0F1826; --panel:#182437; --panel-2:#1F2E45; --line:#2C3D56;
    --gold:#E8A33D; --teal:#3BC4B8; --green:#4CC985; --red:#E8674F; --grey:#8592A8;
    --text:#EAF1FB; --text-mute:#8F9FB8;
    --font-display:'Noto Sans TC',sans-serif;
    --font-body:'Noto Sans TC',sans-serif;
    --font-mono:'JetBrains Mono','Courier New',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); font-weight:500; min-height:100vh; display:flex; justify-content:center; }
  .app{ width:100%; max-width:480px; min-height:100vh; background:var(--bg); position:relative; z-index:2; }
  @media (min-width: 900px){
    .app{ max-width:960px; }
    .grid2{ grid-template-columns:repeat(4, 1fr); }
    .kpirow{ grid-template-columns:repeat(4, 1fr); }
    .chartcard canvas{ max-height:280px; }
  }
  .watermark{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-24deg); z-index:1; pointer-events:none; font-family:var(--font-display); font-weight:900; font-size:14vw; letter-spacing:0.05em; color:var(--gold); opacity:0.07; text-transform:uppercase; white-space:nowrap; }
  .view{ position:relative; z-index:2; }

  .topbar{ padding:22px 20px 18px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#152238,#0F1826); }
  .topbar .eyebrow{ font-family:var(--font-mono); font-size:12px; letter-spacing:0.15em; color:var(--gold); text-transform:uppercase; }
  .topbar h1{ font-family:var(--font-display); font-size:25px; margin:6px 0 0; font-weight:900; }
  .topbar .dateline{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-mute); margin-top:4px; }

  main{ padding:18px 20px 60px; }
  .tabs{ display:flex; margin-bottom:18px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:4px; gap:4px; }
  .tab{ flex:1; text-align:center; padding:11px 0; border-radius:10px; font-size:14px; font-weight:700; color:var(--text-mute); cursor:pointer; user-select:none; }
  .tab.active{ background:var(--gold); color:#241804; }

  .manifest{ background:var(--panel); border:1px solid var(--line); border-radius:4px; position:relative; margin-bottom:16px; }
  .manifest::before{ content:'進出貨登錄單'; position:absolute; top:-11px; left:16px; background:var(--bg); padding:0 8px; font-family:var(--font-mono); font-size:11px; color:var(--gold); letter-spacing:0.1em; }
  .manifest-inner{ border:1px dashed var(--line); border-radius:4px; margin:12px; padding:14px; }

  .section-label{ font-family:var(--font-mono); font-size:12px; color:var(--gold); text-transform:uppercase; letter-spacing:0.1em; margin:20px 0 10px; display:flex; align-items:center; gap:8px; }
  .section-label::after{ content:''; flex:1; height:1px; background:var(--line); }
  .section-label:first-child{ margin-top:0; }

  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--text-mute); margin-bottom:6px; }
  .field input[type=text], .field input[type=number], .field input[type=date], .field select{
    width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-size:16px; font-family:var(--font-mono);
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--gold); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .totaldial{ display:flex; align-items:center; gap:16px; background:var(--panel-2); border-radius:14px; padding:16px; margin-bottom:14px; }
  .totaldial .ring{ width:64px; height:64px; border-radius:50%; border:5px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:900; font-size:12px; flex-shrink:0; }
  .totaldial .n{ font-family:var(--font-display); font-size:30px; font-weight:900; color:var(--gold); }
  .totaldial .l{ font-size:12px; color:var(--text-mute); }

  .btn{ display:block; width:100%; padding:15px; border-radius:12px; border:none; font-size:16px; font-weight:800; cursor:pointer; font-family:var(--font-display); text-align:center; }
  .btn.gold{ background:var(--gold); color:#241804; }
  .btn:disabled{ opacity:0.5; }
  .statusline{ text-align:center; font-size:13px; font-family:var(--font-mono); margin-top:10px; min-height:16px; }
  .statusline.ok{ color:var(--green); } .statusline.err{ color:var(--red); }

  .kpirow{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .kpi{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center; }
  .kpi .v{ font-family:var(--font-display); font-size:23px; font-weight:900; color:var(--gold); }
  .kpi .l{ font-size:11px; color:var(--text-mute); margin-top:3px; font-weight:700; }
  .chartcard{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  .chartcard h3{ margin:0 0 12px; font-size:14px; font-family:var(--font-display); font-weight:800; color:var(--text); }
  .chartcard canvas{ max-height:210px; }
  .rangepicker{ display:flex; gap:8px; margin-bottom:16px; }
  .rangepicker button{ flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text-mute); font-size:13px; font-weight:700; cursor:pointer; }
  .rangepicker button.active{ background:var(--gold); border-color:var(--gold); color:#241804; }
  .placeholder{ text-align:center; color:var(--text-mute); padding:40px 20px; font-size:14px; }
  .refreshsmall{ padding:11px 12px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-size:13px; cursor:pointer; width:100%; margin-bottom:14px; font-weight:700; }

  .loglist .rec{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .loglist .rec .top{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:12px; color:var(--text-mute); margin-bottom:6px; }
  .loglist .rec .n{ font-family:var(--font-display); font-weight:900; font-size:18px; color:var(--gold); }
</style>
</head>
<body>
<div class="app">
  <div class="watermark">AIR <span>SPACE</span></div>

  <div class="view">
    <div class="topbar">
      <div class="eyebrow">AIR SPACE ・ WAREHOUSE OPS</div>
      <h1>倉儲運營進出貨登錄</h1>
      <div class="dateline" id="topDateline"></div>
    </div>
    <main>
      <div class="tabs">
        <div class="tab active" data-tab="entry">📋 登錄</div>
        <div class="tab" data-tab="log">🗂 紀錄</div>
        <div class="tab" data-tab="dash">📊 儀表板</div>
      </div>

      <!-- ENTRY TAB -->
      <div id="tab-entry">
        <div class="manifest">
          <div class="manifest-inner">
            <div class="field">
              <label>登錄日期</label>
              <input type="date" id="entryDate">
            </div>

            <div class="totaldial">
              <div class="ring" id="totalRing">0</div>
              <div><div class="n" id="totalPreview">0</div><div class="l">今日各通路訂單總數</div></div>
            </div>

            <div class="section-label">進貨・各通路訂單量</div>
            <div class="grid2">
              <div class="field"><label>官網宅配</label><input type="number" inputmode="numeric" class="chnum" id="fOfficialDelivery"></div>
              <div class="field"><label>官網超取</label><input type="number" inputmode="numeric" class="chnum" id="fOfficialPickup"></div>
              <div class="field"><label>國際宅配</label><input type="number" inputmode="numeric" class="chnum" id="fIntlDelivery"></div>
              <div class="field"><label>蝦皮</label><input type="number" inputmode="numeric" class="chnum" id="fShopee"></div>
              <div class="field"><label>樂天</label><input type="number" inputmode="numeric" class="chnum" id="fRakuten"></div>
              <div class="field"><label>亞馬遜</label><input type="number" inputmode="numeric" class="chnum" id="fAmazon"></div>
              <div class="field"><label>商借B2B</label><input type="number" inputmode="numeric" class="chnum" id="fB2bBorrow"></div>
              <div class="field"><label>門市店取</label><input type="number" inputmode="numeric" class="chnum" id="fStorePickup"></div>
              <div class="field"><label>門市B2B</label><input type="number" inputmode="numeric" class="chnum" id="fStoreB2B"></div>
              <div class="field"><label>團購</label><input type="number" inputmode="numeric" class="chnum" id="fGroupBuy"></div>
            </div>

            <div class="section-label">出貨・退貨處理</div>
            <div class="grid2">
              <div class="field"><label>撤退貨進倉</label><input type="number" inputmode="numeric" id="fReturnIn"></div>
              <div class="field"><label>上架數量</label><input type="number" inputmode="numeric" id="fReturnShelved"></div>
            </div>

            <div class="section-label">門市 ・ 車次</div>
            <div class="grid2">
              <div class="field"><label>門市撤貨</label><input type="number" inputmode="numeric" id="fStoreReturn"></div>
              <div class="field"><label>周徵貨量</label><input type="number" inputmode="numeric" id="fWeeklyCollect"></div>
            </div>
            <div class="grid2" style="margin-top:12px;">
              <div class="field">
                <label>車次</label>
                <select id="fTrip">
                  <option value="">未選擇</option>
                  <option value="EC1車">EC1車</option>
                  <option value="門市1車">門市1車</option>
                  <option value="其他">其他</option>
                </select>
              </div>
              <div class="field"><label>回收包裹數</label><input type="number" inputmode="numeric" id="fRecovered"></div>
            </div>
          </div>
        </div>

        <button class="btn gold" id="submitBtn">送出登錄</button>
        <div class="statusline" id="submitStatus"></div>
      </div>

      <!-- LOG TAB -->
      <div id="tab-log" style="display:none;">
        <button class="refreshsmall" id="logRefresh">重新整理</button>
        <div class="loglist" id="logList"><div class="placeholder">載入中...</div></div>
      </div>

      <!-- DASHBOARD TAB -->
      <div id="tab-dash" style="display:none;">
        <button class="refreshsmall" id="dashRefresh">重新整理資料</button>
        <div class="rangepicker" id="rangePicker">
          <button class="active" data-days="7">近7天</button>
          <button data-days="14">近14天</button>
          <button data-days="30">近30天</button>
        </div>
        <div class="kpirow" id="dashKpis"></div>
        <div class="chartcard"><h3>各通路訂單量趨勢</h3><canvas id="chChannels"></canvas></div>
        <div class="chartcard"><h3>退貨積壓（剩餘未上架數量）趨勢</h3><canvas id="chReturns"></canvas></div>
        <div class="chartcard"><h3>每日訂單總數</h3><canvas id="chTotal"></canvas></div>
      </div>
    </main>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/airspaceonline.com/s/AKfycbxGqMJe8p9hGeqNLJRUm3ugBGH-Sk66kzXNTZB6VtN46sQmU6rlMN7ethkiJ7iDm4--/exec';

  function todayDateStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  $('topDateline').textContent = new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'});

  // ---- tabs ----
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      ['entry','log','dash'].forEach(name=>{ $('tab-'+name).style.display = (name===t.dataset.tab) ? 'block':'none'; });
      if(t.dataset.tab==='log') loadLog();
      if(t.dataset.tab==='dash') loadDashboard();
    });
  });

  // ---- entry form ----
  $('entryDate').value = todayDateStr();
  function updateTotalPreview(){
    const ids = ['fOfficialDelivery','fOfficialPickup','fIntlDelivery','fShopee','fRakuten','fAmazon','fB2bBorrow','fStorePickup','fStoreB2B','fGroupBuy'];
    let sum = 0;
    ids.forEach(id=>{ const v = parseInt($(id).value,10); if(!isNaN(v)) sum += v; });
    $('totalPreview').textContent = sum;
    $('totalRing').textContent = sum>999 ? Math.round(sum/1000)+'k' : sum;
  }
  document.querySelectorAll('.chnum').forEach(inp=> inp.addEventListener('input', updateTotalPreview));

  function numOrEmpty(id){ const v = $(id).value; return v==='' ? '' : Number(v); }

  $('submitBtn').addEventListener('click', async ()=>{
    const payload = {
      action: 'submit',
      date: $('entryDate').value,
      officialDelivery: numOrEmpty('fOfficialDelivery'), officialPickup: numOrEmpty('fOfficialPickup'),
      intlDelivery: numOrEmpty('fIntlDelivery'), shopee: numOrEmpty('fShopee'),
      rakuten: numOrEmpty('fRakuten'), amazon: numOrEmpty('fAmazon'),
      b2bBorrow: numOrEmpty('fB2bBorrow'), storePickup: numOrEmpty('fStorePickup'),
      storeB2B: numOrEmpty('fStoreB2B'), groupBuy: numOrEmpty('fGroupBuy'),
      returnIn: numOrEmpty('fReturnIn'), returnShelved: numOrEmpty('fReturnShelved'),
      storeReturn: numOrEmpty('fStoreReturn'), weeklyCollect: numOrEmpty('fWeeklyCollect'),
      trip: $('fTrip').value, recoveredPackages: numOrEmpty('fRecovered')
    };
    $('submitBtn').disabled = true; $('submitBtn').textContent = '送出中...';
    $('submitStatus').textContent = ''; $('submitStatus').className = 'statusline';
    try{
      const res = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
      const json = await res.json();
      if(json && json.success){
        $('submitStatus').textContent = '✓ 已成功登錄（此日期資料已更新）';
        $('submitStatus').className = 'statusline ok';
      }else{
        $('submitStatus').textContent = '✗ ' + (json && json.error ? json.error : '送出失敗，請檢查網路連線');
        $('submitStatus').className = 'statusline err';
      }
    }catch(e){
      console.error(e);
      $('submitStatus').textContent = '✗ 送出失敗，請檢查網路連線';
      $('submitStatus').className = 'statusline err';
    }
    $('submitBtn').disabled = false; $('submitBtn').textContent = '送出登錄';
  });

  // ---- log tab ----
  let allRecords = [];
  async function loadLog(){
    $('logList').innerHTML = '<div class="placeholder">載入中...</div>';
    try{
      const res = await fetch(APPS_SCRIPT_URL);
      const data = await res.json();
      allRecords = Array.isArray(data.records) ? data.records : [];
      renderLog();
    }catch(e){
      console.error(e);
      $('logList').innerHTML = '<div class="placeholder">載入失敗，請檢查網路連線</div>';
    }
  }
  $('logRefresh').addEventListener('click', loadLog);
  function renderLog(){
    const sorted = allRecords.slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,30);
    if(sorted.length===0){ $('logList').innerHTML = '<div class="placeholder">還沒有任何登錄紀錄</div>'; return; }
    $('logList').innerHTML = sorted.map(r=>`
      <div class="rec">
        <div class="top"><span>${r.date}</span><span>退貨積壓 ${r.returnRemaining||0}</span></div>
        <div class="n">${r.total||0} 件訂單</div>
      </div>
    `).join('');
  }

  // ---- dashboard ----
  let dashDays = 7;
  let charts = {};
  async function loadDashboard(){
    $('dashKpis').innerHTML = '<div class="placeholder">載入中...</div>';
    try{
      const res = await fetch(APPS_SCRIPT_URL);
      const data = await res.json();
      allRecords = Array.isArray(data.records) ? data.records : [];
      renderDashboard();
    }catch(e){
      console.error(e);
      $('dashKpis').innerHTML = '<div class="placeholder">載入失敗，請檢查網路連線</div>';
    }
  }
  $('dashRefresh').addEventListener('click', loadDashboard);
  document.querySelectorAll('#rangePicker button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#rangePicker button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      dashDays = +btn.dataset.days;
      renderDashboard();
    });
  });

  function renderDashboard(){
    const withDate = allRecords.filter(r=>r.date).sort((a,b)=> new Date(a.date)-new Date(b.date));
    const recent = withDate.slice(-dashDays);
    if(recent.length===0){ $('dashKpis').innerHTML = '<div class="placeholder">還沒有任何資料</div>'; return; }
    const latest = recent[recent.length-1];
    const prev = recent.length>1 ? recent[recent.length-2] : null;
    const totalToday = Number(latest.total)||0;
    const totalPrev = prev ? (Number(prev.total)||0) : null;
    const diff = totalPrev!==null ? totalToday-totalPrev : null;
    const backlog = Number(latest.returnRemaining)||0;

    $('dashKpis').innerHTML = `
      <div class="kpi"><div class="v">${totalToday}</div><div class="l">最新一天總訂單</div></div>
      <div class="kpi"><div class="v" style="color:${diff===null?'inherit':(diff>=0?'var(--green)':'var(--red)')}">${diff===null?'—':(diff>=0?'+':'')+diff}</div><div class="l">較前一天</div></div>
      <div class="kpi"><div class="v">${backlog}</div><div class="l">目前退貨積壓</div></div>
      <div class="kpi"><div class="v" style="font-size:15px;">${latest.date||''}</div><div class="l">最新資料日期</div></div>
    `;

    const labels = recent.map(r=>r.date.slice(5));
    Object.values(charts).forEach(c=>c && c.destroy());

    Chart.defaults.color = '#8F9FB8';
    Chart.defaults.borderColor = '#2C3D56';

    charts.channels = new Chart($('chChannels'), {
      type:'bar',
      data:{ labels, datasets:[
        { label:'官網宅配', data:recent.map(r=>Number(r.officialDelivery)||0), backgroundColor:'#E8A33D' },
        { label:'蝦皮', data:recent.map(r=>Number(r.shopee)||0), backgroundColor:'#3BC4B8' },
        { label:'樂天', data:recent.map(r=>Number(r.rakuten)||0), backgroundColor:'#4CC985' },
        { label:'門市店取', data:recent.map(r=>Number(r.storePickup)||0), backgroundColor:'#E8674F' }
      ]},
      options:{ responsive:true, plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:10}}}}, scales:{x:{stacked:true},y:{stacked:true}} }
    });

    charts.returns = new Chart($('chReturns'), {
      type:'line',
      data:{ labels, datasets:[
        { label:'剩餘未上架數量', data:recent.map(r=>Number(r.returnRemaining)||0), borderColor:'#E8674F', backgroundColor:'rgba(232,103,79,0.15)', fill:true, tension:0.3 }
      ]},
      options:{ responsive:true, plugins:{legend:{display:false}} }
    });

    charts.total = new Chart($('chTotal'), {
      type:'line',
      data:{ labels, datasets:[
        { label:'總數', data:recent.map(r=>Number(r.total)||0), borderColor:'#E8A33D', backgroundColor:'rgba(232,163,61,0.15)', fill:true, tension:0.3 }
      ]},
      options:{ responsive:true, plugins:{legend:{display:false}} }
    });
  }
})();
</script>
</body>
</html>
