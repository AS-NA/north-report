<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>倉儲點貨系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F3F6FC; --panel:#FFFFFF; --panel-2:#EEF2FA; --line:#DCE3F0;
    --accent:#2FA5D6; --accent-2:#8B7FEF; --teal:#2FA39A; --green:#3AAE72; --red:#D9604B; --grey:#94A0B8;
    --text:#1C2536; --text-mute:#6E7996;
    --font-display:'Noto Sans TC','Space Grotesk',sans-serif;
    --font-body:'Noto Sans TC','Inter',sans-serif;
    --font-mono:'JetBrains Mono','Courier New',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); font-weight:500; min-height:100vh; display:flex; justify-content:center; }
  .app{ width:100%; max-width:480px; min-height:100vh; background:var(--bg); position:relative; z-index:2; }
  .watermark{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-28deg); z-index:1; pointer-events:none; font-family:var(--font-display); font-weight:800; font-size:15vw; letter-spacing:0.06em; color:var(--accent); opacity:0.22; text-transform:uppercase; white-space:nowrap; }
  .view{display:none; position:relative; z-index:2;} .view.active{display:block;}

  .topbar{ background:linear-gradient(135deg,#D7ECFB,#E8E3FB); padding:20px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .topbar .eyebrow{ font-family:var(--font-mono); font-size:12.5px; letter-spacing:0.1em; color:#3E7FA8; text-transform:uppercase; }
  .topbar h1{ font-family:var(--font-display); font-size:28px; margin:5px 0 0; font-weight:800; }
  .backbtn{ background:none; border:none; color:var(--text); font-size:21.5px; cursor:pointer; }
  .opbadge{ font-family:var(--font-mono); font-size:13px; color:var(--text-mute); border:1px solid var(--line); padding:6px 10px; border-radius:24px; background:var(--panel); cursor:pointer; white-space:nowrap; }

  main{ padding:20px; padding-bottom:90px; }
  .tabs{ display:flex; margin-bottom:18px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:3px; gap:3px; }
  .tab{ flex:1; text-align:center; padding:9px 0; border-radius:13px; font-size:15px; font-weight:600; color:var(--text-mute); cursor:pointer; user-select:none; }
  .tab.active{ background:var(--accent); color:#fff; }

  .bigscanbtn{ width:100%; padding:18px 20px; border-radius:22px; border:none; color:#fff; font-family:var(--font-display); font-weight:700; font-size:19.5px; cursor:pointer; position:relative; overflow:hidden; transition:transform .15s ease; }
  .bigscanbtn:active{ transform:scale(0.98); }
  .bigscanbtn::after{ content:''; position:absolute; top:-40%; right:-20%; width:70%; height:180%; background:rgba(255,255,255,0.12); transform:rotate(20deg); pointer-events:none; }
  .bigscanbtn.arrive{ background:linear-gradient(135deg,#3AAE72,#2FA39A); box-shadow:0 12px 28px rgba(58,174,114,0.32); }
  .bigscanbtn.depart{ background:linear-gradient(135deg,#8B7FEF,#2FA5D6); box-shadow:0 12px 28px rgba(139,127,239,0.32); }
  .bigscanbtn.organize{ background:linear-gradient(135deg,#F2A93A,#E8804A); box-shadow:0 12px 28px rgba(242,169,58,0.32); }
  .btnrow2{ display:flex; align-items:center; gap:14px; text-align:left; position:relative; z-index:1; }
  .iconbadge{ flex-shrink:0; width:52px; height:52px; border-radius:16px; background:rgba(255,255,255,0.22); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.3); }
  .btntext{ flex:1; min-width:0; }
  .btitle{ font-size:19.5px; font-weight:800; }
  .todaycount{ flex-shrink:0; font-family:var(--font-mono); font-size:22px; font-weight:800; background:rgba(255,255,255,0.18); border-radius:14px; padding:6px 12px; min-width:44px; text-align:center; }
  .bigscanbtn .sub{ font-size:12.5px; font-weight:400; opacity:0.9; font-family:var(--font-mono); display:block; margin-top:2px; }
  .todaystrip{ display:flex; gap:10px; margin-bottom:16px; }
  .tstripitem{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:12px 10px; text-align:center; }
  .tstripitem .n{ font-family:var(--font-display); font-size:24px; font-weight:800; }
  .tstripitem .l{ font-size:11.5px; color:var(--text-mute); margin-top:2px; font-weight:600; }
  .manualrow{ margin-top:12px; }
  .manualbtn{ width:100%; padding:13px; border-radius:16px; border:1px solid var(--line); background:var(--panel); color:var(--text-mute); font-size:15px; cursor:pointer; font-family:var(--font-body); }

  /* result board - airport-gate style */
  .resultboard{ margin-top:20px; background:#12213A; border-radius:20px; padding:22px 20px; color:#fff; display:none; }
  .resultboard.show{ display:block; animation:fade .2s ease; }
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .resultboard .boxno{ font-family:var(--font-mono); font-size:13.5px; color:#9FC2E0; letter-spacing:0.05em; }
  .resultboard .zone{ font-family:var(--font-display); font-size:46px; font-weight:800; margin:6px 0; letter-spacing:0.02em; }
  .resultboard .action{ display:inline-block; font-size:13px; font-family:var(--font-mono); padding:4px 10px; border-radius:24px; margin-bottom:10px; }
  .resultboard .action.arrive{ background:rgba(58,174,114,0.25); color:#7BE0A8; }
  .resultboard .action.depart{ background:rgba(139,127,239,0.25); color:#C6BBFF; }
  .resultboard .action.done{ background:rgba(217,96,75,0.25); color:#FF9C87; }
  .resultboard .action.organize{ background:rgba(242,169,58,0.25); color:#FFCE85; }
  .siblinglist{ margin-top:14px; display:flex; flex-wrap:wrap; gap:6px; }
  .siblingitem{ font-family:var(--font-mono); font-size:12.5px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:#B9CFE3; padding:5px 10px; border-radius:16px; }
  .siblingitem.done{ background:rgba(58,174,114,0.22); border-color:rgba(58,174,114,0.4); color:#7BE0A8; }
  .resultboard .meta{ font-size:14px; color:#B9CFE3; line-height:1.8; font-family:var(--font-mono); }

  .section-label{ font-family:var(--font-mono); font-size:13px; color:var(--text-mute); text-transform:uppercase; letter-spacing:0.06em; margin:24px 0 10px; }
  .searchbox{ width:100%; padding:11px 13px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:15.5px; margin-bottom:12px; }
  .filterrow{ display:flex; gap:8px; margin-bottom:14px; }
  .filterchip{ flex:1; padding:8px 0; border-radius:24px; border:1px solid var(--line); background:var(--panel); color:var(--text-mute); font-size:14px; cursor:pointer; font-family:var(--font-body); }
  .filterchip.active{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }

  .rec{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:10px; }
  .rec .top{ display:flex; justify-content:space-between; align-items:center; }
  .rec .box{ font-family:var(--font-mono); font-weight:700; font-size:15px; }
  .rec .zone{ font-family:var(--font-display); font-weight:700; color:var(--accent); font-size:14.5px; }
  .rec .times{ margin-top:6px; font-size:13px; color:var(--text-mute); font-family:var(--font-mono); display:flex; justify-content:space-between; }
  .rec .st{ font-size:12px; padding:3px 8px; border-radius:24px; font-family:var(--font-mono); }
  .rec .st.pending{ background:rgba(217,96,75,0.12); color:var(--red); }
  .rec .st.done{ background:rgba(58,174,114,0.14); color:var(--green); }

  .placeholder{ text-align:center; color:var(--text-mute); padding:40px 20px; font-size:15px; line-height:1.8; }

  .cards4{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .kpi{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px 14px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .kpi .l{ font-size:15px; color:var(--text-mute); font-weight:700; order:-1; line-height:1.3; }
  .kpi .v{ font-family:var(--font-display); font-size:34px; font-weight:800; }
  .datepicker{ display:flex; gap:8px; margin-bottom:16px; }
  .datepicker input[type=date]{ flex:1; padding:10px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--text); }
  .refreshsmall{ padding:10px 12px; border-radius:12px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-size:14px; cursor:pointer; }

  .modal-bg{ position:fixed; inset:0; background:rgba(20,30,50,0.6); z-index:100; display:none; align-items:center; justify-content:center; padding:24px; }
  .modal-bg.active{ display:flex; }
  .modal{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px; width:100%; max-width:360px; max-height:88vh; overflow-y:auto; }
  .modal h3{ margin:0 0 14px; font-family:var(--font-display); font-size:17.5px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--text-mute); margin-bottom:6px; font-family:var(--font-mono); text-transform:uppercase; }
  .field{ margin-bottom:14px; }
  .field input[type=text]{ width:100%; padding:11px 13px; border-radius:14px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-size:16px; }
  .mcard{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:14px; }
  .mcard h3{ margin:0 0 10px; font-size:17px; font-weight:800; font-family:var(--font-display); }
  .mrow{ display:flex; justify-content:space-between; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .mrow:first-of-type{ border-top:none; } .mrow .a{ font-family:var(--font-mono); font-weight:700; } .mrow .b{ color:var(--text-mute); text-align:right; font-size:13px; }
  .mtag{ display:inline-block; font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px; } .mtag.ok{ background:rgba(58,174,114,.16); color:#2b8a57; } .mtag.miss{ background:rgba(217,96,75,.16); color:#c0432f; } .mtag.warn{ background:rgba(242,169,58,.2); color:#a86a0a; }
  .msel{ width:100%; padding:11px 13px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:15.5px; margin-bottom:10px; }
  .btn{ display:block; width:100%; padding:12px; border-radius:14px; border:none; font-size:15.5px; font-weight:700; cursor:pointer; font-family:var(--font-display); text-align:center; }
  .btn.accent{ background:var(--accent); color:#fff; }
  .btn.ghost{ background:var(--panel-2); color:var(--text); border:1px solid var(--line); }
  .btnrow{ display:flex; gap:8px; }
  .btnrow .btn{ flex:1; }

  #scanReaderDiv{ width:100%; border-radius:14px; overflow:hidden; background:#000; min-height:220px; position:relative; margin-bottom:10px; }
  .scanhint{ text-align:center; font-size:13px; color:var(--text-mute); margin-bottom:10px; }
  .note{ font-size:12.5px; color:var(--text-mute); margin-top:8px; line-height:1.5; }

  .weekhead{ font-size:14px; color:var(--text-mute); font-family:var(--font-mono); margin-bottom:14px; }
  .weektablewrap{ overflow-x:auto; border:1px solid var(--line); border-radius:18px; background:var(--panel); margin-bottom:16px; }
  .weektable{ border-collapse:collapse; width:100%; min-width:0; table-layout:fixed; }
  .weektable th, .weektable td{ padding:12px 10px; text-align:center; white-space:normal; word-break:break-word; border-bottom:1px solid var(--line); font-size:14px; }
  .weektable th{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-mute); text-transform:uppercase; background:var(--panel-2); }
  .weektable td:first-child, .weektable th:first-child{ text-align:left; }
  .weektable tr:last-child td{ border-bottom:none; font-weight:800; background:var(--panel-2); }
  .weektable .wc{ font-family:var(--font-display); font-weight:700; }
  .weektable .wsmall{ font-size:11.5px; color:var(--text-mute); display:block; }
  .appfooter{ margin-top:30px; padding-top:14px; border-top:1px solid var(--line); text-align:center; font-size:12.5px; color:var(--text-mute); font-family:var(--font-mono); line-height:1.8; }
  .clearlocal{ color:var(--accent); text-decoration:underline; cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <div class="watermark">AIR <span style="color:var(--accent-2);">SPACE</span></div>

  <!-- HOME -->
  <div class="view active" id="view-home">
    <div class="topbar">
      <div>
        <div class="eyebrow">AIR SPACE</div>
        <h1>倉儲點貨系統</h1>
      </div>
      <div class="opbadge" id="opBadge">設定人員</div>
    </div>
    <main>
      <div class="tabs">
        <div class="tab active" data-tab="scan">掃描點貨</div>
        <div class="tab" data-tab="log">今日紀錄</div>
        <div class="tab" data-tab="admin">管理端</div>
        <div class="tab" data-tab="week">週進度</div>
        <div class="tab" data-tab="manifest">出貨單</div>
      </div>

      <!-- SCAN TAB -->
      <div id="tab-scan">
        <div class="todaystrip" id="todayStrip"></div>

        <button class="bigscanbtn arrive" id="scanArriveBtn">
          <div class="btnrow2">
            <div class="iconbadge">📥</div>
            <div class="btntext">
              <div class="btitle">進倉登記</div>
              <span class="sub">掃描或輸入箱號，記錄到貨並顯示儲位</span>
            </div>
            <div class="todaycount" id="cntArrive">0</div>
          </div>
        </button>
        <div class="manualrow">
          <button class="manualbtn" id="manualArriveBtn">✏️ 手動輸入（進倉）</button>
        </div>

        <button class="bigscanbtn depart" id="scanDepartBtn" style="margin-top:16px;">
          <div class="btnrow2">
            <div class="iconbadge">📤</div>
            <div class="btntext">
              <div class="btitle">出艙登記</div>
              <span class="sub">掃描或輸入箱號，記錄離開儲區的時間</span>
            </div>
            <div class="todaycount" id="cntDepart">0</div>
          </div>
        </button>
        <div class="manualrow">
          <button class="manualbtn" id="manualDepartBtn">✏️ 手動輸入（出艙）</button>
        </div>

        <div class="resultboard" id="resultBoard"></div>
      </div>

      <!-- LOG TAB -->
      <div id="tab-log" style="display:none;">
        <input type="text" class="searchbox" id="logSearch" placeholder="搜尋箱號 / 儲位">
        <div id="logList"><div class="placeholder">載入中...</div></div>
      </div>

      <!-- ADMIN TAB -->
      <div id="tab-admin" style="display:none;">
        <div class="datepicker">
          <input type="date" id="adminDate">
          <button class="refreshsmall" id="adminRefresh">重新整理</button>
        </div>
        <div class="cards4" id="adminCards"></div>
        <input type="text" class="searchbox" id="adminSearch" placeholder="搜尋箱號 / 儲位 / 人員">
        <div class="filterrow" id="adminStatusFilter">
          <button class="filterchip active" data-status="all">全部</button>
          <button class="filterchip" data-status="pending">待出艙</button>
          <button class="filterchip" data-status="done">已完成</button>
        </div>
        <div id="adminList"></div>
        <div id="adminMoreWrap" style="display:none; margin-top:12px;">
          <button class="refreshsmall" id="adminLoadMore" style="width:100%;">顯示更多</button>
        </div>
      </div>

      <!-- WEEK PROGRESS TAB -->
      <div id="tab-week" style="display:none;">
        <div class="datepicker">
          <input type="date" id="weekDate">
          <button class="refreshsmall" id="weekRefresh">重新整理</button>
        </div>
        <div id="weekHead"></div>
        <div id="weekTableWrap"></div>
      </div>

      <!-- MANIFEST TAB -->
      <div id="tab-manifest" style="display:none;">
        <div class="mcard">
          <h3>① 匯入出貨單</h3>
          <input type="file" id="mFiles" accept=".xlsx,.xls" multiple style="width:100%; margin-bottom:10px;">
          <div id="mPreview"></div>
          <button class="btn accent" id="mImportBtn" style="display:none;">匯入全部</button>
          <div class="note">一次可以選好幾份檔案。同一份重複上傳不會重複匯入。</div>
        </div>
        <div class="mcard">
          <h3>② 標籤破損？用日期＋箱號查詢</h3>
          <select class="msel" id="mDateSel"></select>
          <input type="text" class="searchbox" id="mBoxNo" inputmode="numeric" placeholder="輸入箱號（例如 11）或裝箱單號後幾碼" style="margin-bottom:10px;">
          <button class="btn accent" id="mSearchBtn">查詢這一箱</button>
          <div id="mResult" style="margin-top:12px;"></div>
        </div>
        <div class="mcard">
          <h3>③ 缺箱比對</h3>
          <div id="mMissing"></div>
        </div>
      </div>

      <div class="appfooter" id="footerInfo"></div>
    </main>
  </div>

  <!-- SCAN MODAL -->
  <div class="modal-bg" id="scanModalBg">
    <div class="modal">
      <h3 id="scanModalTitle">掃描箱號</h3>
      <div id="scanReaderDiv"></div>
      <div class="scanhint" id="scanHintText">將條碼對準框框內</div>
      <div class="field" id="manualCodeWrap" style="display:none;">
        <label>箱號（可修改）</label>
        <input type="text" id="scanCodeInput" placeholder="輸入或掃描箱號">
      </div>
      <div class="field" id="qtyWrap">
        <label>件數</label>
        <input type="text" id="scanQtyInput" inputmode="numeric" value="1" placeholder="這箱有幾件">
      </div>
      <div class="field" id="typeWrap">
        <label>類型</label>
        <div class="filterrow">
          <button class="filterchip active" type="button" data-type="新品">新品</button>
          <button class="filterchip" type="button" data-type="追加">追加</button>
        </div>
      </div>
      <div class="btnrow">
        <button class="btn ghost" id="scanCancelBtn">取消</button>
        <button class="btn accent" id="scanConfirmBtn">確認</button>
      </div>
    </div>
  </div>

  <!-- OPERATOR MODAL -->
  <div class="modal-bg" id="opModalBg">
    <div class="modal">
      <h3>設定操作人員</h3>
      <div class="field">
        <label>姓名</label>
        <input type="text" id="opNameInput" placeholder="輸入你的姓名">
      </div>
      <button class="btn accent" id="opSaveBtn">儲存</button>
      <div class="note">姓名只存在你自己的裝置上，方便下次不用重打。</div>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFmPFL7HpUcj33tUViRSaJj9AZPP4VEJSGhZsYpwNHbJJoXYsFgkL9kk6-h85qKCUT/exec';

  // 出貨單清單用的獨立後端（見 manifest-apps-script），貼上部署網址；留空就不啟用出貨單功能
  const MANIFEST_URL = 'https://script.google.com/macros/s/AKfycbwbrcaxc9rl-pVz64anoXyqyhjQmjf37RRkAByHpGeYcV7UP0ymy1ntsqev-lxquvUi/exec';

  let allRecords = [];
  let allZones = {}; // boxCode -> zone, from backend reference sheet
  let allStores = {}; // storeCode -> {code,name,type,weekday}
  let lastLoadedAt = null;
  let operatorName = '';

  function todayDateStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function localDateStr(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtTime(iso){ if(!iso) return ''; const d = new Date(iso); return d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  function fmtDuration(startIso, endIso){
    if(!startIso || !endIso) return '';
    const mins = Math.round((new Date(endIso) - new Date(startIso))/60000);
    if(mins < 60) return `${mins} 分鐘`;
    return `${Math.floor(mins/60)} 小時 ${mins%60} 分`;
  }

  async function submitScan(boxCode, qty, mode, type){
    if(!operatorName){
      $('opNameInput').value='';
      $('opModalBg').classList.add('active');
      return null;
    }
    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'record', mode, boxCode, qty: qty||1, type: type||'', operator: operatorName, ts: new Date().toISOString() })
      });
      const json = await res.json();
      if(json && json.record){
        const idx = allRecords.findIndex(r=>r.boxCode===json.record.boxCode);
        if(idx>=0) allRecords[idx] = json.record; else allRecords.push(json.record);
      }
      return json;
    }catch(e){ console.error(e); return { success:false }; }
  }

  // ================= 出貨單（應到箱清單） =================
  let manifestBoxes = [], manifestLoaded = false, mPending = [];
  const manifestOn = () => !!MANIFEST_URL;
  const isoMD = d => String(d||'').slice(5).replace('-','/');
  function arrivedRec(code){ return allRecords.find(r=> r.boxCode===code && r.arrivedAt); }
  function storeLabel(code){ const s = allStores[code]; return s ? (code+' '+(s.name||'')) : code; }
  function manifestInfoHtml(code){
    if(!manifestLoaded || !manifestBoxes.length) return '';
    const b = manifestBoxes.find(x=>x.code===code);
    if(!b) return '<span style="color:#FFB4A6;">⚠ 這個箱號不在已匯入的出貨單內</span>';
    return `出貨單　${escapeHtml(storeLabel(b.store))}・${b.styles} 款 ${b.qty} 件（出貨 ${escapeHtml(isoMD(b.shipDate))}）`;
  }

  // 解析一份出貨單 Excel：自動找表頭（箱號、裝箱單號、店鋪…），日期和批次從上方標題列抓
  function cellStr(v){ return v==null ? '' : String(v).trim(); }
  function parseManifestRows(rows, fileName){
    const colRe = { no:/^箱[號号]$/, code:/(裝|装).*(單|单).*(號|号)/, store:/店[鋪铺]/, barcode:/條碼|条码/, style:/款[號号]/, name:/品名/, spec:/規格|规格/, qty:/數量|数量/ };
    let hi = -1, col = {};
    for(let i=0;i<Math.min(rows.length,20);i++){
      const c = {};
      (rows[i]||[]).forEach((v,j)=>{ const t = cellStr(v); for(const k in colRe){ if(c[k]===undefined && colRe[k].test(t)) c[k]=j; } });
      if(c.code!==undefined && c.store!==undefined){ hi = i; col = c; break; }
    }
    if(hi<0) throw new Error('找不到表頭（需要「裝箱單號」「店鋪」欄）');
    let shipDate = '', batch = '';
    for(let i=0;i<hi;i++){ (rows[i]||[]).forEach(v=>{
      const t = cellStr(v);
      let m = t.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/) || t.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
      if(m && !shipDate) shipDate = m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
      if(!batch && /批次/.test(t)) batch = t;
    }); }
    if(!shipDate) throw new Error('找不到出貨日期（標題列需要像「日期：2026年9月11日」）');
    const order = [], map = {};
    for(let i=hi+1;i<rows.length;i++){
      const r = rows[i] || [];
      const code = cellStr(r[col.code]);
      if(!code) continue;
      if(!map[code]){ map[code] = { no: col.no!==undefined ? cellStr(r[col.no]) : '', code, store: cellStr(r[col.store]), items: [] }; order.push(code); }
      map[code].items.push({ barcode: cellStr(r[col.barcode]), style: cellStr(r[col.style]), name: cellStr(r[col.name]), spec: cellStr(r[col.spec]), qty: Number(r[col.qty]) || 0 });
    }
    const boxes = order.map(c=>map[c]);
    return { file: fileName, shipDate, batch, boxes, pcs: boxes.reduce((s,b)=>s+b.items.reduce((a,it)=>a+it.qty,0),0) };
  }
  function parseManifestWorkbook(wb, fileName){
    let lastErr = null;
    for(const name of wb.SheetNames){
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:'', raw:true });
      try{ return parseManifestRows(rows, fileName); }catch(e){ lastErr = e; }
    }
    throw lastErr || new Error('讀不到資料');
  }
  window.__gcParseManifest = parseManifestWorkbook;   // 測試用

  function readFileBuf(f){ return new Promise((res,rej)=>{ const fr = new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsArrayBuffer(f); }); }
  $('mFiles').addEventListener('change', async (e)=>{
    mPending = [];
    const files = Array.from(e.target.files || []);
    if(!manifestOn()){ $('mPreview').innerHTML = '<div class="note" style="color:var(--red)">尚未設定出貨單後端網址（MANIFEST_URL）</div>'; return; }
    if(typeof XLSX==='undefined'){ $('mPreview').innerHTML = '<div class="note" style="color:var(--red)">Excel 讀取套件沒有載入（需要網路），請重新整理頁面</div>'; return; }
    for(const f of files){
      try{
        const wb = XLSX.read(new Uint8Array(await readFileBuf(f)), { type:'array' });
        mPending.push({ ok:true, data: parseManifestWorkbook(wb, f.name) });
      }catch(err){ mPending.push({ ok:false, file:f.name, err:String(err.message||err) }); }
    }
    renderPending();
  });
  function renderPending(){
    $('mPreview').innerHTML = mPending.map(p=> p.ok
      ? `<div class="mrow"><div><div class="a">${escapeHtml(p.data.file)}</div><div class="b" style="text-align:left">出貨 ${escapeHtml(p.data.shipDate)}${p.data.batch?'・'+escapeHtml(p.data.batch):''}</div></div><div class="b">${p.data.boxes.length} 箱・${p.data.pcs} 件</div></div>`
      : `<div class="mrow"><div class="a">${escapeHtml(p.file)}</div><div class="b" style="color:var(--red)">${escapeHtml(p.err)}</div></div>`).join('');
    $('mImportBtn').style.display = mPending.some(p=>p.ok) ? 'block' : 'none';
  }
  $('mImportBtn').addEventListener('click', async ()=>{
    const btn = $('mImportBtn'); btn.disabled = true;
    const lines = [];
    for(const p of mPending.filter(x=>x.ok)){
      btn.textContent = '匯入中：'+p.data.file;
      try{
        const res = await fetch(MANIFEST_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({ action:'import' }, p.data)) });
        const j = await res.json();
        if(!j || !j.success) throw new Error((j&&j.error)||'匯入失敗');
        lines.push(`✓ ${p.data.file}：新增 ${j.added} 箱${j.skipped?`，略過 ${j.skipped} 箱（已匯入過）`:''}`);
      }catch(err){ lines.push(`✗ ${p.data.file}：${err.message||err}`); }
    }
    btn.disabled = false; btn.textContent = '匯入全部'; btn.style.display = 'none';
    $('mPreview').innerHTML = lines.map(l=>`<div class="mrow"><div class="a" style="font-size:13px">${escapeHtml(l)}</div></div>`).join('');
    mPending = []; $('mFiles').value = '';
    await loadManifest(true);
  });

  async function loadManifest(force){
    if(!manifestOn()){ $('mMissing').innerHTML = '<div class="placeholder">尚未設定出貨單後端網址（MANIFEST_URL）</div>'; return; }
    try{
      const res = await fetch(MANIFEST_URL + '?t=' + Date.now());
      const j = await res.json();
      manifestBoxes = (j && j.boxes) || []; manifestLoaded = true;
    }catch(e){ console.error(e); if($('mMissing')) $('mMissing').innerHTML = '<div class="placeholder">讀取出貨單失敗，請稍後再試</div>'; return; }
    renderManifest();
  }
  function manifestDates(){ return Array.from(new Set(manifestBoxes.map(b=>b.shipDate))).sort().reverse(); }
  function renderManifest(){
    const dates = manifestDates(), keep = $('mDateSel').value;
    $('mDateSel').innerHTML = dates.length ? dates.map(d=>`<option value="${d}">${escapeHtml(d)}（${manifestBoxes.filter(b=>b.shipDate===d).length} 箱）</option>`).join('') : '<option value="">尚未匯入出貨單</option>';
    if(keep && dates.indexOf(keep)>=0) $('mDateSel').value = keep;
    if(!dates.length){ $('mMissing').innerHTML = '<div class="placeholder">還沒有匯入任何出貨單</div>'; return; }
    $('mMissing').innerHTML = dates.map(d=>{
      const list = manifestBoxes.filter(b=>b.shipDate===d);
      const miss = list.filter(b=>!arrivedRec(b.code));
      const batch = list[0] && list[0].batch ? '・'+escapeHtml(list[0].batch) : '';
      return `<div style="margin-bottom:14px;"><div style="font-weight:800; margin-bottom:6px;">${escapeHtml(d)}${batch}　<span class="mtag ${miss.length?'miss':'ok'}">已到 ${list.length-miss.length}/${list.length}</span></div>`
        + (miss.length ? miss.map(b=>`<div class="mrow"><div><div class="a">箱 ${escapeHtml(b.no)}・${escapeHtml(storeLabel(b.store))}</div><div class="b" style="text-align:left">${escapeHtml(b.code)}</div></div><div style="text-align:right"><span class="mtag miss">未到</span><div class="b">${b.styles}款 ${b.qty}件</div></div></div>`).join('') : '<div class="note" style="color:var(--green)">✓ 這批的箱子都到齊了</div>')
        + '</div>';
    }).join('');
  }

  // 標籤破損：用出貨日期 + 箱號查詢，確認後手動登記到倉
  let mFound = null, mType = '新品';
  function findBoxes(date, q){
    q = String(q||'').trim(); if(!q) return [];
    const list = manifestBoxes.filter(b=>b.shipDate===date);
    const exact = list.filter(b=> String(b.no)===q || b.code===q);
    if(exact.length) return exact;
    return list.filter(b=> b.code.endsWith(q));
  }
  $('mSearchBtn').addEventListener('click', async ()=>{
    if(!manifestLoaded) await loadManifest();
    const date = $('mDateSel').value, q = $('mBoxNo').value;
    const hits = findBoxes(date, q);
    if(!date){ $('mResult').innerHTML = '<div class="note">請先匯入出貨單</div>'; return; }
    if(!hits.length){ $('mResult').innerHTML = `<div class="note" style="color:var(--red)">這個出貨日期找不到箱號「${escapeHtml(q)}」</div>`; return; }
    if(hits.length>1){ $('mResult').innerHTML = hits.map(b=>`<div class="mrow"><div class="a">箱 ${escapeHtml(b.no)}・${escapeHtml(b.code)}</div><button class="refreshsmall" data-pick="${escapeHtml(b.code)}">選這箱</button></div>`).join(''); return; }
    showFound(hits[0]);
  });
  $('mResult').addEventListener('click', (e)=>{ const b = e.target.closest('[data-pick]'); if(b){ const box = manifestBoxes.find(x=>x.code===b.dataset.pick && x.shipDate===$('mDateSel').value); if(box) showFound(box); } });
  async function showFound(b){
    mFound = b; mType = '新品';
    const ar = arrivedRec(b.code);
    $('mResult').innerHTML = `<div style="background:var(--panel-2); border-radius:14px; padding:12px;">
      <div class="a" style="font-family:var(--font-mono); font-weight:800;">${escapeHtml(b.code)}</div>
      <div style="margin:4px 0 8px;">箱 ${escapeHtml(b.no)}・${escapeHtml(storeLabel(b.store))}・${b.styles} 款 ${b.qty} 件　${ar?`<span class="mtag ok">已到倉 ${escapeHtml(fmtTime(ar.arrivedAt))}</span>`:'<span class="mtag miss">尚未到倉</span>'}</div>
      <details><summary style="cursor:pointer; font-size:14px;">看箱內品項</summary><div id="mItems" class="note">讀取中...</div></details>
      ${ar ? '' : `<div class="field" style="margin-top:12px;"><label>類型</label><div class="filterrow"><button class="filterchip active" type="button" data-mtype="新品">新品</button><button class="filterchip" type="button" data-mtype="追加">追加</button></div></div>
      <label style="display:flex; gap:8px; align-items:center; margin:8px 0;"><input type="checkbox" id="mDamaged" checked> 標籤破損</label>
      <input type="text" class="searchbox" id="mNote" placeholder="備註（選填）">
      <button class="btn accent" id="mArriveBtn">確認到倉登記</button>`}
      <div id="mMsg" class="note"></div></div>`;
    fetch(MANIFEST_URL+'?action=items&code='+encodeURIComponent(b.code)).then(r=>r.json()).then(j=>{
      const its = (j&&j.items)||[];
      $('mItems').innerHTML = its.length ? its.map(it=>`${escapeHtml(it.style)} ${escapeHtml(it.name)} ${escapeHtml(it.spec)} × ${it.qty}`).join('<br>') : '沒有品項資料';
    }).catch(()=>{ const el=$('mItems'); if(el) el.textContent='讀取失敗'; });
  }
  $('mResult').addEventListener('click', (e)=>{
    const t = e.target.closest('[data-mtype]'); if(t){ mType = t.dataset.mtype; document.querySelectorAll('#mResult [data-mtype]').forEach(x=>x.classList.toggle('active', x===t)); }
  });
  $('mResult').addEventListener('click', async (e)=>{
    if(!e.target.closest('#mArriveBtn') || !mFound) return;
    const btn = $('mArriveBtn'); btn.disabled = true; btn.textContent = '登記中...';
    const json = await submitScan(mFound.code, mFound.qty || 1, 'arrive', mType);
    if(!json){ btn.disabled = false; btn.textContent = '確認到倉登記'; return; }
    if(json.success && (json.stage==='arrive' || json.stage==='already_arrived')){
      try{ await fetch(MANIFEST_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'note', code:mFound.code, shipDate:mFound.shipDate, damaged:$('mDamaged').checked, note:$('mNote').value, operator: operatorName }) }); }catch(err){ console.error(err); }
      $('mMsg').innerHTML = json.stage==='arrive' ? `<span style="color:var(--green); font-weight:700;">✓ 已登記到倉（${escapeHtml(mFound.code)}）</span>` : '⚠ 這箱之前已經進倉過了';
      btn.style.display = 'none';
      await refreshData(); renderManifest(); renderHomeStats();
    }else{ btn.disabled = false; btn.textContent = '確認到倉登記'; $('mMsg').innerHTML = '<span style="color:var(--red)">送出失敗，請檢查網路後再試一次</span>'; }
  });

  // ---- week progress tab ----
  function fridayAnchorDate(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    const date = new Date(y,m-1,d);
    const day = date.getDay(); // 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
    let diff;
    if(day===5) diff=0;
    else if(day===6) diff=1;
    else if(day===0) diff=2;
    else diff = day+2; // Mon(1)->3, Tue(2)->4, Wed(3)->5, Thu(4)->6
    date.setDate(date.getDate()-diff);
    return date;
  }
  function dateStrFromDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function buildCycleDates(dateStr){
    // cycle = [this Friday, next Monday, next Tuesday, next Wednesday, next Thursday]
    const fri = fridayAnchorDate(dateStr);
    const dates = [dateStrFromDate(fri)];
    for(let i=3;i<=6;i++){ const dt = new Date(fri); dt.setDate(fri.getDate()+i); dates.push(dateStrFromDate(dt)); }
    return dates;
  }
  function renderWeek(){
    if(!$('weekDate').value) $('weekDate').value = todayDateStr();
    const cycleDates = buildCycleDates($('weekDate').value); // [Fri, Mon, Tue, Wed, Thu]
    const weekdayOrder = [5,1,2,3,4];
    const dayLabels = ['週五','週一','週二','週三','週四'];
    $('weekHead').innerHTML = `<div class="weekhead">本輪 ${cycleDates[0]}（五）～ ${cycleDates[4]}（四）</div>`;

    const storeList = Object.keys(allStores).map(code=>allStores[code]);
    if(storeList.length===0){
      $('weekTableWrap').innerHTML = '<div class="placeholder">尚未載入店櫃排程資料</div>';
      return;
    }
    const cycleStart = cycleDates[0], cycleEnd = cycleDates[4];

    let html = '';
    weekdayOrder.forEach((wd, idx)=>{
      const dateStr = cycleDates[idx];
      const storesToday = storeList.filter(s=> s.weekday===wd);
      html += `<div class="section-label" style="margin-top:20px;">${dayLabels[idx]}（整${wd}）　${dateStr}</div>`;
      if(storesToday.length===0){
        html += `<div class="placeholder" style="padding:16px;">這天沒有排定要整新的店櫃</div>`;
        return;
      }
      html += `<div class="weektablewrap"><table class="weektable"><thead><tr><th>店櫃</th><th>已出艙／到貨</th></tr></thead><tbody>`;
      storesToday.forEach(store=>{
        const boxes = allRecords.filter(r=> r.storeCode===store.code && localDateStr(r.arrivedAt)>=cycleStart && localDateStr(r.arrivedAt)<=cycleEnd);
        const total = boxes.length;
        const done = boxes.filter(r=>r.departedAt).length;
        html += `<tr><td><span class="wc">${escapeHtml(store.code)}</span><span class="wsmall">${escapeHtml(store.name)}・${escapeHtml(store.type||'')}</span></td><td>${total? `${done}/${total}` : '尚無到貨'}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    });
    $('weekTableWrap').innerHTML = html;
  }
  $('weekDate').addEventListener('change', renderWeek);
  $('weekRefresh').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = '更新中...';
    await refreshData();
    renderWeek();
    btn.disabled = false;
    btn.textContent = original;
  });


  function renderLog(){
    const q = ($('logSearch').value||'').trim().toLowerCase();
    const list = allRecords
      .slice()
      .sort((a,b)=> new Date(b.updatedAt||b.arrivedAt) - new Date(a.updatedAt||a.arrivedAt))
      .filter(r=> !q || (r.boxCode||'').toLowerCase().includes(q) || (r.zone||'').toLowerCase().includes(q));
    if(list.length===0){ $('logList').innerHTML = '<div class="placeholder">還沒有任何點貨紀錄</div>'; return; }
    $('logList').innerHTML = list.map(r=>{
      const pending = r.arrivedAt && !r.departedAt;
      return `<div class="rec">
        <div class="top"><span class="box">${escapeHtml(r.boxCode)}</span><span class="st ${pending?'pending':'done'}">${pending?'待出艙':'已完成'}</span></div>
        <div class="zone">${escapeHtml(r.zone||'查無儲位')} · ${r.qty||1} 件</div>
        <div class="times"><span>到貨 ${fmtTime(r.arrivedAt)}</span><span>出艙 ${fmtTime(r.departedAt)||'—'}</span></div>
      </div>`;
    }).join('');
  }
  $('logSearch').addEventListener('input', renderLog);

  // ---- admin tab ----
  let adminVisibleCount = 20;
  const ADMIN_PAGE_SIZE = 20;
  let adminStatusFilter = 'all';

  function renderAdmin(){
    if(!$('adminDate').value) $('adminDate').value = todayDateStr();
    const day = $('adminDate').value;
    const dayRecords = allRecords.filter(r=> localDateStr(r.arrivedAt)===day );
    const arrivedCount = dayRecords.length;
    const doneRecs = dayRecords.filter(r=>r.departedAt);
    const pendingRecs = dayRecords.filter(r=>!r.departedAt);
    const doneCount = doneRecs.length;
    const pendingCount = pendingRecs.length;
    const doneQty = doneRecs.reduce((s,r)=> s+(parseInt(r.qty,10)||0), 0);
    const pendingQty = pendingRecs.reduce((s,r)=> s+(parseInt(r.qty,10)||0), 0);
    const totalQty = dayRecords.reduce((sum,r)=> sum + (parseInt(r.qty,10)||0), 0);
    const durations = dayRecords.filter(r=>r.departedAt).map(r=> (new Date(r.departedAt)-new Date(r.arrivedAt))/60000 );
    const avgMin = durations.length ? Math.round(durations.reduce((a,b)=>a+b,0)/durations.length) : 0;

    const newRecs = dayRecords.filter(r=> (r.type||'')==='新品');
    const addRecs = dayRecords.filter(r=> (r.type||'')==='追加');
    const newQty = newRecs.reduce((s,r)=> s+(parseInt(r.qty,10)||0), 0);
    const addQty = addRecs.reduce((s,r)=> s+(parseInt(r.qty,10)||0), 0);

    $('adminCards').innerHTML = `
      <div class="kpi"><div class="v">${arrivedCount}</div><div class="l">今日到貨箱數</div></div>
      <div class="kpi"><div class="v">${totalQty}</div><div class="l">統計總件數</div></div>
      <div class="kpi"><div class="v">${doneCount}</div><div class="l">已出艙（${doneQty} 件）</div></div>
      <div class="kpi"><div class="v">${pendingCount}</div><div class="l">待出艙（${pendingQty} 件）</div></div>
      <div class="kpi"><div class="v">${newRecs.length}</div><div class="l">新品箱數（${newQty} 件）</div></div>
      <div class="kpi"><div class="v">${addRecs.length}</div><div class="l">追加箱數（${addQty} 件）</div></div>
      <div class="kpi" style="grid-column:1 / -1;"><div class="v">${avgMin}</div><div class="l">平均停留（分鐘）</div></div>
    `;

    const q = ($('adminSearch').value||'').trim().toLowerCase();
    let filtered = dayRecords
      .sort((a,b)=> new Date(b.arrivedAt)-new Date(a.arrivedAt))
      .filter(r=>{
        if(adminStatusFilter==='pending' && r.departedAt) return false;
        if(adminStatusFilter==='done' && !r.departedAt) return false;
        if(!q) return true;
        return (r.boxCode||'').toLowerCase().includes(q) || (r.zone||'').toLowerCase().includes(q) || (r.operator||'').toLowerCase().includes(q);
      });

    if(filtered.length===0){
      $('adminList').innerHTML = '<div class="placeholder">找不到符合條件的紀錄</div>';
      $('adminMoreWrap').style.display = 'none';
      return;
    }
    const visible = filtered.slice(0, adminVisibleCount);
    $('adminList').innerHTML = visible.map(r=>{
      const pending = r.arrivedAt && !r.departedAt;
      const typeTag = r.type ? ` · ${escapeHtml(r.type)}` : '';
      return `<div class="rec">
        <div class="top"><span class="box">${escapeHtml(r.boxCode)}</span><span class="st ${pending?'pending':'done'}">${pending?'待出艙':'已完成'}</span></div>
        <div class="zone">${escapeHtml(r.zone||'查無儲位')} · ${escapeHtml(r.operator||'')} · ${r.qty||1} 件${typeTag}</div>
        <div class="times"><span>到貨 ${fmtTime(r.arrivedAt)}</span><span>出艙 ${fmtTime(r.departedAt)||'—'}</span></div>
      </div>`;
    }).join('');
    $('adminMoreWrap').style.display = filtered.length > adminVisibleCount ? 'block' : 'none';
  }
  $('adminDate').addEventListener('change', ()=>{ adminVisibleCount = ADMIN_PAGE_SIZE; renderAdmin(); });
  $('adminRefresh').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = '更新中...';
    await refreshData();
    renderAdmin();
    btn.disabled = false;
    btn.textContent = original;
  });
  $('adminSearch').addEventListener('input', ()=>{ adminVisibleCount = ADMIN_PAGE_SIZE; renderAdmin(); });
  $('adminLoadMore').addEventListener('click', ()=>{ adminVisibleCount += ADMIN_PAGE_SIZE; renderAdmin(); });
  document.querySelectorAll('#adminStatusFilter .filterchip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('#adminStatusFilter .filterchip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      adminStatusFilter = chip.dataset.status;
      adminVisibleCount = ADMIN_PAGE_SIZE;
      renderAdmin();
    });
  });

  // ============ SCAN / MANUAL ENTRY ============
  let scannerActive = false;
  let scannerPaused = false;
  let quaggaDetectedHandler = null;
  let manualMode = false;

  let currentScanMode = 'arrive';
  let currentBoxType = '新品';
  document.querySelectorAll('#typeWrap .filterchip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('#typeWrap .filterchip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      currentBoxType = chip.dataset.type;
    });
  });
  function openScanModal(manual, mode){
    manualMode = manual;
    currentScanMode = mode;
    const modeLabel = mode==='arrive' ? '進倉' : (mode==='organize' ? '整新' : '出艙');
    $('scanModalTitle').textContent = (manual ? '手動輸入箱號 - ' : '掃描箱號 - ') + modeLabel;
    $('scanReaderDiv').style.display = manual ? 'none' : 'block';
    $('scanReaderDiv').innerHTML = '';
    $('scanHintText').style.display = manual ? 'none' : 'block';
    $('scanHintText').textContent = '將條碼對準框框內';
    $('manualCodeWrap').style.display = manual ? 'block' : 'none';
    $('scanCodeInput').value = '';
    $('scanQtyInput').value = '1';
    $('qtyWrap').style.display = mode==='arrive' ? 'block' : 'none';
    $('typeWrap').style.display = mode==='arrive' ? 'block' : 'none';
    currentBoxType = '新品';
    document.querySelectorAll('#typeWrap .filterchip').forEach(c=> c.classList.toggle('active', c.dataset.type==='新品'));
    $('scanModalBg').classList.add('active');
    scannerPaused = manual;
    if(!manual) startCamera();
    else setTimeout(()=> $('scanCodeInput').focus(), 50);
  }
  function startCamera(){
    if(typeof Quagga === 'undefined'){
      $('scanReaderDiv').innerHTML = '<div style="color:#fff; padding:24px; text-align:center; font-size:14px;">相機掃描功能載入失敗，請改用手動輸入</div>';
      return;
    }
    Quagga.init({
      inputStream: {
        name: 'Live', type: 'LiveStream', target: document.getElementById('scanReaderDiv'),
        constraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      },
      numOfWorkers: 0,
      locate: true,
      locator: { patchSize: 'medium', halfSample: true },
      frequency: 10,
      decoder: { readers: ['code_128_reader','i2of5_reader'], multiple: false }
    }, function(err){
      if(err){
        $('scanReaderDiv').innerHTML = '<div style="color:#fff; padding:24px; text-align:center; font-size:14px;">無法開啟相機，請確認已允許相機權限</div>';
        return;
      }
      const videoEl = document.querySelector('#scanReaderDiv video');
      if(videoEl){
        videoEl.setAttribute('playsinline','true'); videoEl.setAttribute('webkit-playsinline','true');
        videoEl.muted = true; videoEl.play().catch(()=>{});
        videoEl.style.width = '100%'; videoEl.style.borderRadius = '10px';
      }
      Quagga.start();
      scannerActive = true;
      const canvasEl = document.querySelector('#scanReaderDiv canvas');
      if(canvasEl){ canvasEl.style.width='100%'; canvasEl.style.position='absolute'; canvasEl.style.top='0'; }
    });

    let recentReads = [];
    const REQUIRED_CONSENSUS = 3, WINDOW_MS = 3000;
    quaggaDetectedHandler = function(result){
      if(scannerPaused) return;
      const code = result && result.codeResult && result.codeResult.code;
      if(!code || code.length < 4) return;
      const now = Date.now();
      recentReads = recentReads.filter(r=> now - r.time < WINDOW_MS);
      recentReads.push({ code, time: now });
      const matches = recentReads.filter(r=>r.code===code).length;
      $('scanHintText').textContent = `辨識中...（${matches}/${REQUIRED_CONSENSUS}）`;
      if(matches < REQUIRED_CONSENSUS) return;
      recentReads = [];
      scannerPaused = true;
      if(navigator.vibrate) navigator.vibrate(80);
      $('scanCodeInput').value = code;
      $('manualCodeWrap').style.display = 'block';
      $('scanHintText').textContent = '掃描成功，請確認箱號後按確認';
    };
    Quagga.onDetected(quaggaDetectedHandler);
  }
  function stopCamera(){
    if(scannerActive){
      try{ if(quaggaDetectedHandler) Quagga.offDetected(quaggaDetectedHandler); Quagga.stop(); }catch(e){}
      scannerActive = false; quaggaDetectedHandler = null;
    }
  }
  function closeScanModal(){
    $('scanModalBg').classList.remove('active');
    stopCamera();
    scannerPaused = false;
  }
  $('scanCancelBtn').addEventListener('click', closeScanModal);
  $('scanModalBg').addEventListener('click', (e)=>{ if(e.target===$('scanModalBg')) closeScanModal(); });
  $('scanConfirmBtn').addEventListener('click', async ()=>{
    const code = $('scanCodeInput').value.trim();
    if(!code){ $('scanCodeInput').focus(); return; }
    const qty = Math.max(1, parseInt($('scanQtyInput').value,10) || 1);
    const mode = currentScanMode;
    const type = mode==='arrive' ? currentBoxType : '';
    closeScanModal();
    showLoadingBoard(code);
    const json = await submitScan(code, qty, mode, type);
    renderResultBoard(json, code);
    renderHomeStats();
  });
  $('scanArriveBtn').addEventListener('click', ()=> openScanModal(false, 'arrive'));
  $('manualArriveBtn').addEventListener('click', ()=> openScanModal(true, 'arrive'));
  $('scanDepartBtn').addEventListener('click', ()=> openScanModal(false, 'depart'));
  $('manualDepartBtn').addEventListener('click', ()=> openScanModal(true, 'depart'));

  // init
  loadOperator();
  refreshData();
  if(manifestOn()) loadManifest();
})();
</script>
</body>
</html>
