<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AIR SPACE 倉儲物流工作回報</title>
<style>
  :root{
    --bg:#F3F6FC; --panel:#FFFFFF; --panel-2:#EEF2FA; --line:#DCE3F0;
    --accent:#2FA5D6; --accent-2:#8B7FEF; --teal:#2FA39A; --green:#3AAE72; --red:#D9604B; --grey:#94A0B8;
    --text:#1C2536; --text-mute:#6E7996;
    --font-display:'Space Grotesk','Noto Sans TC',sans-serif;
    --font-body:'Inter','Noto Sans TC',sans-serif;
    --font-mono:'JetBrains Mono','Courier New',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; display:flex; justify-content:center; }
  .app{ width:100%; max-width:480px; min-height:100vh; background:var(--bg); position:relative; z-index:2; transition:max-width .2s ease; }
  .app.wide{ max-width:1180px; }
  @media (max-width: 860px){ .app.wide{ max-width:480px; } }
  .watermark{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-28deg); z-index:1; pointer-events:none; font-family:var(--font-display); font-weight:800; font-size:15vw; letter-spacing:0.06em; color:var(--accent); opacity:0.15; text-transform:uppercase; white-space:nowrap; }
  .watermark span{ color:var(--accent-2); }
  .view{display:none; position:relative; z-index:2;} .view.active{display:block;}

  .topbar{ background:linear-gradient(135deg,#D7ECFB,#E8E3FB); padding:22px 20px; border-bottom:1px solid var(--line); }
  .topbar h1, .topbar .who .n{ color:var(--text); }
  .topbar .eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; color:#3E7FA8; text-transform:uppercase; }
  .topbar h1{ font-family:var(--font-display); font-size:22px; margin:6px 0 4px; }
  .topbar .date{ font-size:12.5px; color:#5C6E90; font-family:var(--font-mono); }
  .topbar.small{ padding:16px 20px; display:flex; align-items:center; gap:10px; }
  .backbtn{ background:none; border:none; color:var(--text); font-size:20px; cursor:pointer; padding:0 4px 0 0; }
  .topbar.small .who{flex:1;}
  .topbar.small .who .n{font-family:var(--font-display); font-weight:700; font-size:16px;}
  .topbar.small .who .m{font-size:11.5px; color:#5C6E90; font-family:var(--font-mono);}
  .badge{ font-size:11px; padding:3px 9px; border-radius:20px; font-family:var(--font-mono); }
  .badge.synced{ background:rgba(58,174,114,0.16); color:var(--green); }
  .switchbtn{ background:rgba(28,37,54,0.06); border:1px solid rgba(28,37,54,0.14); color:var(--text); font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer; }

  main{padding:18px 20px 40px;}
  .section-label{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-mute); text-transform:uppercase; letter-spacing:0.06em; margin:20px 0 10px; }
  .section-label:first-child{margin-top:0;}

  .quickcard{ background:var(--panel); border:1px solid var(--accent); border-radius:14px; padding:16px; margin-bottom:6px; cursor:pointer; }
  .quickcard .n{font-weight:700; font-size:15px;}
  .quickcard .m{font-size:12.5px; color:var(--text-mute); margin:4px 0 8px; font-family:var(--font-mono);}
  .quickcard .go{font-size:13px; color:var(--accent); font-weight:600;}

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .regioncard{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 14px; text-align:center; cursor:pointer; }
  .regioncard .rn{font-family:var(--font-display); font-weight:700; font-size:16px;}
  .regioncard .rc{font-size:11.5px; color:var(--text-mute); margin-top:4px; font-family:var(--font-mono);}

  .adminbtn{ margin-top:22px; width:100%; padding:14px; border-radius:12px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-weight:700; font-family:var(--font-display); cursor:pointer; text-align:center; }

  .drivercard{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .drivercard .n{font-weight:700; font-size:15px;}
  .drivercard .c{font-size:11.5px; color:var(--text-mute); font-family:var(--font-mono); margin-top:3px;}
  .drivercard .arrow{color:var(--text-mute); font-size:18px;}

  /* driver progress header */
  .progresswrap{ background:var(--panel); padding:16px 20px; border-bottom:1px solid var(--line); }
  .pct{font-family:var(--font-display); font-size:34px; font-weight:700;}
  .pctlabel{font-size:11px; color:var(--text-mute); font-family:var(--font-mono);}
  .prow{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px;}
  .pstats{text-align:right; font-size:12px; color:var(--text-mute); font-family:var(--font-mono); line-height:1.6;}
  .barbg{ height:8px; background:var(--panel-2); border-radius:6px; overflow:hidden; }
  .barfg{ height:100%; background:var(--accent); border-radius:6px; transition:width .3s; }
  .metrics3{ display:flex; gap:10px; margin-top:12px; }
  .metric{ flex:1; background:var(--panel-2); border-radius:10px; padding:8px 10px; text-align:center; }
  .metric .v{font-family:var(--font-mono); font-weight:700; font-size:15px;}
  .metric .l{font-size:10.5px; color:var(--text-mute); margin-top:2px;}

  .stoplist{padding:16px 20px;}
  .stopcard{ background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:12px; padding:14px 16px; cursor:pointer; }
  .stopcard.locked{ opacity:0.45; cursor:not-allowed; }
  .stopcard.done{ border-color:var(--green); }
  .stopcard.partial{ border-color:var(--accent-2); }
  .stopcard .srow{display:flex; justify-content:space-between; align-items:flex-start;}
  .stopcard .idx{ font-family:var(--font-mono); font-size:12px; color:var(--text-mute); margin-bottom:3px; }
  .stopcard .site{font-weight:700; font-size:15.5px;}
  .stopcard .time{font-family:var(--font-mono); font-size:12px; color:var(--text-mute); margin-top:2px;}
  .stopcard .status{font-size:11px; padding:3px 9px; border-radius:20px; font-family:var(--font-mono);}
  .stopcard .status.wait{background:var(--panel-2); color:var(--text-mute);}
  .stopcard .status.inprogress{background:rgba(242,153,74,0.18); color:var(--accent);}
  .stopcard .status.done{background:rgba(63,191,127,0.18); color:var(--green);}
  .stopcard .status.partial{background:rgba(124,108,255,0.18); color:var(--accent-2);}
  .stopcard .locknote{font-size:12px; color:var(--text-mute); margin-top:8px; text-align:center;}
  .stopcard .itemcount{font-size:12px; color:var(--text-mute); margin-top:6px;}

  /* stop detail */
  .infobox{ margin:16px 20px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:13px; }
  .infobox .row1{ display:flex; justify-content:space-between; align-items:center; }
  .infobox .arrived{font-family:var(--font-mono); color:var(--teal);}
  .infobox .diff{font-family:var(--font-mono); font-size:12px;}
  .infobox .diff.late{color:var(--red);} .infobox .diff.ontime{color:var(--green);}
  .infobox .gpsmeta{font-size:11.5px; color:var(--text-mute); margin-top:6px; font-family:var(--font-mono);}

  .taskcount{ margin:0 20px 10px; font-size:13px; color:var(--text-mute); }
  .taskcount b{color:var(--text);}
  .alldone{ margin:0 20px 14px; background:rgba(63,191,127,0.12); border:1px solid var(--green); color:var(--green); text-align:center; padding:10px; border-radius:10px; font-size:13.5px; font-weight:600; }

  .taskrow{ margin:0 20px 10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .taskrow.na{ opacity:0.75; }
  .taskrow .trtop{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .taskname{flex:1; font-size:14.5px; font-weight:600;}
  .taskbtns{display:flex; gap:6px;}
  .tbtn{ font-size:11.5px; padding:6px 9px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text-mute); cursor:pointer; font-family:var(--font-body); white-space:nowrap; }
  .tbtn.done.active{ background:var(--green); border-color:var(--green); color:#0C1F14; }
  .tbtn.notdone.active{ background:var(--accent); border-color:var(--accent); color:#04212E; }
  .nabtn{ font-size:11.5px; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text-mute); cursor:pointer; font-family:var(--font-body); white-space:nowrap; }
  .nabtn.active{ background:var(--grey); border-color:var(--grey); color:#fff; }
  .pctrow{ display:flex; align-items:center; gap:10px; }
  .pctrow input[type=range]{ flex:1; accent-color:var(--accent); height:4px; }
  .pctval{ font-family:var(--font-mono); font-size:14px; font-weight:700; width:44px; text-align:right; }
  .taskextra{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .naReasonSelect{ margin-top:2px; }
  .naword{font-size:12px; color:var(--text-mute); font-family:var(--font-mono);}

  .field{margin:16px 20px;}
  .field label{ display:block; font-size:12px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-mute); margin-bottom:7px; font-family:var(--font-mono);}
  textarea, select, input[type=text]{ width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text); padding:11px 13px; border-radius:10px; font-size:14.5px; font-family:var(--font-body); resize:none; }
  textarea{min-height:80px;}
  .photo-box{ border:1.5px dashed var(--line); border-radius:12px; padding:12px; text-align:center; background:var(--panel); cursor:pointer; }
  .photo-box img{width:100%; max-height:180px; object-fit:cover; border-radius:8px; display:block;}
  .photo-box .hint{color:var(--text-mute); font-size:12.5px; padding:14px 0;}

  .bigbtn{ display:block; width:calc(100% - 40px); margin:20px 20px 30px; padding:15px; border-radius:12px; border:none; font-size:15px; font-weight:700; font-family:var(--font-display); cursor:pointer; text-align:center; }
  .bigbtn.arrive{ background:var(--teal); color:#0C2422; }
  .bigbtn.depart{ background:var(--accent); color:#04212E; }
  .bigbtn:disabled{ opacity:0.4; }
  .statusline{text-align:center; font-size:12.5px; font-family:var(--font-mono); margin-top:-14px; margin-bottom:14px; min-height:14px;}
  .statusline.err{color:var(--red);} .statusline.ok{color:var(--green);}

  /* admin */
  .admintabs{ display:flex; overflow-x:auto; border-bottom:1px solid var(--line); padding:0 12px; gap:4px; }
  .admintab{ padding:12px 12px; font-size:13px; color:var(--text-mute); white-space:nowrap; cursor:pointer; border-bottom:2px solid transparent; }
  .admintab.active{ color:var(--accent); border-color:var(--accent); font-weight:600; }
  .cards4{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:16px 20px; }
  .kpi{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .kpi .v{font-family:var(--font-display); font-size:24px; font-weight:700;}
  .kpi .l{font-size:11px; color:var(--text-mute); margin-top:3px;}
  .datepicker{ margin:0 20px 12px; display:flex; gap:8px; align-items:center; }
  .datepicker input[type=date]{ flex:1; }
  .refreshsmall{ padding:10px 12px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-size:12.5px; cursor:pointer; }

  .drow{ margin:0 20px 10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .drow .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .drow .dn{font-weight:700; font-size:14px;}
  .drow .dc{font-size:11px; color:var(--text-mute); font-family:var(--font-mono);}
  .drow .st{font-size:10.5px; padding:3px 8px; border-radius:20px; font-family:var(--font-mono);}
  .drow .st.on{background:rgba(63,191,127,0.18); color:var(--green);}
  .drow .st.off{background:var(--panel-2); color:var(--text-mute);}
  .drow .barbg{margin:6px 0 4px;}
  .drow .bottom{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-mute); font-family:var(--font-mono); }
  .anomaly{ margin:0 20px 8px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:flex; gap:10px; align-items:flex-start; }
  .anomaly .abadge{ font-size:10.5px; padding:3px 8px; border-radius:20px; font-family:var(--font-mono); white-space:nowrap; flex-shrink:0; }
  .anomaly .abadge.late{ background:rgba(224,101,79,0.18); color:var(--red); }
  .anomaly .abadge.notdone{ background:rgba(242,153,74,0.18); color:var(--accent); }
  .anomaly .abadge.na{ background:rgba(107,114,128,0.25); color:var(--grey); }
  .anomaly .abadge.note{ background:rgba(79,189,186,0.18); color:var(--teal); }
  .anomaly .atext{ font-size:12.5px; line-height:1.5; }
  .anomaly .atext b{ font-weight:700; }
  .anomaly .atext .sub{ color:var(--text-mute); font-size:11.5px; }
  .heroCard{ margin:0 20px 18px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; text-align:center; }
  .heroCard .v{ font-family:var(--font-display); font-size:44px; font-weight:700; }
  .heroCard .l{ font-size:12px; color:var(--text-mute); margin-top:4px; font-family:var(--font-mono); }
  .miniline{ margin:0 20px 10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; }
  .drillbar{ display:flex; align-items:center; gap:10px; margin:0 20px 14px; }
  .drillbar .back2{ background:var(--panel); border:1px solid var(--line); color:var(--text); width:34px; height:34px; border-radius:9px; cursor:pointer; font-size:16px; }
  .drillbar .title{ font-family:var(--font-display); font-weight:700; font-size:16px; }
  .taskpct{ margin:0 20px 10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .taskpct .trow{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px; }
  .taskpct .trow b{ font-weight:700; }
  .taskpct .trow span{ font-family:var(--font-mono); color:var(--text-mute); font-size:12px; }
  .miniline .n{font-weight:600; font-size:13.5px;}
  .miniline .c{font-size:11px; color:var(--text-mute); font-family:var(--font-mono);}
  .weekhead{ margin:0 20px 12px; font-size:12.5px; color:var(--text-mute); font-family:var(--font-mono); }
  .weektablewrap{ margin:0 20px 12px; overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
  .weektable{ border-collapse:collapse; width:100%; min-width:640px; font-size:12.5px; }
  .weektable th, .weektable td{ padding:10px 12px; text-align:center; white-space:nowrap; border-bottom:1px solid var(--line); }
  .weektable th{ font-family:var(--font-mono); font-size:11px; color:var(--text-mute); text-transform:uppercase; letter-spacing:0.04em; background:var(--panel-2); position:sticky; top:0; }
  .weektable td:nth-child(2){ text-align:left; }
  .weektable tr:last-child td{ border-bottom:none; }
  .wdn{ font-weight:700; font-size:13px; }
  .wdc{ font-size:10.5px; color:var(--text-mute); font-family:var(--font-mono); }
  .wpct{ font-family:var(--font-display); font-weight:700; font-size:14px; }
  .wfrac{ font-size:10px; color:var(--text-mute); font-family:var(--font-mono); margin-top:2px; }
  .wflag{ display:inline-block; min-width:20px; padding:2px 6px; border-radius:10px; font-family:var(--font-mono); font-weight:700; }
  .wflag.warn{ background:rgba(217,96,75,0.16); color:var(--red); }
  .weekfoot{ margin:0 20px 20px; font-size:11.5px; color:var(--text-mute); line-height:1.6; }
  .reasontable .reasonlabel{ text-align:left; font-weight:600; font-size:12px; }
  .reasontable .reasondist{ text-align:left; font-size:11px; color:var(--text-mute); white-space:normal; max-width:200px; }
  .barfg.warnbar{ background:var(--accent-2); }
  .placeholder{ margin:40px 20px; text-align:center; color:var(--text-mute); font-size:13.5px; line-height:1.8; }
  .appfooter{ margin:30px 20px 10px; padding-top:14px; border-top:1px solid var(--line); text-align:center; font-size:11px; color:var(--text-mute); font-family:var(--font-mono); line-height:1.8; }
  .clearlocal{ color:var(--accent); text-decoration:underline; cursor:pointer; }

  .loading{text-align:center; padding:50px 20px; color:var(--text-mute); font-family:var(--font-mono); font-size:13px;}
  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:100; display:none; align-items:center; justify-content:center; padding:24px; }
  .modal-bg.active{display:flex;}
  .modal{ background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:20px; max-width:92vw; max-height:86vh; }
  .modal img{max-width:100%; max-height:78vh; border-radius:8px; display:block;}
</style>
</head>
<body>
<div class="app">
  <div class="watermark">AIR <span>SPACE</span></div>

  <!-- HOME -->
  <div class="view active" id="view-home">
    <div class="topbar">
      <div class="eyebrow">AIR SPACE</div>
      <h1>倉儲物流工作回報</h1>
      <div class="date" id="homeDate"></div>
    </div>
    <main>
      <div id="quickcardWrap"></div>
      <div class="section-label">請選擇你的區域</div>
      <div class="grid2" id="regionGrid"></div>
      <button class="adminbtn" id="adminBtn">管理端 ／ 總部看板</button>
      <div id="homeFooterWrap"></div>
    </main>
  </div>

  <!-- DRIVER LIST for a region -->
  <div class="view" id="view-region">
    <div class="topbar small">
      <button class="backbtn" data-back="home">←</button>
      <div class="who"><div class="n" id="regionTitle"></div><div class="m">選擇司機</div></div>
    </div>
    <main id="regionDriverList"></main>
  </div>

  <!-- DRIVER stop list -->
  <div class="view" id="view-driver">
    <div class="topbar small">
      <button class="backbtn" data-back="home">←</button>
      <div class="who"><div class="n" id="drvName"></div><div class="m" id="drvMeta"></div></div>
      <span class="badge synced" id="syncBadge">同步中...</span>
    </div>
    <div class="progresswrap">
      <div class="prow">
        <div><div class="pct" id="drvPct">0%</div><div class="pctlabel">今日完成度</div></div>
        <div class="pstats" id="drvStats"></div>
      </div>
      <div class="barbg"><div class="barfg" id="drvBar" style="width:0%"></div></div>
      <div class="metrics3">
        <div class="metric"><div class="v" id="mArrived">0/0</div><div class="l">到站</div></div>
        <div class="metric"><div class="v" id="mLate">0</div><div class="l">遲到</div></div>
        <div class="metric"><div class="v" id="mDone">0/0</div><div class="l">項目完成</div></div>
      </div>
    </div>
    <div class="stoplist" id="stopList"></div>
  </div>

  <!-- STOP detail -->
  <div class="view" id="view-stop">
    <div class="topbar small">
      <button class="backbtn" data-back="driver">←</button>
      <div class="who"><div class="n" id="stopSite"></div><div class="m" id="stopTime"></div></div>
    </div>
    <div class="infobox" id="stopInfoBox"></div>
    <button class="bigbtn arrive" id="arriveBtn">到店打卡</button>
    <div class="statusline" id="arriveStatus"></div>
    <div class="taskcount" id="taskCountLine"></div>
    <div id="allDoneMsg"></div>
    <div id="taskRows"></div>
    <div class="field">
      <label>照片（選填）</label>
      <div class="photo-box" id="photoBox"><div class="hint" id="photoHint">＋ 拍照 / 選擇照片</div><img id="photoPreview" style="display:none;"></div>
      <input type="file" accept="image/*" capture="environment" id="fPhoto" style="display:none;">
    </div>
    <div class="field">
      <label>備註（選填）</label>
      <textarea id="stopNote" placeholder="有狀況可以在這裡說明..."></textarea>
    </div>
    <button class="bigbtn depart" id="departBtn" style="display:none;">離店打卡</button>
    <div class="statusline" id="stopStatus"></div>
  </div>

  <!-- ADMIN -->
  <div class="view" id="view-admin">
    <div class="topbar small">
      <button class="backbtn" data-back="home">←</button>

  function driverKey(d){ return d.region+'|'+d.name; }
  function findDriver(region, name){ return DRIVERS.find(d=>d.region===region && d.name===name); }

    if(driver.noSchedule) return [];
    if(driver.weeklyStops) return driver.weeklyStops[weekday] || [];
    return driver.dailyStops || [];
  }
  function getStopTasks(driver, stop, weekday){
    if(stop.free) return stop.free.map(n=>({name:n, active:true}));
    const table = driver.tables[stop.table] || [];
    return table.map(t=>({name:t.name, active:t.days.includes(weekday)}));
  }
  function todayDateStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function fmtDateDisplay(){
    const d = new Date();
    return `${todayDateStr()}　星期${WEEKDAY_NAMES[d.getDay()]}`;
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  let checkinsLoadedOnce = false;

  function showView(id){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    $(id).classList.add('active');
  }
  document.querySelectorAll('[data-back]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      stopAdminAutoRefresh();
      document.querySelector('.app').classList.remove('wide');
      const to = btn.dataset.back;
      if(to==='home') renderHome();
      if(to==='driver'){ showView('view-driver'); renderDriverView(); }
    });
  });

  // ============ HOME ============
  function renderHome(){
    $('homeDate').textContent = fmtDateDisplay();
    const regions = [...new Set(DRIVERS.map(d=>d.region))].sort((a,b)=> REGION_ORDER.indexOf(a) - REGION_ORDER.indexOf(b));
    $('regionGrid').innerHTML = regions.map(r=>{
      const count = DRIVERS.filter(d=>d.region===r).length;
      return `<div class="regioncard" data-region="${r}"><div class="rn">${r}</div><div class="rc">${count} 位司機</div></div>`;
    }).join('');
    document.querySelectorAll('.regioncard').forEach(c=>{
      c.addEventListener('click', ()=>openRegion(c.dataset.region));
    });

    let last = null;
    try{ last = JSON.parse(localStorage.getItem('lastDriver')||'null'); }catch(e){}
    if(last){
      const d = findDriver(last.region, last.name);
      if(d){
        $('quickcardWrap').innerHTML = `<div class="section-label">上次使用</div>
          <div class="quickcard" id="quickcardBtn">
            <div class="n">${escapeHtml(d.name)}</div>
            <div class="m">${d.region}區 · ${d.code} · ${escapeHtml(d.name)} · ${d.hours}</div>
            <div class="go">點此直接開始今日行程 →</div>
          </div>`;
        $('quickcardBtn').addEventListener('click', ()=>openDriver(d.region, d.name));
      }else{ $('quickcardWrap').innerHTML=''; }
    }else{ $('quickcardWrap').innerHTML=''; }

    $('adminBtn').onclick = openAdmin;
    $('homeFooterWrap').innerHTML = footerInfoHtml();
    wireFooterInfo();
    showView('view-home');
    // refresh checkins quietly so the "last loaded" time and quickcard stay current
    refreshCheckins().then(()=>{
      if($('view-home').classList.contains('active')){
        $('homeFooterWrap').innerHTML = footerInfoHtml();
        wireFooterInfo();
      }
    });
  }

  function openRegion(region){
    currentRegion = region;
    $('regionTitle').textContent = region+'區';
    const list = DRIVERS.filter(d=>d.region===region);
    $('regionDriverList').innerHTML = list.map(d=>`
      <div class="drivercard" data-name="${escapeHtml(d.name)}">
        <div><div class="n">${escapeHtml(d.name)}</div><div class="c">${d.code} · ${d.hours}</div></div>
        <div class="arrow">›</div>
      </div>`).join('');
    document.querySelectorAll('#regionDriverList .drivercard').forEach(c=>{
      c.addEventListener('click', ()=>openDriver(region, c.dataset.name));
    });
    showView('view-region');
  }

  // ============ DRIVER ============
  async function openDriver(region, name){
    currentDriver = findDriver(region, name);
    if(!currentDriver) return;
    localStorage.setItem('lastDriver', JSON.stringify({region, name}));
    $('drvName').textContent = currentDriver.name;
    $('drvMeta').textContent = `${currentDriver.region}${currentDriver.code} · ${currentDriver.name} · ${todayDateStr()}`;
    showView('view-driver');
    setSyncBadge('ok');
    await ensureCheckinsThen(()=>{ loadCurrentState(); renderDriverView(); }, $('stopList'));
  }

  async function refreshCheckins(){
    try{
      const res = await fetch(APPS_SCRIPT_URL);
      const data = await res.json();
      allCheckins = Array.isArray(data) ? data.filter(r=>r && r.key) : [];
      checkinsLoadedOnce = true;
      lastLoadedAt = new Date();
    }catch(e){ allCheckins = allCheckins || []; console.error(e); }
  }

  function footerInfoHtml(){
    const timeStr = lastLoadedAt ? lastLoadedAt.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '尚未載入';
    return `<div class="appfooter">
      資料來源：Google Sheets 雲端　·　上次載入時間：${timeStr}
      <br><span class="clearlocal" id="clearLocalBtn">清除本機資料</span>
    </div>`;
  }
  function wireFooterInfo(){
    const btn = document.getElementById('clearLocalBtn');
    if(!btn) return;
    btn.addEventListener('click', ()=>{
      if(confirm('確定要清除本機儲存的身份紀錄嗎？（不會影響雲端已送出的回報資料）')){
        try{ localStorage.clear(); }catch(e){}
        location.reload();
      }
    });
  }

  // Renders instantly from cache if we have it, then quietly re-fetches and
  // re-renders in the background so navigation never feels blocked after the
  // first load of the session.
  async function ensureCheckinsThen(renderFn, showLoadingEl){
    if(checkinsLoadedOnce){
      renderFn();
      refreshCheckins().then(renderFn).catch(()=>{});
      return;
    }
    if(showLoadingEl) showLoadingEl.innerHTML = '<div class="loading">載入中...</div>';
    await refreshCheckins();
    renderFn();
  }

  function loadCurrentState(){
    const key = driverKey(currentDriver)+'|'+todayDateStr();
    const rec = allCheckins.find(r=>r.key===key);
    const weekday = new Date().getDay();
    const stops = getStopsFor(currentDriver, weekday);
    if(rec && rec.state){
      let parsed = null;
      try{ parsed = typeof rec.state==='string' ? JSON.parse(rec.state) : rec.state; }catch(e){}
      if(parsed && parsed.stops){ currentState = parsed; return; }
    }
    currentState = { stops: stops.map(()=>({arrivedAt:null, departedAt:null, gps:null, photo:null, note:'', tasks:{}})) };
  }

  function setSyncBadge(state){
    const b = $('syncBadge');
    if(!b) return;
    if(state==='ok'){ b.textContent='已同步'; b.style.background='rgba(63,191,127,0.18)'; b.style.color='var(--green)'; }
    else if(state==='err'){ b.textContent='同步失敗'; b.style.background='rgba(224,101,79,0.18)'; b.style.color='var(--red)'; }
    else{ b.textContent='同步中...'; b.style.background='rgba(154,156,163,0.18)'; b.style.color='var(--text-mute)'; }
  }

  async function saveCurrentState(){
    setSyncBadge('saving');
    const key = driverKey(currentDriver)+'|'+todayDateStr();
    const payload = { action:'checkin', key, region:currentDriver.region, name:currentDriver.name, date:todayDateStr(), state: JSON.stringify(currentState) };
    try{
      const res = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
      const json = await res.json();
      if(!json || !json.success) throw new Error('save failed');
      const idx = allCheckins.findIndex(r=>r.key===key);
      if(idx>=0) allCheckins[idx].state = payload.state; else allCheckins.push({key, region:payload.region, name:payload.name, date:payload.date, state:payload.state});
      setSyncBadge('ok');
      return true;
    }catch(e){ console.error(e); setSyncBadge('err'); return false; }
  }

  function computeProgress(driver, weekday, state){
    const stops = getStopsFor(driver, weekday);
    let totalTasks=0, doneTasks=0, weightedSum=0, arrivedCount=0, lateCount=0;
    stops.forEach((stop,i)=>{
      const tasks = getStopTasks(driver, stop, weekday).filter(t=>t.active);
      const st = state.stops[i] || {};
      tasks.forEach(t=>{
        const rec = st.tasks && st.tasks[t.name];
        if(rec && rec.status==='na') return; // not-applicable items don't count toward completion
        totalTasks++;
        if(rec && rec.status==='done'){ doneTasks++; weightedSum += 100; }
        else if(rec && rec.status==='partial'){ weightedSum += (typeof rec.percent==='number' ? rec.percent : 0); }
      });
      if(st.arrivedAt){
        arrivedCount++;
        const sched = parseSchedStart(stop.time);
        if(sched){
          const diff = (new Date(st.arrivedAt) - sched)/60000;
          if(diff > LATE_TOLERANCE_MIN) lateCount++;
        }
      }
    });
    return { totalTasks, doneTasks, arrivedCount, totalStops:stops.length, lateCount,
      pct: totalTasks ? Math.round(weightedSum/totalTasks) : 0 };
  }
  function parseSchedStart(timeStr){
    if(!timeStr) return null;
    const m = timeStr.match(/(\d{2}):(\d{2})/);
    if(!m) return null;
    const d = new Date();
    d.setHours(+m[1], +m[2], 0, 0);
    return d;
  }

      }else if(status==='na'){
        extraHtml = `<div class="taskextra naReasonSelect">
          <select data-reason-task="${escapeHtml(t.name)}">
            <option value="">請選擇不適用原因</option>
            ${NA_REASONS.map(r=>`<option value="${r.code}" ${rec.reason===r.code?'selected':''}>${r.code} ${r.label}</option>`).join('')}
          </select>
        </div>`;

      return `<div class="taskrow" data-task="${escapeHtml(t.name)}">
        <div class="trtop">

          st.tasks[taskName] = { status:'partial', percent: (typeof prev.percent==='number')?prev.percent:50, reason: prev.reason||'' };

  function weekdayOfDateStr(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).getDay(); }

  function buildAdminAnalytics(weekday, dateStr){
    const online = [], notOnline = [], anomalies = [];
    let totalTasks=0, totalDone=0;
    const byTaskType = {}; // name -> {totalWeighted, count}
    const reasonMap = {}; NA_REASONS.forEach(r=> reasonMap[r.code]=r.label);
    DRIVERS.forEach(d=>{
      const stops = getStopsFor(d, weekday);
      if(d.noSchedule || stops.length===0) return; // skip drivers with no schedule data
      const key = driverKey(d)+'|'+dateStr;
      const rec = allCheckins.find(r=>r.key===key);
      let state = { stops: stops.map(()=>({tasks:{}})) };
      if(rec && rec.state){ try{ const p = typeof rec.state==='string'?JSON.parse(rec.state):rec.state; if(p&&p.stops) state=p; }catch(e){} }
      const prog = computeProgress(d, weekday, state);
      totalTasks += prog.totalTasks; totalDone += prog.doneTasks;
      const started = state.stops.some(s=>s && s.arrivedAt);
      if(started) online.push({d, prog}); else notOnline.push({d, prog});

      stops.forEach((stop,i)=>{
        const st = state.stops[i] || {};
        if(st.arrivedAt){
          const sched = parseSchedStart(stop.time);
          if(sched){
            const diff = Math.round((new Date(st.arrivedAt) - sched)/60000);
            if(diff > LATE_TOLERANCE_MIN) anomalies.push({type:'late', driver:d, stop, detail:`晚 ${diff} 分`});
          }
        }
        const tasks = getStopTasks(d, stop, weekday).filter(t=>t.active);
        tasks.forEach(t=>{
          const rec2 = st.tasks && st.tasks[t.name];
          if(rec2 && rec2.status==='na'){
            const reasonLabel = reasonMap[rec2.reason] || '尚未選擇原因';
            anomalies.push({type:'na', driver:d, stop, detail:`${t.name}　${reasonLabel}`});
            return; // excluded from task-type completion stats
          }
          if(!byTaskType[t.name]) byTaskType[t.name] = {weighted:0, count:0};
          byTaskType[t.name].count++;
          if(rec2 && rec2.status==='done'){ byTaskType[t.name].weighted += 100; }
          else if(rec2 && rec2.status==='partial'){
            const pct = typeof rec2.percent==='number' ? rec2.percent : 0;
            byTaskType[t.name].weighted += pct;
            const reasonSuffix = rec2.reason ? `　（${reasonMap[rec2.reason]||rec2.reason}）` : '';
            anomalies.push({type:'notdone', driver:d, stop, detail:`${t.name}　${pct}%${reasonSuffix}`});
          }
        });
        if(st.note && st.note.trim()) anomalies.push({type:'note', driver:d, stop, detail:st.note.trim()});
      });
    });
    const taskTypeList = Object.keys(byTaskType).map(name=>({
      name, total: byTaskType[name].count,
      pct: byTaskType[name].count ? Math.round(byTaskType[name].weighted/byTaskType[name].count) : 0
    })).sort((a,b)=> a.pct - b.pct);
    return { online, notOnline, anomalies, totalTasks, totalDone, taskTypeList, overallPct: totalTasks ? Math.round(totalDone/totalTasks*100) : 0 };
  }

  const ANOMALY_LABEL = { late:'遲到', notdone:'未完成', na:'不適用', note:'備註' };

  function mondayOfWeek(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    const date = new Date(y,m-1,d);
    const day = date.getDay();
    const diffToMonday = day===0 ? -6 : 1-day;
    date.setDate(date.getDate()+diffToMonday);
    return date;
  }
  function dateStrFromDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function buildWeekDates(dateStr){
    const monday = mondayOfWeek(dateStr);
    const dates = [];
    for(let i=0;i<5;i++){ const dt = new Date(monday); dt.setDate(monday.getDate()+i); dates.push(dateStrFromDate(dt)); }
    return dates;
  }

  function buildWeeklyTable(weekDates){
    const rows = DRIVERS.filter(d=>!d.noSchedule).map(d=>{
      let totalTasks=0, doneCount=0, weightedSum=0, lateCount=0, naCount=0, allTasksCount=0;
      const dayPct = [];
      weekDates.forEach((dateStr, idx)=>{
        const weekday = idx+1; // Monday..Friday
        const stops = getStopsFor(d, weekday);
        const key = driverKey(d)+'|'+dateStr;
        const rec = allCheckins.find(r=>r.key===key);
        let state = { stops: stops.map(()=>({tasks:{}})) };
        if(rec && rec.state){ try{ const p = typeof rec.state==='string'?JSON.parse(rec.state):rec.state; if(p&&p.stops) state=p; }catch(e){} }
        let dTotal=0, dWeighted=0;
        stops.forEach((stop,i)=>{
          const st = state.stops[i] || {};
          if(st.arrivedAt){
            const sched = parseSchedStart(stop.time);
            if(sched){ const diff = Math.round((new Date(st.arrivedAt)-sched)/60000); if(diff>LATE_TOLERANCE_MIN) lateCount++; }
          }
          const tasks = getStopTasks(d, stop, weekday).filter(t=>t.active);
          tasks.forEach(t=>{
            allTasksCount++;
            const rec2 = st.tasks && st.tasks[t.name];
            if(rec2 && rec2.status==='na'){ naCount++; return; }
            dTotal++; totalTasks++;
            if(rec2 && rec2.status==='done'){ dWeighted+=100; doneCount++; }
            else if(rec2 && rec2.status==='partial'){ dWeighted += (typeof rec2.percent==='number'?rec2.percent:0); }
          });
        });
        dayPct.push(dTotal ? Math.round(dWeighted/dTotal) : 0);
        weightedSum += dWeighted;
      });
      const weekPct = totalTasks ? Math.round(weightedSum/totalTasks) : 0;
      const naRate = allTasksCount ? Math.round(naCount/allTasksCount*100) : 0;
      return { d, weekPct, dayPct, doneCount, totalTasks, notdoneCount: totalTasks-doneCount, lateCount, naRate };
    });
    rows.sort((a,b)=> b.weekPct - a.weekPct);
    return rows;
  }
  function buildReasonAnalysis(weekDates){
    const counts = {}; // code ('' for unfilled) -> {count, drivers:{name:count}}
    let total = 0;
    DRIVERS.forEach(d=>{
      if(d.noSchedule) return;
      weekDates.forEach((dateStr, idx)=>{
        const weekday = idx+1;
        const stops = getStopsFor(d, weekday);
        if(stops.length===0) return;
        const key = driverKey(d)+'|'+dateStr;
        const rec = allCheckins.find(r=>r.key===key);
        if(!rec || !rec.state) return;
        let state; try{ state = typeof rec.state==='string'?JSON.parse(rec.state):rec.state; }catch(e){ return; }
        if(!state || !state.stops) return;
        stops.forEach((stop,i)=>{
          const st = state.stops[i] || {};
          const tasks = getStopTasks(d, stop, weekday).filter(t=>t.active);
          tasks.forEach(t=>{
            const rec2 = st.tasks && st.tasks[t.name];
            if(rec2 && (rec2.status==='na' || rec2.status==='partial')){
              const code = rec2.reason || '';
              if(!counts[code]) counts[code] = {count:0, drivers:{}};
              counts[code].count++;
              counts[code].drivers[d.name] = (counts[code].drivers[d.name]||0)+1;
              total++;
            }
          });
        });
      });
    });
    const rows = Object.keys(counts).map(code=>{
      const meta = NA_REASON_MAP[code];
      const label = meta ? meta.label : '（未填原因）';
      const category = meta ? meta.category : '—';
      const distribution = Object.keys(counts[code].drivers).map(n=>`${n}${counts[code].drivers[n]}`).join('、');
      return { code, label, category, count:counts[code].count,
        pct: total ? Math.round(counts[code].count/total*1000)/10 : 0, distribution };
    }).sort((a,b)=> b.count-a.count);
    return { rows, total };
  }

  let liveDrill = null; // null | 'completion' | 'online' | 'offline' | 'anomaly'

  function renderAdmin(){
    if(adminTab==='export' || adminTab==='people'){
      const labels = {export:'匯出', people:'排程與人員'};
      $('adminBody').innerHTML = `<div class="placeholder">「${labels[adminTab]}」功能開發中，下一輪會加進來。</div>`;
      return;
    }

    if(adminTab==='reason'){
      const weekDates = buildWeekDates(adminDate);
      const ra = buildReasonAnalysis(weekDates);
      let rbody = `<div class="weekhead">本週 ${weekDates[0]} ～ ${weekDates[4]}　·　共 ${ra.total} 筆</div>`;
      if(ra.rows.length===0){
        rbody += `<div class="placeholder">本週還沒有任何「不適用」的原因紀錄</div>`;
      }else{
        rbody += `<div class="weektablewrap"><table class="weektable reasontable">
          <thead><tr><th>原因</th><th>類別</th><th>次數</th><th>佔比</th><th>分佈</th></tr></thead>
          <tbody>
          ${ra.rows.map(r=>`
            <tr>
              <td class="reasonlabel">${r.code?escapeHtml(r.code+' '+r.label):escapeHtml(r.label)}</td>
              <td>${escapeHtml(r.category)}</td>
              <td>${r.count}</td>
              <td><div class="wpct">${r.pct}%</div><div class="barbg" style="width:80px;"><div class="barfg ${r.category==='排程因素'?'warnbar':''}" style="width:${Math.min(r.pct,100)}%"></div></div></td>
              <td class="reasondist">${escapeHtml(r.distribution)}</td>
            </tr>
          `).join('')}
          </tbody>
        </table></div>
        <div class="weekfoot">怎麼讀這張表：「排程因素」佔比偏高，代表排程本身太緊或不合理，該修的是排程，不是要求司機加快——這是這套系統最有價值的產出。</div>`;
      }
      rbody += footerInfoHtml();
      $('adminBody').innerHTML = rbody;
      wireFooterInfo();
      return;
    }

    const weekday = weekdayOfDateStr(adminDate);
    const a = buildAdminAnalytics(weekday, adminDate);

    let body = `
      <div class="datepicker">
        <input type="date" id="adminDateInput" value="${adminDate}">
        <button class="refreshsmall" id="adminRefreshBtn">重新載入</button>
      </div>
    `;

    if(adminTab==='live'){
      if(!liveDrill){
        body += `<div class="cards4">
          <div class="kpi" data-drill="completion" style="cursor:pointer;"><div class="v">${a.overallPct}%</div><div class="l">全台完成度 · ${a.totalDone}/${a.totalTasks} 項</div></div>
          <div class="kpi" data-drill="online" style="cursor:pointer;"><div class="v">${a.online.length}</div><div class="l">上線司機</div></div>
          <div class="kpi" data-drill="offline" style="cursor:pointer;"><div class="v">${a.notOnline.length}</div><div class="l">未上線司機</div></div>
          <div class="kpi" data-drill="anomaly" style="cursor:pointer;"><div class="v">${a.anomalies.length}</div><div class="l">異常狀況</div></div>
        </div>`;
      }else if(liveDrill==='completion'){
        body += `<div class="drillbar"><button class="back2" id="drillBackBtn">←</button><div class="title">全台完成度 · ${a.overallPct}%</div></div>`;
        body += a.taskTypeList.length ? a.taskTypeList.map(t=>`
          <div class="taskpct">
            <div class="trow"><b>${escapeHtml(t.name)}</b><span>${t.done}/${t.total} · ${t.pct}%</span></div>
            <div class="barbg"><div class="barfg" style="width:${t.pct}%"></div></div>
          </div>
        `).join('') : `<div class="placeholder">今天還沒有任何工作項目資料</div>`;
      }else if(liveDrill==='online'){
        body += `<div class="drillbar"><button class="back2" id="drillBackBtn">←</button><div class="title">上線司機（${a.online.length}）</div></div>`;
        body += a.online.length ? a.online.map(({d,prog})=>`
          <div class="miniline"><div><div class="n">${escapeHtml(d.name)}</div><div class="c">${d.region} · ${d.code}</div></div><div class="c">${prog.pct}% · 到站 ${prog.arrivedCount}/${prog.totalStops}</div></div>
        `).join('') : `<div class="placeholder">目前沒有司機上線</div>`;
      }else if(liveDrill==='offline'){
        body += `<div class="drillbar"><button class="back2" id="drillBackBtn">←</button><div class="title">未上線司機（${a.notOnline.length}）</div></div>`;
        body += a.notOnline.length ? a.notOnline.map(({d})=>`
          <div class="miniline"><div><div class="n">${escapeHtml(d.name)}</div><div class="c">${d.region} · ${d.code} · ${d.hours}</div></div><div class="c">尚未打卡</div></div>
        `).join('') : `<div class="placeholder">今天排班的司機都已上線</div>`;
      }else if(liveDrill==='anomaly'){
        body += `<div class="drillbar"><button class="back2" id="drillBackBtn">←</button><div class="title">異常狀況（${a.anomalies.length}）</div></div>`;
        if(a.anomalies.length){
          const bySite = {};
          a.anomalies.forEach(an=>{
            const siteKey = an.stop.site;
            if(!bySite[siteKey]) bySite[siteKey] = [];
            bySite[siteKey].push(an);
          });
          body += Object.keys(bySite).map(site=>{
            const items = bySite[site];
            const driverNames = [...new Set(items.map(i=>i.driver.name))].join('、');
            return `<div class="section-label" style="margin-top:18px;">${escapeHtml(site)}（${items.length}）<span style="font-weight:400; color:var(--text-mute); text-transform:none; font-family:var(--font-body);">　${escapeHtml(driverNames)}</span></div>` +
              items.map(an=>`
                <div class="anomaly">
                  <span class="abadge ${an.type}">${ANOMALY_LABEL[an.type]}</span>
                  <div class="atext"><b>${escapeHtml(an.driver.name)}</b><div class="sub">${escapeHtml(an.detail)}</div></div>
                </div>
              `).join('');
          }).join('');
        }else{
          body += `<div class="placeholder">目前沒有異常狀況</div>`;
        }
      }
    }else if(adminTab==='rate'){
      const weekDates = buildWeekDates(adminDate);
      const weekRows = buildWeeklyTable(weekDates);
      const dayLabels = ['週一','週二','週三','週四','週五'];
      body += `<div class="weekhead">本週 ${weekDates[0]} ～ ${weekDates[4]}　·　完成度 ＝ 已完成 ÷（應做－不適用）</div>`;
      body += `<div class="weektablewrap"><table class="weektable">
        <thead><tr>
          <th>名次</th><th>司機</th><th>週完成度</th>
          ${dayLabels.map(l=>`<th>${l}</th>`).join('')}
          <th>未完成</th><th>遲到</th><th>不適用率</th>
        </tr></thead>
        <tbody>
        ${weekRows.map((r,i)=>`
          <tr>
            <td>${i+1}</td>
            <td><div class="wdn">${escapeHtml(r.d.name)}</div><div class="wdc">${r.d.region}</div></td>
            <td>
              <div class="wpct">${r.weekPct}%</div>
              <div class="barbg" style="width:90px;"><div class="barfg" style="width:${r.weekPct}%"></div></div>
              <div class="wfrac">${r.doneCount}/${r.totalTasks}</div>
            </td>
            ${r.dayPct.map(p=>`<td>${p}%</td>`).join('')}
            <td>${r.notdoneCount>0?`<span class="wflag warn">${r.notdoneCount}</span>`:r.notdoneCount}</td>
            <td>${r.lateCount}</td>
            <td>${r.naRate}%</td>
          </tr>
        `).join('')}
        </tbody>
      </table></div>
      <div class="weekfoot">不適用率連續兩週超過 20% 者，之後會自動列入異常清單（此邏輯下一輪加入）。</div>`;
    }

    body += footerInfoHtml();

    $('adminBody').innerHTML = body;
    $('adminDateInput').addEventListener('change', (e)=>{ adminDate = e.target.value; renderAdmin(); });
    $('adminRefreshBtn').addEventListener('click', async ()=>{ $('adminBody').innerHTML='<div class="loading">載入中...</div>'; await refreshCheckins(); renderAdmin(); });
    document.querySelectorAll('#adminBody [data-drill]').forEach(el=>{
      el.addEventListener('click', ()=>{ liveDrill = el.dataset.drill; renderAdmin(); });
    });
    const backBtn = $('drillBackBtn');
    if(backBtn) backBtn.addEventListener('click', ()=>{ liveDrill = null; renderAdmin(); });
    wireFooterInfo();
  }

  $('imgModalBg').addEventListener('click', ()=> $('imgModalBg').classList.remove('active'));

  // init
  renderHome();
})();
</script>
</body>
</html>
