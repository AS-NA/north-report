<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>瑕疵品追蹤</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--mute:#6b7384;--line:#e2e5ec;--pri:#2457d6;--pri-ink:#fff;
--s-reg:#b7791f;--s-reg-bg:#fdf3dc;--s-fix:#2457d6;--s-fix-bg:#e4ecfd;--s-scrap:#b4233a;--s-scrap-bg:#fde6ea;--s-done:#1b7f4b;--s-done-bg:#dff3e7;--s-void:#6b7384;--s-void-bg:#eceef2;
--warn:#e0a100;--bad:#c62828}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
header{background:#111827;border-bottom:0;color:#fff}
.brand{flex:1;min-width:0}
.brand .wm{font-size:19px;font-weight:300;letter-spacing:.32em;line-height:1.1;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.brand .sub{font-size:10.5px;letter-spacing:.14em;color:#9aa4b8;margin-top:3px;white-space:nowrap}
header .who{color:#aeb7c9;background:rgba(255,255,255,.07);border-radius:10px;padding:5px 10px;text-align:left}
header .who b{color:#fff}
.role{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.role button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 4px;font:inherit;font-size:13px;color:var(--mute);cursor:pointer;line-height:1.3}
.role button b{display:block;font-size:22px;margin-bottom:2px;font-weight:400}
.role button.on{border-color:#111827;background:#111827;color:#fff}
.me-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.me-top .wm{font-weight:300;letter-spacing:.3em;font-size:15px}
.me-top .ln{flex:1;height:1px;background:linear-gradient(90deg,#111827,transparent)}
.storebox{background:#f4f6fa;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px;color:var(--mute);line-height:1.6}
.storebox b{color:var(--ink);font-size:14px}
.who{font-size:12.5px;color:var(--mute);text-align:right;cursor:pointer;line-height:1.3;max-width:55%}
.who b{color:var(--ink)}
.sync{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block;margin-right:4px}
.sync.ok{background:#1b7f4b}.sync.busy{background:var(--warn)}.sync.err{background:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--mute);cursor:pointer;position:relative}
nav button .ic{display:block;font-size:20px;line-height:1.1}
nav button.on{color:var(--pri);font-weight:600}
nav .dot{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;min-width:17px;padding:0 4px;line-height:17px}
main{max-width:760px;margin:0 auto;padding:12px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--mute);font-weight:600}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #b9cbf7;border-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;color:var(--ink);text-align:left}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip small{display:block;font-size:11.5px;opacity:.75;margin-top:2px}
.chips.major .chip{flex:1 1 calc(50% - 8px);min-width:140px;font-weight:600}
.chips.sub .chip{flex:1 1 calc(50% - 8px)}
.sel-sum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--mute)}.sel-sum .chip{padding:5px 10px;font-size:13px}
.chips.recent .chip{padding:7px 10px;font-size:13px;border-style:dashed}
.btn{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.gray{background:#eceef2;color:var(--ink)}
.btn.red{background:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%;display:block}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}.grow{flex:1}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{border:0;background:#f1f3f7;width:44px;height:44px;font-size:22px;cursor:pointer}
.stepper input{border:0;text-align:center;width:60px;height:44px;border-radius:0;padding:0;font-weight:600;font-size:17px}
.badge{display:inline-block;font-size:12px;border-radius:7px;padding:2px 8px;font-weight:600}
.b-reg{background:var(--s-reg-bg);color:var(--s-reg)}.b-fix{background:var(--s-fix-bg);color:var(--s-fix)}
.b-scrap{background:var(--s-scrap-bg);color:var(--s-scrap)}.b-done{background:var(--s-done-bg);color:var(--s-done)}.b-void{background:var(--s-void-bg);color:var(--s-void)}
.age{font-size:12px;border-radius:7px;padding:2px 7px;background:#eef0f4;color:var(--mute)}
.age.warn{background:#fff2c9;color:#8a6200}.age.bad{background:#fde0e0;color:var(--bad);font-weight:600}
.item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .l{flex:1;min-width:0}
.item .t{font-weight:600;word-break:break-all}
.item .m{font-size:12.5px;color:var(--mute)}
.item input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.seg{display:flex;background:#e9ecf2;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:24px;line-height:1.2}.kpi span{font-size:12px;color:var(--mute)}
.kpi.warn b{color:var(--bad)}
.bar{height:10px;background:#eef0f4;border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.hb{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.hb .n{width:96px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{flex:1}.hb .v{width:34px;text-align:right;flex:none;font-weight:600}
.mx{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:10px}
table.mx2{border-collapse:collapse;font-size:12px;width:max-content;min-width:100%}
.mx2 th,.mx2 td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
.mx2 th{background:#f4f5f7;position:sticky;top:0}
.mx2 td.l,.mx2 th.l{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
.mx2 tr.g td{background:#eef2fb;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(15,20,35,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 4px;font-size:18px}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 8px;font-size:14px;margin:8px 0}
.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-all}
.tl{border-left:2px solid var(--line);margin:8px 0 8px 6px;padding-left:12px;font-size:13px}
.tl div{margin-bottom:6px;position:relative}.tl div:before{content:"";position:absolute;left:-17px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--pri)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2330;color:#fff;border-radius:10px;padding:10px 16px;z-index:80;font-size:14px;display:none;max-width:90%}
.toast.on{display:block}
.sticky-act{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.hint{font-size:12.5px;color:var(--mute)}
.pill{font-size:12px;background:#eef0f4;border-radius:8px;padding:2px 7px;margin-left:4px}

.pm{margin-top:8px}
.pcard{background:#eef4ff;border:1px solid #c9d9fb;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.55}
.pcard b{font-size:14.5px}
.sg{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sg div{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.sg div:last-child{border-bottom:0}.sg div small{color:var(--mute);display:block}
.sg div:active{background:#eef4ff}
.skurow{display:flex;gap:8px}.skurow input{flex:1}
.scanbtn{border:0;background:#111827;color:#fff;border-radius:10px;padding:0 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
#cam{width:100%;border-radius:12px;background:#000;max-height:60vh}
</style>
</head>

function statusOf(r){
  if(r.void) return '已作廢';
  if(r.closeAt) return '已結案';
  if(r.resAt) return '待報廢核准';
  if(r.startAt) return '修復中';
  return '已登記';
}
const BADGE = {'已登記':'b-reg','修復中':'b-fix','待報廢核准':'b-scrap','已結案':'b-done','已作廢':'b-void'};
function stageStart(r){ const s=statusOf(r); return s==='已登記'?r.regAt : s==='修復中'?r.startAt : s==='待報廢核准'?r.resAt : null; }
function ageDays(r){ const s=stageStart(r); if(!s) return 0; return Math.max(0,Math.floor((Date.now()-toD(s).getTime())/86400000)); }
function ageLevel(r){ const s=statusOf(r), sla=CONFIG.SLA[s]; if(!sla) return ''; const a=ageDays(r); return a>=sla[1]?'bad':a>=sla[0]?'warn':''; }
const ageTag = r => { const s=statusOf(r); if(!CONFIG.SLA[s]) return ''; const a=ageDays(r); return `<span class="age ${ageLevel(r)}">${a===0?'今天':a+'天'}</span>`; };

function save(rec){
  rec.updatedAt = nowStr()+'.'+String(Date.now()%1000).padStart(3,'0');
  rec.status = statusOf(rec);
  cache[rec.id] = rec;
  if(!outbox.includes(rec.id)) outbox.push(rec.id);
  persist(); flush(); renderAll();
}

// ================= 雲端同步 =================
let flushing=false;
async function flush(){
  if(!CONFIG.API_URL || flushing || !outbox.length) return;
  flushing=true; setSync('busy');
  try{
    while(outbox.length){
      const id=outbox[0], rec=cache[id];
      if(!rec){ outbox.shift(); continue; }
      const sent=rec.updatedAt;
      const res = await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',record:rec})});
      const j = await res.json();
      if(!j.ok) throw new Error(j.error||'save failed');
      outbox.shift();
      if(cache[id].updatedAt===sent) cache[id]=j.record; else outbox.push(id);   // 傳送期間又被修改：再送一次最新版
      persist();
    }
    setSync('ok');
  }catch(e){ console.warn(e); setSync('err'); }
  flushing=false; renderAll();
}
async function pull(){
  if(!CONFIG.API_URL) return;
  try{
    const res=await fetch(CONFIG.API_URL+'?action=list'); const j=await res.json();
    if(!j.ok) throw new Error(j.error);
    let changed=false;
    j.records.forEach(sr=>{
      const lr=cache[sr.id];
      if(outbox.includes(sr.id) && lr) return;
      if(!lr || sr.updatedAt>=lr.updatedAt){ if(JSON.stringify(lr)!==JSON.stringify(sr)){ cache[sr.id]=sr; changed=true; } }
    });
    persist(); setSync(outbox.length?'busy':'ok');
    if(changed && !$('modal').classList.contains('on')) renderAll();
  }catch(e){ console.warn(e); setSync('err'); }
}

function go(v){
  if((v==='fix'&&!unlocked.fix)||(v==='adm'&&!unlocked.adm)){ return askPin(v); }
  curView=v;
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));

function askPin(v){
  const need = v==='fix'?CONFIG.REPAIR_PIN:CONFIG.ADMIN_PIN;
  openSheet(`<h2>${v==='fix'?'修復處理':'生管看板'}</h2><p class="hint">請輸入密碼</p><input type="password" id="pin" inputmode="numeric" autocomplete="off"><div class="row" style="margin-top:12px"><button class="btn gray grow" data-act="close">取消</button><button class="btn grow" id="pinok">進入</button></div>`);
  const ok=()=>{ if($('pin').value===need){ unlocked[v]=true; try{sessionStorage.setItem('df_'+v,'1');}catch(e){} closeSheet(); go(v); } else { toast('密碼不正確'); $('pin').value=''; } };
  $('pinok').onclick=ok; $('pin').onkeydown=e=>{ if(e.key==='Enter') ok(); }; setTimeout(()=>{const x=$('pin'); if(x) x.focus();},50);
}

let pSeq=0, pTimer=null, curVars=[];
function showProd(){
  const box=$('f-pm'); if(!box) return;
  const q=($('f-sku').value||'').trim().toUpperCase();
  if(form.p){ const p=form.p; box.innerHTML=`<div class="pcard"><b>${esc(p.pname||p.sku)}</b>${p.pline?` <span class="pill">${esc(p.pline)}</span>`:''}<br>款號 ${esc(p.sku)}${cs(p)?'・'+esc(cs(p)):''}${p.pcat?'・'+esc(p.pcat):''}${p.price!==''&&p.price!=null?'・吊牌價 $'+esc(p.price):''}${p.barcode?'<br><span class="hint">條碼 '+esc(p.barcode)+'</span>':''}</div>`; return; }
  clearTimeout(pTimer);
  if(!q||q.length<3||!CONFIG.API_URL){ box.innerHTML=''; return; }
  box.innerHTML='<div class="hint">輸入中…（按 Enter 或停一下會自動查詢）</div>';
  pTimer=setTimeout(()=>runLookup(false),500);
}
async function runLookup(immediate){
  const inp=$('f-sku'); if(!inp||form.p||!CONFIG.API_URL) return;
  const q=inp.value.trim().toUpperCase(); if(q.length<3) return;
  const my=++pSeq, box=$('f-pm'); box.innerHTML='<div class="hint">查詢商品資料中…</div>';
  let j; try{ j=await lookupRemote(q); }catch(e){ if(my===pSeq) box.innerHTML='<div class="hint">查詢失敗（網路或後端），可直接手動輸入款號送出</div>'; return; }
  if(my!==pSeq || form.p) return;
  if(j.mode==='barcode'){ return setProd(pInfo(j.rows[0])); }
  if(j.mode==='sku'){
    curVars=j.rows;
    if(j.rows.length===1) return setProd(pInfo(j.rows[0]));
    box.innerHTML=`<div class="hint" style="margin-bottom:4px">${esc(pInfo(j.rows[0]).pname)}・請選顏色／尺寸（或略過）</div><div class="sg">${j.rows.slice(0,60).map((r,i)=>`<div data-act="pickvar" data-i="${i}">${esc(cs(pInfo(r))||'（無顏色尺寸）')}<small>${esc(pInfo(r).barcode||'')}</small></div>`).join('')}</div>${j.rows.length>60?'<div class="hint">僅列出前 60 筆，可再輸入條碼</div>':''}`; return;
  }
  if(j.mode==='suggest'&&j.skus.length){ box.innerHTML=`<div class="sg">${j.skus.map(s=>`<div data-act="picksku" data-k="${esc(s[0])}">${esc(s[0])}<small>${esc(s[1])}</small></div>`).join('')}</div>`; return; }
  box.innerHTML='<div class="hint">查無此款號/條碼，可直接手動輸入送出</div>';
}
function setProd(p){ form.p=p; form.sku=p.sku; form.color=cs(p); const s=$('f-sku'); if(s) s.value=p.sku; const c=$('f-color'); if(c) c.value=form.color; showProd(); }
function pickByInput(){ clearTimeout(pTimer); runLookup(true); }

let camStream=null, camStop=false;
async function openScan(){
  openSheet(`<h2>掃描條碼</h2><p class="hint">把吊牌上的條碼放進畫面中央</p><video id="cam" playsinline muted></video><div class="row" style="margin-top:12px"><button class="btn gray grow" data-act="stopscan">取消</button></div>`);
  camStop=false;
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=$('cam'); v.srcObject=camStream; v.play().catch(()=>{});
    let det=null;
    if('BarcodeDetector' in window){ try{ det=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','itf','qr_code']}); }catch(e){} }
    if(!det){ await loadScanLib(); det={ detect: async el=>{ const cv=document.createElement('canvas'); cv.width=el.videoWidth; cv.height=el.videoHeight; cv.getContext('2d').drawImage(el,0,0); const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.9)); const f=new File([blob],'x.jpg',{type:'image/jpeg'}); const h=new Html5Qrcode('scan-tmp'); try{ const t=await h.scanFile(f,false); return [{rawValue:t}]; }catch(e){ return []; } finally{ try{h.clear();}catch(e){} } } }; }
    const loop=async()=>{ if(camStop) return; try{ const r=await det.detect(v); if(r&&r.length){ stopScan(); return onScanned(r[0].rawValue); } }catch(e){} setTimeout(loop,det.constructor&&det.constructor.name==='BarcodeDetector'?150:600); };
    loop();
  }catch(e){ stopScan(); toast('無法開啟相機，請允許相機權限或改手動輸入'); }
}
function loadScanLib(){ if(window.Html5Qrcode) return Promise.resolve(); return new Promise((ok,ng)=>{ if(!$('scan-tmp')){ const d=document.createElement('div'); d.id='scan-tmp'; d.style.display='none'; document.body.appendChild(d);} const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js'; s.onload=ok; s.onerror=ng; document.head.appendChild(s); }); }
function stopScan(){ camStop=true; if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } closeSheet(); }
function onScanned(code){
  code=String(code||'').trim(); const s=$('f-sku'); if(s) s.value=code; form.sku=code; form.p=null;
  if(!CONFIG.API_URL){ toast('已填入掃描內容'); return; }
  runLookup(true);
}

// 照片壓縮
function compress(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=rej;
    fr.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
      const M=900, k=Math.min(1,M/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.7)); }; im.src=fr.result; };
    fr.readAsDataURL(file);
  });
}
$('file').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ form.photos.push(await compress(f)); renderReg(); }catch(err){ toast('照片讀取失敗'); } };

function itemHtml(r, sel){

let fixTab='wait', fixRegion='', sel=new Set();
function renderFix(){
  const v=$('v-fix');
  const wait=live().filter(r=>r.status==='已登記'), fix=live().filter(r=>r.status==='修復中');
  const f=r=>!fixRegion||r.region===fixRegion;
  const asc=(a,b)=>a.regAt.localeCompare(b.regAt);
  const list=(fixTab==='wait'?wait:fix).filter(f).sort(asc);
  [...sel].forEach(id=>{ if(!cache[id]||cache[id].status!=='已登記') sel.delete(id); });
  v.innerHTML=`<div class="seg"><button class="${fixTab==='wait'?'on':''}" data-act="fixtab" data-k="wait">待修復 ${wait.length}</button><button class="${fixTab==='fix'?'on':''}" data-act="fixtab" data-k="fix">修復中 ${fix.length}</button></div>
  <div class="row" style="margin-bottom:10px"><select id="fx-reg" class="grow"><option value="">全部區域</option>${REGIONS.map(r=>`<option ${r===fixRegion?'selected':''}>${r}</option>`).join('')}</select>
  ${fixTab==='wait'?`<button class="btn sec sm" data-act="selall">全選</button>`:''}</div>

  const A=all();
  const detail=[['瑕疵編號','登記時間','店代號','店名','坪數','販售支線','店櫃地址','區域','登記人','款號','商品名稱','商品支線','商品品類','條碼','顏色/尺寸','數量','大類','小類','備註','狀態','滯留天數','開始修復時間','修復人員','結果登記時間','轉正品','轉特賣','轉報廢','特賣價','特賣去向','報廢單號','報廢核准人','結案時間','作廢原因']]
   .concat(A.map(r=>[r.id,r.regAt,r.store,r.storeName,(storeBy(r.store)||{}).ping??'',(storeBy(r.store)||{}).line||'',(storeBy(r.store)||{}).addr||'',r.region,r.regBy,r.sku,r.pname||'',r.pline||'',r.pcat||'',r.barcode||'',r.color||'',r.qty,catsOf(r).join('＋'),subText(r),r.note||'',r.status,ageDays(r),r.startAt||'',r.startBy||'',r.resAt||'',r.ok||0,r.sale||0,r.scrap||0,r.price||'',r.dest||'',r.scrapNo||'',r.scrapBy||'',r.closeAt||'',r.voidWhy||'']));
  const L=A.filter(r=>!r.void);
  const days=[...new Set(L.map(r=>dayOf(r.regAt)))].sort();
  const mx=[['大類','小類',...days,'合計']];
  CATS.forEach(c=>{ const vals=days.map(d=>L.filter(r=>subsOf(r).includes(c[1])&&dayOf(r.regAt)===d).reduce((s,r)=>s+r.qty,0)); mx.push([c[0],c[1],...vals,vals.reduce((a,b)=>a+b,0)]); });
  mx.push(['每日合計','',...days.map(d=>L.filter(r=>dayOf(r.regAt)===d).reduce((s,r)=>s+r.qty,0)),L.reduce((s,r)=>s+r.qty,0)]);
  const sm=[['店代號','店名','坪數','販售支線','區域','登記件數','待修復','修復中','待報廢','已結案','轉正品','轉特賣','轉報廢','修復成功率','每坪瑕疵件數']];
  STORES.forEach(s=>{ const a=L.filter(r=>r.store===s.code); const q=f=>a.filter(f).reduce((x,r)=>x+r.qty,0); const ok=a.reduce((x,r)=>x+(r.ok||0),0), sa=a.reduce((x,r)=>x+(r.sale||0),0), sc=a.reduce((x,r)=>x+(r.scrap||0),0);
    sm.push([s.code,s.name,s.ping??'',s.line||'',s.region,q(()=>true),q(r=>r.status==='已登記'),q(r=>r.status==='修復中'),q(r=>r.status==='待報廢核准'),q(r=>r.status==='已結案'),ok,sa,sc,(ok+sa+sc)?+(ok/(ok+sa+sc)).toFixed(3):'',s.ping?+(q(()=>true)/s.ping).toFixed(2):'']); });
  const st=[['瑕疵編號','狀態','滯留天數','店名','款號','數量','小類','目前階段開始時間']].concat(L.filter(r=>r.status!=='已結案').sort((a,b)=>ageDays(b)-ageDays(a)).map(r=>[r.id,r.status,ageDays(r),r.storeName,r.sku,r.qty,subText(r),stageStart(r)]));
  const wb=X.utils.book_new();
  [['明細',detail],['日期x小類別',mx],['各店彙總',sm],['未結案滯留',st]].forEach(([n,d])=>{ const ws=X.utils.aoa_to_sheet(d); ws['!cols']=d[0].map(()=>({wch:14})); X.utils.book_append_sheet(wb,ws,n); });
  X.writeFile(wb,`瑕疵品報表_${nowStr().slice(0,10)}.xlsx`); toast('已下載');
}

// ================= 示範資料 =================
function loadDemo(){
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const names=['王小明','林小美','陳大華','張雅婷'], fixers=['林師傅','黃師傅'];
  for(let i=0;i<45;i++){
    const st=STORES[Math.floor(rnd()*STORES.length)], c=CATS[Math.floor(rnd()*CATS.length)];
    const d=new Date(); d.setDate(d.getDate()-Math.floor(rnd()*13)); d.setHours(9+Math.floor(rnd()*10),Math.floor(rnd()*60),0);
    const ds=`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:00`;
    const add=(h)=>{ const x=new Date(d.getTime()+h*3600000); return `${x.getFullYear()}-${p2(x.getMonth()+1)}-${p2(x.getDate())} ${p2(x.getHours())}:${p2(x.getMinutes())}:00`; };
    const r={id:'DEMO-'+String(i+1).padStart(3,'0'),store:st.code,storeName:st.name,region:st.region,regAt:ds,regBy:names[i%4],sku:'AS2'+(3000+Math.floor(rnd()*900)),color:['黑/M','白/S','藍/L',''][i%4],qty:1+Math.floor(rnd()*3),cat:c[0],sub:c[1],note:'',photos:[]};
    const x=rnd();
    if(x>0.25){ r.startAt=add(10+rnd()*40); r.startBy=fixers[i%2]; }
    if(x>0.5){ const k=rnd(); r.resAt=add(60+rnd()*60); r.resBy=r.startBy; r.ok=0;r.sale=0;r.scrap=0;
      if(k<.6) r.ok=r.qty; else if(k<.8){ r.sale=r.qty; r.price=490; r.dest='特賣會'; } else r.scrap=r.qty;
      if(r.scrap){ if(rnd()>.5){ r.scrapNo='SC'+(1000+i); r.scrapAt=add(130); r.scrapBy='管理員'; r.closeAt=r.scrapAt; } } else r.closeAt=r.resAt; }
    r.status=statusOf(r); r.updatedAt=ds+'.000'; cache[r.id]=r;
  }
  persist(); renderAll(); toast('已載入示範資料');
}

// ================= 事件 =================
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id, k=b.dataset.k;
  if(a==='sel'){ e.stopPropagation(); const set=curView==='adm'?admSel:sel; (b.checked?set.add(id):set.delete(id)); renderAll(); return; }
  switch(a){
    case 'major': form.major=k; keepForm(); renderReg(); break;
    case 'sub': toggleSub(k); break;
    case 'pickrecent': { const c=CATS.find(c=>c[1]===k); if(!form.subs.includes(k)) form.major=c[0]; toggleSub(k); break; }
    case 'qty': { const q=$('f-qty'); form.qty=Math.max(1,(parseInt(q.value)||1)+(+b.dataset.d)); q.value=form.qty; break; }
    case 'chgstore': chooseStore(); break;
    case 'scan': keepForm(); openScan(); break;
    case 'stopscan': stopScan(); break;
    case 'picksku': { const k=b.dataset.k; $('f-sku').value=k; form.sku=k; form.p=null; runLookup(true); break; }
    case 'pickvar': setProd(pInfo(curVars[+b.dataset.i])); break;
    case 'upprod': pullProdInfo(true).then(()=>renderAll()); break;
    case 'copylast': { const r=lastRec(); form.sku=r.sku; form.color=r.color||''; $('f-sku').value=form.sku; $('f-color').value=form.color; form.p=r.pname?{barcode:r.barcode||'',sku:r.sku,pname:r.pname,color:r.color||'',size:'',pline:r.pline||'',pcat:r.pcat||'',price:r.price0||''}:null; showProd(); break; }
    case 'addphoto': keepForm(); $('file').click(); break;
    case 'delphoto': keepForm(); form.photos.splice(+b.dataset.i,1); renderReg(); break;
    case 'me': openMe(); break;
    case 'minef': mineFilter=k; renderMine(); break;
    case 'fixtab': fixTab=k; renderFix(); break;
    case 'selall': { const f=r=>!fixRegion||r.region===fixRegion; live().filter(r=>r.status==='已登記'&&f(r)).forEach(r=>sel.add(r.id)); renderFix(); break; }
    case 'batchstart': startRepair([...sel]); break;
    case 'startone': closeSheet(); startRepair([id]); break;
    case 'result': closeSheet(); openResult(id); break;
    case 'allok': e.stopPropagation(); quickAllOk(id); break;
    case 'detail': openDetail(id); break;
    case 'void': voidRec(id); break;
    case 'admtab': admTab=k; renderAdm(); break;
    case 'admdays': admDays=+k; renderAdm(); break;
    case 'admselall': live().filter(r=>r.status==='待報廢核准').forEach(r=>admSel.add(r.id)); renderAdm(); break;
    case 'admapprove': approveScrap([...admSel]); break;
    case 'approveone': closeSheet(); approveScrap([id]); break;
    case 'export': doExport(); break;
    case 'demo': loadDemo(); break;
    case 'clearall': if(confirm('確定清除本機所有瑕疵資料？')){ cache={}; outbox=[]; persist(); renderAll(); } break;
  }
});
function toggleSub(k){ keepForm(); const i=form.subs.indexOf(k); if(i>=0) form.subs.splice(i,1); else if(form.subs.length>=MAXSUB){ toast('最多選 '+MAXSUB+' 項'); return; } else form.subs.push(k); renderReg(); }
function keepForm(){ const s=$('f-sku'); if(!s) return; form.sku=s.value; form.color=$('f-color').value; form.note=$('f-note').value; form.qty=Math.max(1,parseInt($('f-qty').value)||1); }

function renderAll(){
  renderWho();
  const L=live(); const nf=L.filter(r=>r.status==='已登記').length, na=L.filter(r=>r.status==='待報廢核准').length;
  const d1=$('dot-fix'), d2=$('dot-adm'); d1.style.display=nf?'':'none'; d1.textContent=nf; d2.style.display=na?'':'none'; d2.textContent=na;
  if(curView==='reg'){ if(!$('f-sku')) renderReg(); }
  else if(curView==='mine') renderMine();
  else if(curView==='fix') renderFix();
  else if(curView==='adm') renderAdm();
}
// 初始化
if(!me.name) setTimeout(openMe,300);
renderReg(); renderAll();
if(CONFIG.API_URL){ pullProdInfo(); pull().then(flush); setInterval(()=>{ pull(); flush(); }, CONFIG.POLL_SEC*1000); }
window.__df={cache:()=>cache,go,CONFIG};
})();
</script>
