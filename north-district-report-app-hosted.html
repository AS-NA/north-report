<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>北區工作回報系統</title>
<style>
  :root{
    --bg:#17181C;
    --panel:#212328;
    --panel-2:#26282E;
    --line:#34363D;
    --accent:#F2994A;
    --teal:#4FBDBA;
    --text:#F3F1EA;
    --text-mute:#9A9CA3;
    --danger:#E0654F;
    --font-display:'Space Grotesk', 'Noto Sans TC', sans-serif;
    --font-body:'Inter', 'Noto Sans TC', sans-serif;
    --font-mono:'JetBrains Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 0%, rgba(242,153,74,0.06), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
  .app{ width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); position:relative; }

  header{ padding:22px 20px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; background:var(--bg); }
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{ font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:0.01em; display:flex; align-items:center; gap:8px; }
  .brand .dot{ width:9px;height:9px;border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(242,153,74,0.18); flex-shrink:0;}
  .whoami{ font-family:var(--font-mono); font-size:12px; color:var(--text-mute); border:1px solid var(--line); padding:6px 10px; border-radius:20px; background:var(--panel); cursor:pointer; display:flex; align-items:center; gap:6px; max-width:140px; flex-shrink:0;}
  .whoami span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tabs{ display:flex; margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:3px; gap:3px; }
  .tab{ flex:1; text-align:center; padding:9px 0; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--text-mute); cursor:pointer; user-select:none; transition:background .15s, color .15s; }
  .tab.active{ background:var(--accent); color:#1B1300; }

  main{flex:1; padding:18px 20px 100px;}
  .view{display:none;}
  .view.active{display:block; animation:fade .2s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .sched-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:18px; }
  .sched-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .sched-title{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.06em; color:var(--accent); text-transform:uppercase;}
  .sched-day{ font-family:var(--font-display); font-weight:700; font-size:15px;}
  .sched-item{ padding:9px 0; border-top:1px dashed var(--line); }
  .sched-item:first-of-type{border-top:none;}
  .sched-loc-row{ display:flex; align-items:baseline; gap:8px; margin-bottom:4px;}
  .sched-loc{ font-weight:700; font-size:14px;}
  .sched-time{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-mute);}
  .sched-tasks{ font-size:13px; color:var(--text-mute); line-height:1.6;}
  .sched-use{ margin-top:8px; }
  .sched-empty{ color:var(--text-mute); font-size:13px; text-align:center; padding:6px 0;}

  .field{margin-bottom:16px;}
  .field label{ display:block; font-size:12px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-mute); margin-bottom:7px; font-family:var(--font-mono);}
  input[type=text], textarea, select{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:12px 13px; border-radius:10px; font-size:15px; font-family:var(--font-body); resize:none;
  }
  select{ appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239A9CA3' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 13px center; background-size:16px; }
  input[type=text]:focus, textarea:focus, select:focus{ outline:none; border-color:var(--accent); }
  textarea{min-height:110px; line-height:1.5;}

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:14px; font-weight:600; cursor:pointer; font-family:var(--font-body); width:100%;}
  .btn:active{transform:scale(0.98);}
  .btn.ghost{background:transparent;}
  .btn.accent{ background:var(--accent); color:#1B1300; border-color:var(--accent);}
  .btn.accent:disabled{opacity:0.5;}
  .btn.small{width:auto; padding:8px 12px; font-size:12.5px;}

  .gps-row{ display:flex; gap:10px; align-items:center; margin-top:8px; font-family:var(--font-mono); font-size:12px; color:var(--teal);}
  .photo-box{ border:1.5px dashed var(--line); border-radius:12px; padding:14px; text-align:center; background:var(--panel); cursor:pointer; position:relative; overflow:hidden;}
  .photo-box img{ width:100%; max-height:220px; object-fit:cover; border-radius:8px; display:block;}
  .photo-box .hint{color:var(--text-mute); font-size:13px; padding:20px 0;}
  .photo-box .hint b{color:var(--accent); display:block; font-size:22px; margin-bottom:4px; font-weight:400;}

  .submit-bar{ position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center; padding:14px 20px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 60%, transparent); z-index:30; pointer-events:none;}
  .submit-bar .btn{max-width:420px; pointer-events:auto; box-shadow:0 8px 24px rgba(242,153,74,0.25);}

  .status-msg{ text-align:center; font-size:12.5px; color:var(--teal); font-family:var(--font-mono); margin-top:10px; min-height:16px;}

  .log-toolbar{display:flex; gap:8px; margin-bottom:14px;}
  .log-toolbar input{flex:1;}
  .empty{ text-align:center; color:var(--text-mute); padding:60px 20px; font-size:14px;}
  .stub{ position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:16px; overflow:hidden;}
  .stub::before, .stub::after{ content:''; position:absolute; top:38px; width:16px; height:16px; border-radius:50%; background:var(--bg);}
  .stub::before{left:-8px;}
  .stub::after{right:-8px;}
  .stub-top{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px 10px; border-bottom:1px dashed var(--line);}
  .stub-name{font-weight:700; font-size:14.5px;}
  .stub-time{font-family:var(--font-mono); font-size:11.5px; color:var(--text-mute);}
  .stub-photo img{width:100%; display:block; max-height:260px; object-fit:cover;}
  .stub-body{padding:14px 16px 16px;}
  .stub-site{ display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:12px; color:var(--accent); margin-bottom:8px;}
  .stub-note{font-size:14px; line-height:1.6; color:var(--text); white-space:pre-wrap;}
  .stub-map{font-size:11.5px; color:var(--teal); text-decoration:none; font-family:var(--font-mono); display:inline-block; margin-top:8px;}

  .loading{text-align:center; padding:40px; color:var(--text-mute); font-family:var(--font-mono); font-size:13px;}

  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; display:none; align-items:center; justify-content:center; padding:24px;}
  .modal-bg.active{display:flex;}
  .modal{ background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:20px; width:100%; max-width:340px;}
  .modal h3{margin:0 0 14px; font-family:var(--font-display); font-size:16px;}
  .modal .btn{margin-top:10px;}
  .note{font-size:11.5px; color:var(--text-mute); margin-top:10px; line-height:1.5;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand-row">
      <div class="brand"><span class="dot"></span>北區工作回報系統</div>
      <div class="whoami" id="whoamiBtn"><span id="whoamiLabel">設定姓名</span></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="new">新增回報</div>
      <div class="tab" data-tab="log">回報紀錄</div>
    </div>
  </header>

  <main>
    <section class="view active" id="view-new">
      <div class="sched-card" id="schedCard"></div>

      <div class="field">
        <label>回報人</label>
        <select id="fName">
          <option value="">請選擇</option>
          <option value="賴昱誠">賴昱誠</option>
          <option value="__other__">其他（手動輸入）</option>
        </select>
        <input type="text" id="fNameOther" placeholder="輸入姓名" style="display:none; margin-top:8px;">
      </div>

      <div class="field">
        <label>站點 / 地點</label>
        <select id="fSite">
          <option value="">請選擇</option>
          <option value="西門二店">西門二店</option>
          <option value="西門大碼">西門大碼</option>
          <option value="西門IP">西門IP</option>
          <option value="新莊宏匯">新莊宏匯</option>
          <option value="台北倉">台北倉</option>
          <option value="__other__">其他（手動輸入）</option>
        </select>
        <input type="text" id="fSiteOther" placeholder="輸入站點名稱" style="display:none; margin-top:8px;">
        <div class="gps-row">
          <button class="btn small ghost" id="gpsBtn" type="button">📍 附加 GPS 定位</button>
          <span id="gpsStatus"></span>
        </div>
      </div>

      <div class="field">
        <label>照片</label>
        <div class="photo-box" id="photoBox">
          <div class="hint" id="photoHint"><b>+</b>拍照 / 選擇照片</div>
          <img id="photoPreview" style="display:none;">
        </div>
        <input type="file" accept="image/*" capture="environment" id="fPhoto" style="display:none;">
      </div>

      <div class="field">
        <label>回報內容</label>
        <textarea id="fNote" placeholder="說明工作內容、狀況..."></textarea>
      </div>

      <div class="status-msg" id="submitStatus"></div>
    </section>

    <section class="view" id="view-log">
      <div class="log-toolbar">
        <input type="text" id="logSearch" placeholder="搜尋姓名 / 站點 / 內容">
        <button class="btn small ghost" id="refreshBtn" type="button">重新整理</button>
      </div>
      <div id="logList"><div class="loading">載入中...</div></div>
    </section>
  </main>

  <div class="submit-bar" id="submitBarWrap">
    <button class="btn accent" id="submitBtn">送出回報</button>
  </div>

  <div class="modal-bg" id="nameModalBg">
    <div class="modal">
      <h3>設定你的姓名</h3>
      <input type="text" id="modalNameInput" placeholder="輸入姓名，之後自動帶入">
      <button class="btn accent" id="modalNameSave">儲存</button>
      <div class="note">姓名只存在你自己的手機瀏覽器裡，方便下次不用重選。回報內容則是共用的，同事與主管都看得到。</div>
    </div>
  </div>

  <div class="modal-bg" id="imgModalBg">
    <div style="max-width:92vw; max-height:86vh;">
      <img id="imgModalSrc" style="max-width:92vw; max-height:86vh; border-radius:10px; display:block;">
    </div>
  </div>
</div>

<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  let currentPhoto = null;
  let gpsData = null;

  // ==== Google Apps Script backend endpoint ====
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzQQJ9AhaaKEFkzBpn9JSY7-sYsvOQu0e-U-hz1ssnoZFMjjMxNHc0lpdJpdj9wXO_c/exec';

  const SCHEDULE = {
    1:{label:'週一', items:[
      {site:'新莊宏匯', time:'10:30', tasks:['追加整理跟入倉','撤貨','區內勻貨']}
    ]},
    2:{label:'週二', items:[
      {site:'西門二店', time:'10:30', tasks:['撤貨+跨區內抓貨']},
      {site:'西門大碼', time:'10:30', tasks:['撤貨+跨區內抓貨']}
    ]},
    3:{label:'週三', items:[
      {site:'新莊宏匯', time:'09:30', tasks:['整倉','清出新品區','新品整理+入倉','支援EC勻貨']}
    ]},
    4:{label:'週四', items:[
      {site:'西門二店', time:'09:30', tasks:['整倉','清出新品區','新品整理+入倉']},
      {site:'西門IP', time:'', tasks:['整倉+清出新品區','新品整理+入倉']}
    ]},
    5:{label:'週五', items:[
      {site:'台北倉', time:'', tasks:['新店商品整新','門市支援']}
    ]}
  };

  function renderSchedule(){
    const day = new Date().getDay();
    const card = $('schedCard');
    const today = SCHEDULE[day];
    if(!today){
      card.innerHTML = `<div class="sched-head"><span class="sched-title">今日排程</span></div><div class="sched-empty">今天沒有固定排程</div>`;
      return;
    }
    const itemsHtml = today.items.map((it, idx)=>{
      const tasksHtml = it.tasks.map((t,i)=>`${i+1}. ${escapeHtml(t)}`).join('　');
      return `<div class="sched-item">
        <div class="sched-loc-row"><span class="sched-loc">${escapeHtml(it.site)}</span>${it.time?`<span class="sched-time">${it.time}</span>`:''}</div>
        <div class="sched-tasks">${tasksHtml}</div>
        <button class="btn small accent sched-use" data-idx="${idx}" type="button">帶入這筆行程</button>
      </div>`;
    }).join('');
    card.innerHTML = `<div class="sched-head"><span class="sched-title">今日排程</span><span class="sched-day">${today.label}</span></div>${itemsHtml}`;
    card.querySelectorAll('.sched-use').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const it = today.items[+btn.dataset.idx];
        applyScheduleToForm(it);
      });
    });
  }
  function applyScheduleToForm(it){
    const opt = Array.from($('fSite').options).find(o=>o.value===it.site);
    if(opt){ $('fSite').value = it.site; $('fSiteOther').style.display='none'; }
    else{ $('fSite').value = '__other__'; $('fSiteOther').style.display='block'; $('fSiteOther').value = it.site; }
    $('fNote').value = it.tasks.map(t=>`☐ ${t}`).join('\n');
    window.scrollTo({top:0, behavior:'smooth'});
  }

  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      $('view-'+t.dataset.tab).classList.add('active');
      $('submitBarWrap').style.display = t.dataset.tab==='new' ? 'flex':'none';
      if(t.dataset.tab==='log') loadLog();
    });
  });

  $('fName').addEventListener('change', ()=>{ $('fNameOther').style.display = $('fName').value==='__other__' ? 'block':'none'; });
  $('fSite').addEventListener('change', ()=>{ $('fSiteOther').style.display = $('fSite').value==='__other__' ? 'block':'none'; });

  function loadName(){
    try{
      const v = localStorage.getItem('worker-name');
      if(v){
        const opt = Array.from($('fName').options).find(o=>o.value===v);
        if(opt){ $('fName').value = v; }
        else{ $('fName').value='__other__'; $('fNameOther').style.display='block'; $('fNameOther').value=v; }
        $('whoamiLabel').textContent = v;
      }
    }catch(e){}
  }
  $('whoamiBtn').addEventListener('click', ()=>{
    $('modalNameInput').value = getSelectedName() || '';
    $('nameModalBg').classList.add('active');
  });
  $('modalNameSave').addEventListener('click', ()=>{
    const v = $('modalNameInput').value.trim();
    if(!v) return;
    const opt = Array.from($('fName').options).find(o=>o.value===v);
    if(opt){ $('fName').value=v; $('fNameOther').style.display='none'; }
    else{ $('fName').value='__other__'; $('fNameOther').style.display='block'; $('fNameOther').value=v; }
    $('whoamiLabel').textContent = v;
    $('nameModalBg').classList.remove('active');
    try{ localStorage.setItem('worker-name', v); }catch(e){}
  });
  $('nameModalBg').addEventListener('click', (e)=>{ if(e.target===$('nameModalBg')) $('nameModalBg').classList.remove('active'); });

  function getSelectedName(){ return $('fName').value==='__other__' ? $('fNameOther').value.trim() : $('fName').value; }
  function getSelectedSite(){ return $('fSite').value==='__other__' ? $('fSiteOther').value.trim() : $('fSite').value; }

  $('gpsBtn').addEventListener('click', ()=>{
    if(!navigator.geolocation){ $('gpsStatus').textContent='此裝置不支援定位'; return; }
    $('gpsStatus').textContent = '定位中...';
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        gpsData = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        $('gpsStatus').textContent = `已附加 (${gpsData.lat.toFixed(4)}, ${gpsData.lng.toFixed(4)})`;
      },
      ()=>{ $('gpsStatus').textContent = '定位失敗，可略過'; },
      { timeout:10000 }
    );
  });

  $('photoBox').addEventListener('click', ()=> $('fPhoto').click());
  $('fPhoto').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 900;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        currentPhoto = canvas.toDataURL('image/jpeg', 0.6);
        $('photoPreview').src = currentPhoto;
        $('photoPreview').style.display = 'block';
        $('photoHint').style.display = 'none';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  $('submitBtn').addEventListener('click', async ()=>{
    const name = getSelectedName();
    const site = getSelectedSite();
    const note = $('fNote').value.trim();
    if(!name){ setStatus('請選擇或輸入回報人姓名', true); return; }
    if(!site){ setStatus('請選擇或輸入站點', true); return; }
    if(!note && !currentPhoto){ setStatus('請至少填寫內容或附上照片', true); return; }

    $('submitBtn').disabled = true;
    $('submitBtn').textContent = '送出中...';
    setStatus('', false);

    const id = Date.now()+'-'+Math.random().toString(36).slice(2,8);
    const entry = { id, name, site, note, photo: currentPhoto, gps: gpsData, ts: new Date().toISOString() };

    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify(entry)
      });
      const json = await res.json();
      if(!json || !json.success) throw new Error('儲存失敗');

      try{ localStorage.setItem('worker-name', name); }catch(e){}
      setStatus('✓ 已送出回報', false);
      $('fNote').value='';
      currentPhoto=null; gpsData=null;
      $('photoPreview').style.display='none'; $('photoPreview').src='';
      $('photoHint').style.display='block';
      $('gpsStatus').textContent='';
    }catch(err){
      setStatus('送出失敗，請檢查網路連線後再試一次', true);
      console.error(err);
    }finally{
      $('submitBtn').disabled=false;
      $('submitBtn').textContent='送出回報';
    }
  });
  function setStatus(msg, isErr){
    $('submitStatus').textContent = msg;
    $('submitStatus').style.color = isErr ? 'var(--danger)' : 'var(--teal)';
  }

  let allEntries = [];
  async function loadLog(){
    $('logList').innerHTML = '<div class="loading">載入中...</div>';
    try{
      const res = await fetch(APPS_SCRIPT_URL);
      const data = await res.json();
      const entries = (Array.isArray(data) ? data : []).filter(e=>e && e.id);
      entries.sort((a,b)=> new Date(b.ts) - new Date(a.ts));
      allEntries = entries;
      renderLog(entries);
    }catch(e){
      $('logList').innerHTML = '<div class="empty">載入失敗，請確認網路連線，或點「重新整理」再試一次</div>';
      console.error(e);
    }
  }
  function renderLog(entries){
    if(entries.length===0){ $('logList').innerHTML = '<div class="empty">還沒有任何回報紀錄</div>'; return; }
    $('logList').innerHTML = entries.map(e=>{
      const d = new Date(e.ts);
      const timeStr = isNaN(d) ? String(e.ts) : d.toLocaleString('zh-TW', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      const mapLink = e.gps ? `<a class="stub-map" href="https://maps.google.com/?q=${e.gps}" target="_blank" rel="noopener">在地圖上開啟 →</a>` : '';
      const photoHtml = e.photo ? `<div class="stub-photo"><img src="${e.photo}" data-full="${e.photo}" class="stub-img"></div>` : '';
      const siteHtml = e.site ? `<div class="stub-site">📍 ${escapeHtml(e.site)}</div><br>` : '';
      return `<div class="stub">
        <div class="stub-top"><div class="stub-name">${escapeHtml(e.name)}</div><div class="stub-time">${timeStr}</div></div>
        ${photoHtml}
        <div class="stub-body">${siteHtml}<div class="stub-note">${escapeHtml(e.note||'（無文字內容）')}</div>${mapLink}</div>
      </div>`;
    }).join('');
    document.querySelectorAll('.stub-img').forEach(img=>{
      img.addEventListener('click', ()=>{ $('imgModalSrc').src = img.dataset.full; $('imgModalBg').classList.add('active'); });
    });
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  $('imgModalBg').addEventListener('click', ()=> $('imgModalBg').classList.remove('active'));
  $('refreshBtn').addEventListener('click', loadLog);
  $('logSearch').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toLowerCase();
    if(!q){ renderLog(allEntries); return; }
    renderLog(allEntries.filter(en=> (en.name||'').toLowerCase().includes(q) || (en.site||'').toLowerCase().includes(q) || (en.note||'').toLowerCase().includes(q)));
  });

  renderSchedule();
  loadName();
})();
</script>
</body>
</html>
